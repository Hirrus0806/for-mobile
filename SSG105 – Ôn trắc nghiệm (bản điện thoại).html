 biểu."}},"405":{"q":"Đâu là ví dụ tốt nhất về phản hồi mang tính xây dựng?","o":{"A":"Không dành toàn bộ sự chú ý cho khách hàng tạo ra hình ảnh rằng chúng ta không nghĩ họ quan trọng.","B":"Tôi tin rằng việc dùng điện thoại di động cho mục đích cá nhân trong giờ làm việc là không được phép ở công ty này, nhưng có vẻ bạn không thấy lợi ích thực sự của chính sách này.","C":"Bạn đang không chú ý đến khách hàng khi bạn vừa trò chuyện với người khác cùng lúc.","D":"Bạn đã được đào tạo rằng bạn sẽ tạo ấn tượng tích cực hơn cho công ty nếu dành toàn bộ sự chú ý cho khách hàng."}},"406":{"q":"Năm chế độ giải quyết xung đột do Kenneth Thomas (1976) phát triển là gì?","o":{"A":"(1) cạnh tranh, (2) hợp tác, (3) thỏa hiệp, (4) né tránh và (5) nhượng bộ","B":"(1) cạnh tranh, (2) kết hợp, (3) làm trầm trọng thêm, (4) kháng cự và (5) phớt lờ","C":"(1) cạnh tranh, (2) kết hợp, (3) thỏa hiệp, (4) né tránh và (5) nhượng bộ","D":"(1) cạnh tranh, (2) hợp tác, (3) làm trầm trọng thêm, (4) kháng cự và (5) phớt lờ"}},"407":{"q":"Câu hỏi phỏng vấn nào sau đây là câu hỏi hành vi (behavioral question)?","o":{"A":"Bạn muốn ở đâu trong năm năm tới?","B":"Môi trường làm việc nào, có cấu trúc hay không có cấu trúc, là nơi bạn làm việc hiệu quả nhất?","C":"Bạn trẻ hơn hầu hết những người bạn sẽ giám sát. Bạn có nghĩ đó là vấn đề không?","D":"Hãy kể về một lần bạn đối mặt với vấn đề lớn trong dự án nhóm và bạn đã xử lý nó như thế nào?"}},"408":{"q":"Ví dụ nào sau đây minh họa rõ nhất khái niệm hỗ trợ xã hội (social facilitation)?","o":{"A":"Sarah là vận động viên, cô chạy nhanh hơn trong cuộc đua khi thi đấu với người khác so với khi chạy một mình.","B":"Tom vật lộn giải một bài toán phức tạp trước các bạn cùng lớp, dù ở nhà anh có thể giải dễ dàng.","C":"Jake làm việc hiệu quả hơn trong một dự án khi ở trong phòng yên tĩnh, không bị xao nhãng.","D":"Emily hoàn thành một trò xếp hình đơn giản nhanh hơn khi có người xem so với khi ở một mình."}},"409":{"q":"Hành động nào thuộc chiến lược “Xác định các giải pháp sẵn có”?","o":{"A":"Xác định vấn đề","B":"Sắp xếp thông tin một cách logic","C":"So sánh và đối chiếu các giải pháp khả dĩ","D":"Bảo vệ giải pháp của bạn"}},"410":{"q":"Những câu hỏi nào dưới đây ứng viên nên chuẩn bị để hỏi trong buổi phỏng vấn?","o":{"A":"Xin mô tả thói quen làm việc thường ngày của vị trí này trong một ngày điển hình?","B":"Làm sao tôi có thể được thăng chức?","C":"Khi nào quý công ty dự kiến đưa ra quyết định tuyển dụng, vì trong thông báo tuyển dụng có nói vị trí này đang cần gấp?","D":"Mức lương là bao nhiêu?"}},"411":{"q":"Tình huống nào dưới đây được coi là lười biếng xã hội (social loafing)?","o":{"A":"Một sinh viên tự làm một bài báo một mình","B":"Một sinh viên làm hết bài tập nhóm","C":"Ba sinh viên cùng làm bài tập","D":"Cả nhóm cùng làm việc chăm chỉ như nhau cho bài tập nhóm"}},"412":{"q":"Những đặc điểm nào ngày càng trở nên quan trọng trong thế giới kinh doanh ngày nay?","o":{"A":"Đa văn hóa và trí tuệ văn hóa","B":"Giao tiếp bằng lời và phi ngôn ngữ","C":"Trí tuệ văn hóa và ngôn ngữ","D":"Phong cách, nhịp độ, ngôn ngữ và giao tiếp phi ngôn ngữ"}},"413":{"q":"Mô hình Duy trì sự tự đánh giá (Self-Evaluation Maintenance – SEM) gợi ý hàm ý nào?","o":{"A":"Mọi người có nhiều khả năng so sánh với bạn bè hoặc đồng nghiệp hơn là với mức trung bình của ngành hay quốc gia.","B":"Học sinh trung bình có tự khái niệm học thuật cao hơn khi học ở một trường dưới trung bình.","C":"Các nhà quản lý có thể ưa chuộng những ứng viên dưới mức tối ưu, những người ít có khả năng thách thức vị thế của họ trong tổ chức.","D":"Những người kém kỹ năng thường nghĩ rằng mình ngang bằng hoặc vượt trội hơn bạn bè trong các nhiệm vụ như khả năng làm bài thi."}},"414":{"q":"Chiến lược đánh giá thông tin bằng tư duy phản biện nào đòi hỏi bạn hỏi và trả lời các câu hỏi logic như “Chúng ta đang cố trả lời câu hỏi nào?”, “Quan điểm nào đang được bày tỏ?” và “Các hàm ý là gì?”?","o":{"A":"Đọc để hiểu bằng cách dùng mã hóa văn bản","B":"Xem xét các lập luận","C":"Làm rõ tư duy","D":"Nuôi dưỡng “thói quen tư duy”"}},"415":{"q":"Khi soạn thư ứng tuyển, điều nào sau đây không nên thêm vào phần mở đầu của thư?","o":{"A":"Tên người giới thiệu đã giới thiệu công việc này cho bạn","B":"Hiểu biết của bạn về vị trí hoặc công ty","C":"Lý do bạn thấy vị trí này thú vị","D":"Những thành tích quan trọng nhất của bạn"}},"416":{"q":"Khi đánh giá kế hoạch nghề nghiệp của mình, bạn nên làm gì đầu tiên?","o":{"A":"Tìm kiếm một nghề","B":"Thực hiện tự đánh giá","C":"Luôn xem xét và điều chỉnh kế hoạch","D":"Tập trung phát triển mục tiêu"}},"417":{"q":"Khi nào chúng ta nên xây dựng các nhóm?","o":{"A":"Cần nhiều năng lực và kỹ năng khác nhau.","B":"Chỉ cần mức tự quyết tối thiểu.","C":"Lợi ích của các thành viên khác nhau hoặc xung đột.","D":"Một tổ chức ghi nhận công lao cho cá nhân về kết quả vận hành."}},"418":{"q":"Khi điều hành một cuộc họp, bạn nên","o":{"A":"Táo bạo và thẳng thắn, không sợ làm tổn thương cảm xúc của người khác","B":"Để mọi thành viên nhóm nói ra cảm xúc và ý kiến của mình","C":"Làm cho nó ngắn nhất có thể vì thời gian là vàng","D":"Ưu ái các mối quan hệ"}},"419":{"q":"Khi viết thư xin việc, bạn nên:","o":{"A":"Chỉ sao chép và dán cùng một bức thư lặp đi lặp lại.","B":"Tạo một bức thư độc đáo cho mỗi lần ứng tuyển.","C":"Sao chép đoạn đầu và đoạn cuối, nhưng điều chỉnh phần còn lại cho phù hợp với nhà tuyển dụng.","D":"Chứng minh trình độ của ứng viên cho một vị trí để loại bỏ đối thủ cạnh tranh."}},"420":{"q":"Khi phân tích trình độ và sở thích công việc, bạn sẽ xem xét những điểm tích cực nhất của mình, bao gồm","o":{"A":"thành tích, lý lịch, kỹ năng mềm, người giới thiệu chuyên nghiệp","B":"điểm mạnh, điểm yếu, sở thích, kỹ năng","C":"thành tựu, học vấn, kinh nghiệm và đặc điểm cá nhân","D":"giải thưởng, học vấn, trình độ, sở thích"}},"421":{"q":"Khi phân tích sở thích công việc, câu hỏi nào sau đây không cần thiết phải cân nhắc?","o":{"A":"Bạn thích làm việc trong nhà, ngoài môi trường văn phòng, hay trong nhiều môi trường làm việc khác nhau?","B":"Bạn muốn làm việc trong công ty lớn có môi trường làm việc có cấu trúc, hay thích công ty nhỏ hoặc ít cấu trúc hơn?","C":"Bạn muốn làm việc một mình, làm việc với người khác hay phụ trách?","D":"Bạn có muốn làm việc trong môi trường thoải mái, cởi mở với những người có cùng sở thích và đời sống cá nhân như bạn không?"}},"422":{"q":"Xung đột do nhận thức sai về sự khác biệt (conflicts of misperceived differences) nảy sinh khi nào?","o":{"A":"Củng cố hoặc làm suy yếu tác động của nhau","B":"Diễn giải sai hành động hoặc cảm xúc của nhau","C":"Khác nhau về cách đạt mục tiêu hoặc theo đuổi giá trị","D":"Có những giá trị hoàn toàn khác nhau hoặc xếp hạng cùng các giá trị theo thứ tự khác biệt đáng kể"}},"423":{"q":"Khi nào một người có được quyền lực chuyên gia (expert power)?","o":{"A":"Người A có địa vị cao hơn người B","B":"Người A có kiến thức chuyên môn nhiều hơn người B","C":"Nhóm của người A lớn hơn nhóm của người B","D":"Người A có nhiều bạn hơn người B"}},"424":{"q":"Tư duy phản biện và tư duy sáng tạo bổ trợ cho nhau như thế nào trong một dự án nhóm ở trường đại học?","o":{"A":"Chúng tranh giành vị thế thống trị, cản trở tiến độ của nhóm.","B":"Tư duy phản biện đi cùng tư duy sáng tạo thúc đẩy những góc nhìn mới mẻ để xem xét vấn đề và tình huống.","C":"Tư duy sáng tạo chỉ tập trung vào trực giác, trong khi tư duy phản biện nhấn mạnh phân tích logic.","D":"Tư duy phản biện và sáng tạo tách biệt và không đóng góp cho nhau trong bối cảnh nhóm."}},"425":{"q":"Làm thế nào để phát triển kỹ năng tư duy sáng tạo thông qua “Vẽ” (Drawing)?","o":{"A":"Phát triển ý tưởng và mở rộng các khả năng của chúng","B":"Dùng sơ đồ tư duy để ghi lại ý tưởng","C":"Giải thích cách ý tưởng của bạn vượt ra ngoài hiện trạng và đóng góp cho một cuộc thảo luận","D":"Ghi chép"}},"426":{"q":"Một nhà lãnh đạo thể hiện hiệu quả ảnh hưởng truyền cảm hứng (inspirational influence) trong nhóm bằng cách nào?","o":{"A":"Bằng cách thực thi nghiêm ngặt các quy tắc và quy định","B":"Bằng cách dùng ảnh hưởng xã hội hoặc liên cá nhân.","C":"Bằng cách quản lý vi mô các thành viên để bảo đảm hoàn thành nhiệm vụ","D":"Bằng cách chỉ dựa vào quyền hạn chức vụ để ra quyết định"}},"427":{"q":"Bạn nên phản ứng thế nào khi ai đó “xâm phạm” không gian cá nhân của bạn trong lúc trò chuyện? Câu hỏi có nhiều hơn một đáp án","o":{"A":"Lùi lại để thiết lập lại ranh giới cá nhân của bạn","B":"Khoanh tay để chặn họ lại","C":"Hoàn toàn phớt lờ tình huống","D":"Giữ im lặng"}},"428":{"q":"Vì sao việc dùng định dạng tốt cho email kinh doanh hiệu quả lại quan trọng, đặc biệt trong môi trường chuyên nghiệp?","o":{"A":"Tạo ấn tượng có năng lực.","B":"Hỗ trợ giao tiếp hiệu quả.","C":"Phản ánh sự chuyên nghiệp và tuân thủ quy tắc ứng xử trên mạng (netiquette).","D":"Tất cả các điều trên."}},"429":{"q":"Vì sao việc kết nối xã hội là cách quan trọng để đối phó với căng thẳng?","o":{"A":"Vì dễ tự cô lập mình khi bạn cảm thấy căng thẳng","B":"Vì nó giúp bạn duy trì nếp sinh hoạt bình thường","C":"Vì người khác có thể cho bạn lời khuyên tốt về vấn đề của bạn","D":"Vì nó có thể giúp bạn tạm thời xao lãng khỏi vấn đề của mình"}},"430":{"q":"Vì sao việc tự đặt mình vào những tình huống căng thẳng thần kinh đôi khi có thể kích thích tư duy sáng tạo?","o":{"A":"Một mức áp lực nhất định là quan trọng để giữ cho một nhiệm vụ sáng tạo tiến triển.","B":"Khi chúng ta căng thẳng, nó tăng cường năng lực trí óc.","C":"Nỗi sợ và sự thất vọng có thể khơi dậy ý thức trách nhiệm","D":"Giới hạn thời gian làm nhiệm vụ thú vị hơn."}},"431":{"q":"Người có định hướng cá nhân chủ nghĩa có xu hướng ...","o":{"A":"mang lại kết quả tích cực cho người khác","B":"thể hiện sở thích của mình khi phân chia nguồn lực giữa mình và người khác","C":"tìm cơ hội làm suy yếu người khác để vượt lên","D":"ít quan tâm hơn đến kết quả của người khác"}},"432":{"q":"Một nhóm được gọi là nhóm hợp đồng (contract team) nếu","o":{"A":"Các thành viên có các nhiệm vụ khác phải thực hiện trong đơn vị chức năng bình thường của họ","B":"Nhóm vẫn chịu trách nhiệm cho cả công việc hằng ngày và công việc dự án","C":"Các thành viên báo cáo cho các quản lý khác nhau","D":"Nhóm được đưa từ bên ngoài vào để làm công việc dự án"}},"433":{"q":"Trong các mẹo tư duy sáng tạo, “Sensing” (Cảm nhận) nghĩa là gì?","o":{"A":"Là người quan sát tốt về con người, thiên nhiên và các sự kiện quanh bạn","B":"Đồng cảm với người khác","C":"Vui hơn khi học","D":"Cởi mở với những nhận thức bất chợt khi ý tưởng nảy ra trong đầu bạn"}},"434":{"q":"Người phỏng vấn có thể cố ý thử thách bạn bằng những câu hỏi khó để ...","o":{"A":"xem bạn xử lý các tình huống khác nhau như thế nào","B":"thấy bạn hoảng loạn","C":"cho bạn thấy môi trường làm việc có thể căng thẳng","D":"tránh tỏ ra thân thiện"}},"435":{"q":"Một câu hỏi phỏng vấn về một trong những điểm yếu của bạn sẽ được trả lời tốt nhất bằng cách","o":{"A":"thừa nhận điểm yếu","B":"hỏi xem có cần thiết phải nói về điểm yếu không","C":"nêu một điểm yếu và biến nó thành điểm mạnh","D":"nói rằng bạn không có điểm yếu nào"}},"436":{"q":"Vào cuối cuộc họp, bạn nên","o":{"A":"Hỏi nhiều câu hỏi để kiểm tra mức độ hiểu của các thành viên về cuộc thảo luận","B":"Ngắn gọn và nhắc lại các điểm chính","C":"Là người đầu tiên rời phòng họp","D":"Chụp ảnh nhóm và trò chuyện với các thành viên để xây dựng quan hệ cá nhân với họ"}},"437":{"q":"“Lập luận vòng tròn” (Circular argument) là một loại ngụy biện trong đó:","o":{"A":"Một lập luận yếu được dựng lên để dễ bị bác bỏ, làm xao lãng khỏi các lập luận mạnh hơn.","B":"Mệnh đề được dùng để tự chứng minh chính nó. Giả định chính điều nó nhằm chứng minh.","C":"Viện dẫn một niềm tin chung của một số người, thường mang tính định kiến, và khẳng định ai cũng có niềm tin này. Còn gọi là Ngụy biện Theo đám đông (Bandwagon Fallacy), vì người ta “nhảy lên toa xe” của một quan điểm được cho là phổ biến.","D":"Chúng ta khẳng định tính đúng đắn của chính vấn đề đang xét, như thể đó đã là một kết luận hiển nhiên."}},"438":{"q":"Tư duy sáng tạo là","o":{"A":"một cách áp dụng các chiến lược làm thông tâm trí để suy nghĩ và ý tưởng của bạn vượt qua những gì có vẻ là giới hạn của vấn đề","B":"quan trọng vì nó giúp bạn nhìn vấn đề và tình huống từ một góc nhìn mới mẻ","C":"một cách phát triển các giải pháp mới lạ hoặc phi truyền thống không hoàn toàn phụ thuộc vào các giải pháp trong quá khứ hay hiện tại","D":"Tất cả đều đúng"}},"439":{"q":"Chọn câu trả lời tốt nhất cho câu hỏi “Vì sao chúng tôi nên tuyển bạn?”","o":{"A":"Chẳng có gì! Tôi hoàn hảo rồi!","B":"Tôi là chuyên gia theo cách này.","C":"Tôi thực sự muốn mang bộ kỹ năng đa dạng của mình đến công ty quý vị.","D":"Tôi xứng đáng."}},"440":{"q":"Chọn câu trả lời tốt nhất cho câu hỏi: “Bạn xử lý căng thẳng và áp lực như thế nào?”","o":{"A":"Tôi không biết","B":"Tôi không thể. Tôi không biết cách","C":"Vai trò của tôi là quản lý quy trình xuất hóa đơn","D":"Tôi cố gắng phản ứng với tình huống, thay vì phản ứng với căng thẳng"}},"441":{"q":"David vừa được giao nhiệm vụ trình bày thuyết trình trước phòng marketing của tổ chức anh mới gia nhập hai tháng trước. Việc đầu tiên David nên làm là ...","o":{"A":"phân tích khán giả","B":"xác định mục đích của bài thuyết trình","C":"soạn dàn ý","D":"thu thập dữ liệu hỗ trợ"}},"442":{"q":"Deborah Duarte và Nancy Snyder chỉ ra rằng “công nghệ không thể bù đắp cho việc lập kế hoạch kém hay các cuộc họp thiếu cân nhắc. Thực tế, nó có thể làm tình hình tệ hơn.” Để tránh các vấn đề như vậy trong cuộc họp ảo, bạn nên:","o":{"A":"bắt đầu cuộc họp ảo bằng cách chia sẻ chương trình nghị sự.","B":"mời thêm nhiều người tham gia vì các cuộc họp ảo thường không bị hạn chế về quy mô do số ghế trong phòng họp.","C":"bảo đảm người tham gia có quyền truy cập công nghệ và biết cách dùng hiệu quả.","D":"dùng công nghệ bạn đã dùng trước đó để không phải lo kiểm tra trước khi họp với nhóm."}},"443":{"q":"Có thể duy trì giao tiếp bằng mắt với các thành viên nhóm bằng cách:","o":{"A":"luôn nhìn vào một vài người","B":"luôn nhìn vào những người bạn yêu thích","C":"luôn nhìn vào những người gần nhất","D":"nhìn từng cá nhân theo một chu kỳ đều đặn"}},"444":{"q":"Bốn yếu tố cấp nhóm kết hợp gây ra groupthink là","o":{"A":"sự gắn kết, sự cô lập, lãnh đạo thiên vị, áp lực ra quyết định","B":"sự gắn kết, sự cô lập, sự nản lòng, lãnh đạo thiên vị","C":"sự gắn kết, sự cô lập, áp lực ra quyết định, tính hung hăng","D":"sự cô lập, lãnh đạo thiên vị, tính hung hăng, sự nản lòng"}},"445":{"q":"John có thể thử mặc cả với Katy nếu...","o":{"A":"Katy có quyền lực khiêm tốn hơn so với John, nhưng John vẫn phụ thuộc phần lớn vào quyền lực.","B":"John có nhiều quyền lực hơn Katy","C":"Katy có nhiều quyền lực hơn John.","D":"Katy có quyền lực đáng kể và John phụ thuộc rất nhiều."}},"446":{"q":"Lời khuyên tốt cho người tham dự cuộc họp có thể bao gồm:","o":{"A":"nổi giận không có lý do chính đáng.","B":"đòi hỏi nhiều thông tin hơn mức cần thiết.","C":"đưa ra nhiều thông tin hơn mức cần thiết.","D":"thể hiện sự chuyên nghiệp trong các tương tác bằng lời và phi ngôn ngữ của bạn."}},"447":{"q":"Các cuộc họp mang lại cho các thành viên một ___ giúp thúc đẩy động lực thực hiện các ý tưởng và hành động của nhóm.","o":{"A":"cơ hội tham gia vào quá trình ra quyết định của nhóm","B":"cơ hội tranh cãi","C":"thời gian thư giãn","D":"thời gian trò chuyện"}},"448":{"q":"Hành vi phi ngôn ngữ phản ánh thái độ tích cực là","o":{"A":"di chuyển đầu gối và bàn chân hướng về phía cửa","B":"nhìn đồng hồ","C":"nghịch trang sức","D":"nghiêng người về phía người bạn đang trò chuyện"}},"449":{"q":"Một trong những phát hiện then chốt trong các thí nghiệm về hiệu ứng Dunning-Kruger là những người kém kỹ năng thì","o":{"A":"luôn hài lòng với kết quả","B":"thường ghen tị với người khác","C":"không được thưởng và thiên kiến","D":"quá tự tin vào kết quả của mình"}},"450":{"q":"Trong một giao dịch giao tiếp, phản hồi (feedback) đại diện cho","o":{"A":"môi trường vật lý và tâm lý của một nhóm.","B":"bất cứ thứ gì cản trở hoặc ngăn chặn giao tiếp hiệu quả.","C":"phương tiện mà các thành viên nhóm dùng để chia sẻ thông điệp.","D":"sự đáp lại hoặc phản ứng đối với một thông điệp."}},"451":{"q":"Để “Xác định vấn đề”, chúng ta nên thực hiện những hành động nào?","o":{"A":"Xác định vấn đề, Xác định các dữ kiện, Đưa ví dụ, Sắp xếp thông tin một cách logic","B":"Xác định vấn đề, Xác định các mục tiêu quan trọng nhất của bạn","C":"Xác định vấn đề, Cung cấp càng nhiều chi tiết hỗ trợ càng tốt, Đưa ví dụ, Sắp xếp thông tin một cách logic","D":"Xác định vấn đề, Cung cấp càng nhiều chi tiết hỗ trợ càng tốt, Xác định các mục tiêu quan trọng nhất của bạn, Thu thập thông tin và dữ kiện"}},"452":{"q":"“Wikis” đóng góp theo cách nào vào khả năng tư duy phản biện và sáng tạo của chúng ta?","o":{"A":"Wikis có thể giúp sinh viên phối hợp, biên soạn, tổng hợp và trình bày các dự án hoặc nghiên cứu cá nhân hay nhóm.","B":"Wikis có thể giúp sinh viên xây dựng và chia sẻ tài nguyên và kiến thức của nhóm.","C":"Wikis có thể giúp sinh viên đánh giá đồng đẳng, đưa phản hồi và phê bình.","D":"Tất cả đều đúng"}},"453":{"q":"Nếu bạn ứng tuyển vào một công việc mới hoặc bạn có ít hoặc không có kinh nghiệm, bạn nên:","o":{"A":"Để cá tính của bạn tỏa sáng.","B":"Đọc và tìm hiểu càng nhiều càng tốt về công việc trước khi ứng tuyển.","C":"Chấp nhận rằng có lẽ bạn sẽ không được tuyển và không ứng tuyển.","D":"Chuyện gì đến sẽ đến, cứ để mặc."}},"454":{"q":"Trong buổi phỏng vấn xin việc, câu trả lời nào sau đây phù hợp nhất cho câu hỏi “Bạn có dự định lập gia đình trong tương lai gần không?”","o":{"A":"Tôi nghĩ ai cũng có kế hoạch gia đình theo cách riêng. Chuyện gì đến sẽ đến!","B":"Tôi có thể không trả lời câu hỏi quá riêng tư này không?","C":"Là một người năng động của thế hệ trẻ, tôi khá cởi mở với vấn đề này, tôi đang nỗ lực phụng dưỡng cha mẹ trước, rồi đạt địa vị xã hội cao cho những đứa con tương lai.","D":"Hiện tại tôi tập trung vào sự nghiệp. Dù lập gia đình luôn là một khả năng, nhưng đó không phải ưu tiên lúc này."}},"455":{"q":"Trong buổi phỏng vấn xin việc, bạn nên trả lời các câu hỏi phỏng vấn tốt nhất bằng cách nào?","o":{"A":"Nhiệt tình, trung thực, chân thành và nêu thành tích của bạn một cách cụ thể và tích cực.","B":"Tô vẽ thành tích và thành tựu của bạn để bảo đảm nhà tuyển dụng nhớ chúng.","C":"Nói rằng thành tích và thành tựu của bạn đã được nêu chi tiết trong résumé.","D":"Thận trọng khi mô tả những gì bạn đã đạt được để không có vẻ khoe khoang."}},"456":{"q":"“Tôi là người đầu tiên trong gia đình hoàn thành bằng Cử nhân; và giờ khi đã học xong, tôi muốn đền đáp gia đình bằng cách có một công việc tốt ở một công ty như quý vị. Tôi đã làm thêm trong khi đi học nên có kinh nghiệm làm việc ở các cửa hàng thực phẩm. Tôi là người chăm chỉ; tôi lớn lên ở nông trại và có thể lái mọi loại máy móc.” Đoạn này trong thư ứng tuyển vị trí lập trình viên phần mềm không hiệu quả vì _______","o":{"A":"Nó dùng lời chào khách quan, vô cảm.","B":"Nó không liên quan đến nhu cầu của công ty.","C":"Nó truyền đạt giọng điệu tiêu cực.","D":"Nó cung cấp bối cảnh gia đình của ứng viên."}},"457":{"q":"Quyền lực khen thưởng (Reward Power) tồn tại khi:","o":{"A":"người A có quyền lực đối với người B vì A có thể áp dụng một hình thức trừng phạt nào đó đối với B.","B":"người A có được quyền lực vì A có kiến thức hoặc chuyên môn liên quan đến B.","C":"khi người B phục tùng người A vì B cảm thấy A có quyền thực thi quyền lực trong một lĩnh vực nhất định.","D":"khi người A có quyền lực đối với người B vì A kiểm soát các phần thưởng mà B muốn."}},"458":{"q":"Liên quan đến danh mục hành động giải quyết vấn đề, điều nào sau đây nên được thực hiện “Trong (giai đoạn)...” [câu hỏi gốc bị cắt]","o":{"A":"So sánh và đối chiếu các giải pháp khả dĩ.","B":"Cung cấp càng nhiều chi tiết hỗ trợ càng tốt.","C":"Sắp xếp thông tin một cách logic.","D":"Bảo vệ giải pháp của bạn."}},"459":{"q":"So sánh xã hội có thể dẫn đến","o":{"A":"tác động đến lòng tự trọng, cảm giác chiến thắng, cảm giác khiêm tốn.","B":"tác động đến lòng tự trọng, cảm giác ghen tị, cảm giác hối tiếc.","C":"tác động đến lòng tự trọng, cảm giác yêu thương, cảm giác mình vượt trội.","D":"Tác động đến sự tự hài lòng, lòng tự trọng, cảm giác thất bại."}},"460":{"q":"Power-over (quyền lực lên người khác) có thể thấy trong tình huống nào sau đây?","o":{"A":"Một nhà lãnh đạo trao quyền cho nhóm thông qua hợp tác","B":"Một thành viên thống trị cuộc trò chuyện và kiểm soát các nguồn lực của nhóm","C":"Một nhóm tôn trọng ý kiến của nhau và làm việc hợp tác","D":"Một nhà lãnh đạo đề xuất ý tưởng mà không áp đặt cho người khác"}},"461":{"q":"Những người có khả năng đồng cảm có thể ...","o":{"A":"trải nghiệm cảm xúc của người khác một cách gián tiếp.","B":"bị phớt lờ trong làm việc nhóm.","C":"tổ chức và phân phối công việc giữa người khác và bản thân.","D":"không đặt mình vào góc nhìn của người khác và hiểu trải nghiệm cảm xúc của họ."}},"462":{"q":"Phần mở đầu của résumé nên bao gồm","o":{"A":"tiêu đề, mục tiêu công việc hoặc nghề nghiệp và bản tóm tắt trình độ của bạn.","B":"phần có thông tin liên lạc với những người giới thiệu của bạn.","C":"bản tóm tắt học vấn.","D":"danh sách kỹ năng đặc biệt, danh hiệu và hoạt động"}},"463":{"q":"Nhược điểm của các thông điệp bằng văn bản là chúng","o":{"A":"Có thể có giá trị pháp lý.","B":"Có thể được chỉnh sửa để bảo đảm tuân theo các nguyên tắc giao tiếp kinh doanh.","C":"Có thể được đọc lại và nghiên cứu, điều quan trọng nếu thông điệp dài, phức tạp hoặc được viết trong lúc giận dữ.","D":"Có thể được xem là trang trọng hơn, một phần vì chúng tồn tại vĩnh viễn."}},"464":{"q":"Giải pháp cho một vấn đề nghiên cứu được trình bày trong báo cáo như một phần của","o":{"A":"phụ lục","B":"kết luận","C":"khuyến nghị","D":"kết quả nghiên cứu (findings)"}},"465":{"q":"Cách tốt nhất để truyền tải sự thân thiện là......","o":{"A":"mỉm cười","B":"nói chậm","C":"kể chuyện cười","D":"dùng giọng điệu quan trọng"}},"466":{"q":"Kỹ năng “Áp dụng” (Applying) trong Thang phân loại Bloom là:","o":{"A":"Khả năng nhận ra hoặc nhớ lại kiến thức đã có.","B":"Khả năng dùng tài liệu đã học (hoặc triển khai tài liệu) trong những tình huống mới và cụ thể.","C":"Khả năng phán đoán, kiểm tra và thậm chí phê bình giá trị của tài liệu cho một mục đích nhất định.","D":"Khả năng nắm bắt hoặc xây dựng ý nghĩa từ các thông điệp bằng lời, văn bản và đồ họa."}},"467":{"q":"Các chiến lược để kích thích tư duy sáng tạo của bạn bao gồm","o":{"A":"Ngủ một giấc rồi tính (Sleep on it)","B":"Thỉnh thoảng đặt mình vào những tình huống căng thẳng thần kinh để kích hoạt bộ não.","C":"Luôn mang theo một cuốn sổ để luôn có cách ghi lại những ý nghĩ thoáng qua.","D":"Tất cả đều đúng"}},"468":{"q":"Địa vị (Status) có thể được định nghĩa là:","o":{"A":"Mức độ quan trọng hay ý nghĩa mà một người được nhận thức trong một bối cảnh nhất định.","B":"Một kết quả của quyền lực, có gốc rễ từ chủ nghĩa thực dân và các cuộc chinh phục toàn cầu","C":"Một hành động có thể từ chối một số nhóm các công việc có mức lương đủ sống, có thể thiết lập sự bất bình đẳng, có thể từ chối nhà ở giá phải chăng, và còn nhiều điều nữa","D":"Không đáp án nào ở trên"}},"469":{"q":"Về tâm lý học của các nhóm, chúng ta tham gia nhóm để thỏa mãn nhu cầu thuộc về, có được thông tin và sự hiểu biết thông qua so sánh xã hội, đạt được những mục tiêu mà nếu làm một mình có thể vuột mất, và ...","o":{"A":"củng cố mối gắn kết với người khác","B":"thể hiện sự tôn trọng với người khác","C":"đáp ứng các yêu cầu của môi trường làm việc nhóm","D":"xác định ý thức về bản thân và bản sắc xã hội"}},"470":{"q":"Bạn đang thực hiện chiến dịch tìm việc để có việc làm. Bạn nên làm gì sau khi phân tích trình độ và sở thích công việc?","o":{"A":"bắt đầu một buổi phỏng vấn xin việc","B":"thu thập thông tin về các cơ hội việc làm","C":"gửi email thư xin việc đến các công ty tiềm năng","D":"đến phòng gym để chuẩn bị sức khỏe và ngoại hình tốt cho buổi phỏng vấn"}},"471":{"q":"Bạn được mời vào văn phòng để phỏng vấn. Bạn không nên làm gì?","o":{"A":"Ngồi phịch xuống ghế rồi lôi điện thoại ra","B":"Chờ lặng lẽ cho đến khi họ ngồi trước","C":"Bắt tay những người phỏng vấn rồi ngồi xuống","D":"Nói cảm ơn, rồi hỏi xem bạn có thể ngồi không"}},"472":{"q":"Bạn chưa có việc làm, nhưng đang ứng tuyển công việc đầu tiên. Bạn nên viết gì trong mục kinh nghiệm làm việc?","o":{"A":"Cứ viết đại gì đó, bất cứ điều gì dù không có thật.","B":"Tôi giúp mẹ làm việc nhà mỗi cuối tuần.","C":"Tôi đã làm tình nguyện ba tháng tại “Làng trẻ em SOS” để giúp đỡ trẻ em.","D":"Tôi từng làm tình nguyện, nhưng đó không thực sự là một công việc."}},"473":{"q":"Bạn nên làm gì trước khi có buổi phỏng vấn với một công ty?","o":{"A":"Kết bạn hoặc kết nối với người phỏng vấn trên mọi nền tảng mạng xã hội","B":"Tìm hiểu một số thông tin nền về công việc","C":"Hỏi họ xem có phục vụ đồ ăn trong buổi phỏng vấn không","D":"Nói với họ rằng bạn có một buổi phỏng vấn khác 15 phút sau buổi của họ"}}};
const K="ssg105-quiz-v1",SET=50,EXN=50,EXMIN=60;
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let saved=ld(K,{}),marks=new Set(ld(K+"-m",[])),vi=Object.assign({},ld(K+"-vi",{}),VI),exam=ld(K+"-exam",null);
let view="practice",mode="all",setIdx=0,query="",list=[],pos=0,pending=new Set(),order=null,viOn=new Set(Object.keys(VI).map(Number)),loadingVi=null,viErr=null,sample=null,tick=null;
const MODES=[["all","Theo thứ tự"],["shuffle","Trộn ngẫu nhiên"],["wrong","Ôn câu sai"],["todo","Chưa làm"],["marked","Đã đánh dấu"]];
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byN=n=>DATA.find(q=>q.n===n);
const keyOf=q=>q.a?q.a.split(""):[];
const status=q=>{const s=saved[q.n];return s==null||!q.a?"":s===q.a?"ok":"bad"};
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const match=q=>{const t=query.trim().toLowerCase();if(!t)return true;if(/^\d+$/.test(t))return String(q.n)===t;return (q.q+" "+q.o.map(o=>o[1]).join(" ")).toLowerCase().includes(t)};
const count=m=>m==="wrong"?DATA.filter(q=>status(q)==="bad").length:m==="todo"?DATA.filter(q=>saved[q.n]==null&&q.a).length:m==="marked"?DATA.filter(q=>marks.has(q.n)).length:DATA.length;
function build(keep){
  let l=DATA.slice();
  if(mode==="shuffle"){if(!order||!keep)order=shuf(DATA.map(q=>q.n));l=order.map(byN)}
  if(mode==="wrong")l=l.filter(q=>status(q)==="bad");
  if(mode==="todo")l=l.filter(q=>saved[q.n]==null&&q.a);
  if(mode==="marked")l=l.filter(q=>marks.has(q.n));
  if(mode==="set")l=l.filter(q=>q.n>setIdx*SET&&q.n<=setIdx*SET+SET);
  list=l.filter(match);if(pos>=list.length)pos=Math.max(0,list.length-1);pending=new Set();
}
const exQ=()=>byN(exam.ids[exam.pos]);
const exScore=()=>exam.ids.filter(n=>exam.ans[n]===byN(n).a).length;
function startTick(){clearInterval(tick);tick=setInterval(()=>{if(!exam||exam.done)return clearInterval(tick);const r=exam.end-Date.now();if(r<=0)return submitExam(true);document.querySelectorAll(".tm").forEach(e=>{e.textContent=fmt(r);e.classList.toggle("warn",r<300000)})},1000)}
function startExam(){const pool=shuf(DATA.filter(q=>q.a).map(q=>q.n));exam={ids:pool.slice(0,EXN),ans:{},start:Date.now(),end:Date.now()+EXMIN*60000,done:false,review:false,auto:false,pos:0};sv(K+"-exam",exam);view="exam";$("side").classList.remove("open");startTick();render();window.scrollTo({top:0})}
function submitExam(auto){if(!exam||exam.done)return;exam.done=true;exam.auto=!!auto;exam.fin=Math.min(Date.now(),exam.end);exam.pos=0;exam.review=false;exam.ids.forEach(n=>{if(exam.ans[n])saved[n]=exam.ans[n]});sv(K,saved);sv(K+"-exam",exam);clearInterval(tick);render()}
function leaveExam(){clearInterval(tick);exam=null;sv(K+"-exam",null);view="practice";build(false);render()}
function viBtn(q){const has=vi[q.n];if(!has&&!sample)return"";const t=loadingVi===q.n?"Đang dịch…":has?(viOn.has(q.n)?"Ẩn bản dịch":"Hiện bản dịch"):"Dịch sang tiếng Việt";return'<button class="trbtn" data-act="vi"'+(loadingVi?" disabled":"")+'>'+t+'</button>'}
const starSvg=on=>'<svg width="20" height="20" viewBox="0 0 24 24" fill="'+(on?"currentColor":"none")+'" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9 6.8 19.7l1-5.9-4.3-4.1 5.9-.8z"/></svg>';
function card(q,o){
  const key=keyOf(q),multi=key.length>1,v=vi[q.n]&&viOn.has(q.n)?vi[q.n]:null,star=marks.has(q.n);
  let h='<article class="qcard"><div class="qhead"><span class="qnum">'+o.label+'</span>'+(multi?'<span class="tag">Chọn '+key.length+' đáp án</span>':'')+viBtn(q)+'<span class="qpos">'+o.posTxt+'</span><button class="ico'+(star?" on":"")+'" data-act="mark" title="Đánh dấu câu này" aria-label="Đánh dấu câu này">'+starSvg(star)+'</button></div><h2 class="stem">'+esc(q.q)+'</h2>'+(v?'<p class="vi">'+esc(v.q)+'</p>':"");
  q.o.forEach(([L,t])=>{let c="opt";if(o.show){if(key.includes(L))c+=" ok";else if(o.sel.has(L))c+=" bad"}else if(o.sel.has(L))c+=" sel";
    h+='<button class="'+c+'" data-act="pick" data-v="'+L+'"'+(o.show?" disabled":"")+'><span class="ltr">'+L+'</span><span class="txt">'+esc(t)+(v&&v.o&&v.o[L]?'<span class="vi">'+esc(v.o[L])+'</span>':"")+'</span></button>'});
  if(viErr===q.n)h+='<div class="fb na">Chưa dịch được lúc này, hãy thử lại sau.</div>';
  return h+(o.fb||"")+'</article>';
}
const fbOf=(q,s)=>{if(!q.a)return'<div class="fb na">File gốc chưa có đáp án cho câu này, nên câu này không được chấm điểm.</div>';if(s==null)return'<div class="fb bad">Bạn chưa trả lời. Đáp án đúng: '+keyOf(q).join(", ")+'</div>';const ok=s===q.a;return'<div class="fb '+(ok?"ok":"bad")+'">'+(ok?"Chính xác.":"Chưa đúng.")+' Đáp án đúng: '+keyOf(q).join(", ")+'</div>'};
const gcls=(q,cur,extra)=>'g '+extra+(marks.has(q.n)?" mk":"")+(cur?" cur":"");
function sidePractice(cur){
  let ok=0,bad=0;DATA.forEach(q=>{const s=status(q);if(s==="ok")ok++;else if(s==="bad")bad++});
  const T=DATA.length;
  const sets=Array.from({length:Math.ceil(T/SET)},(_,i)=>{const qs=DATA.filter(q=>q.n>i*SET&&q.n<=i*SET+SET);return'<button class="set'+(mode==="set"&&setIdx===i?" on":"")+'" data-act="set" data-v="'+i+'">'+(i*SET+1)+"–"+(i*SET+qs.length)+'<em>'+qs.filter(q=>status(q)).length+"/"+qs.length+'</em></button>'}).join("");
  $("sb").innerHTML=
  '<button class="exbtn" data-act="exstart">Thi thử<small>'+EXN+' câu ngẫu nhiên · '+EXMIN+' phút</small></button>'+
  '<section class="panel"><h2>Tiến độ</h2><div class="pbar"><i class="ok" style="width:'+ok/T*100+'%"></i><i class="bad" style="width:'+bad/T*100+'%"></i></div><div class="fig"><div><b>'+ok+'</b><span>Đúng</span></div><div><b>'+bad+'</b><span>Sai</span></div><div><b>'+(T-ok-bad)+'</b><span>Chưa làm</span></div></div></section>'+
  '<section class="panel"><h2>Chế độ ôn</h2>'+MODES.map(([k,t])=>'<button class="mode'+(k===mode?" on":"")+'" data-act="mode" data-v="'+k+'">'+t+(["wrong","todo","marked"].includes(k)?'<em>'+count(k)+'</em>':"")+'</button>').join("")+'</section>'+
  '<section class="panel"><h2>Ôn theo bộ '+SET+' câu</h2><div class="sets">'+sets+'</div></section>'+
  '<section class="panel"><h2>Danh sách câu</h2><div class="grid">'+DATA.map(q=>'<button class="'+gcls(q,cur&&cur.n===q.n,status(q))+'" data-act="goto" data-v="'+q.n+'">'+q.n+'</button>').join("")+'</div></section><button class="reset" data-act="reset">Xóa toàn bộ tiến độ</button>';
}
function renderPractice(){
  sidePractice(list[pos]);const m=$("main");
  if(!list.length){m.innerHTML='<div class="empty">'+(query?"Không có câu nào khớp “"+esc(query)+"”. Thử từ khóa khác.":mode==="wrong"?"Chưa có câu sai nào. Hãy làm thêm vài câu ở chế độ khác.":mode==="marked"?"Chưa đánh dấu câu nào. Bấm ngôi sao trên câu hỏi để lưu lại.":"Bạn đã làm hết các câu có đáp án.")+'</div>';return}
  const q=list[pos],s=saved[q.n],done=s!=null,key=keyOf(q),multi=key.length>1;
  m.innerHTML=card(q,{label:"Câu "+q.n,posTxt:(pos+1)+" / "+list.length+(query?" kết quả":""),show:done,sel:done?new Set(s.split("")):pending,fb:done||!q.a?fbOf(q,s):""})+
  '<div class="actions"><button class="btn" data-act="prev"'+(pos===0?" disabled":"")+'>Câu trước</button>'+(multi&&!done?'<button class="btn pri" data-act="check"'+(pending.size?"":" disabled")+'>Kiểm tra</button>':"")+'<span class="sp"></span><input class="jump" id="jump" type="number" min="1" max="'+DATA.length+'" placeholder="Đến câu" inputmode="numeric" aria-label="Đến câu số"><button class="btn'+(done||!q.a?" pri":"")+'" data-act="next"'+(pos>=list.length-1?" disabled":"")+'>Câu tiếp</button></div><p class="keys">Phím A–F để chọn đáp án, mũi tên trái/phải để chuyển câu.</p>';
}
function renderExam(){
  const m=$("main"),n=exam.ids.length,answered=Object.keys(exam.ans).length,rev=exam.done;
  const grid=exam.ids.map((id,i)=>{const q=byN(id),s=exam.ans[id];const st=rev?(s===q.a?"ok":"bad"):(s?"ans":"");return'<button class="'+gcls(q,i===exam.pos&&(!rev||exam.review),st)+'" data-act="egoto" data-v="'+i+'">'+(i+1)+'</button>'}).join("");
  const r=exam.end-Date.now();
  $("sb").innerHTML='<section class="panel">'+(rev?'<h2>Bài thi đã nộp</h2><p class="acc" style="border:0;margin:0;padding:0"><span>Điểm</span><b>'+(exScore()/n*10).toFixed(1)+' / 10</b></p>':'<p class="bigtm tm'+(r<300000?" warn":"")+'">'+fmt(r)+'</p><p class="acc" style="border:0;margin:0;padding:0"><span>Đã trả lời</span><b>'+answered+" / "+n+'</b></p>')+'</section>'+
  (rev?'<button class="exbtn" data-act="exstart">Làm đề mới</button>':'<button class="exbtn" data-act="exsubmit">Nộp bài<small>Còn '+(n-answered)+' câu chưa trả lời</small></button>')+
  '<section class="panel"><h2>Các câu trong đề</h2><div class="grid">'+grid+'</div></section><button class="reset" data-act="exleave">'+(rev?"Về chế độ ôn tập":"Thoát, không nộp bài")+'</button>';
  if(rev&&!exam.review){const c=exScore(),u=n-answered,w=n-c-u,used=fmt(exam.fin-exam.start);
    m.innerHTML='<div class="qcard"><div class="qhead"><span class="qnum">Kết quả bài thi</span></div><div class="score">'+c+' / '+n+' câu đúng</div><p style="margin:0;color:var(--mut)">Điểm '+(c/n*10).toFixed(1)+' trên thang 10 · tỉ lệ đúng '+Math.round(c/n*100)+'% · thời gian làm bài '+used+(exam.auto?" (hết giờ, bài được nộp tự động)":"")+'</p><ul class="leg" style="max-width:260px;margin-top:14px"><li><i class="dot ok"></i>Đúng<b>'+c+'</b></li><li><i class="dot bad"></i>Sai<b>'+w+'</b></li><li><i class="dot"></i>Bỏ trống<b>'+u+'</b></li></ul><div class="row"><button class="btn pri" data-act="exreview">Xem lại từng câu</button><button class="btn" data-act="exstart">Làm đề mới</button><button class="btn" data-act="exleave">Về chế độ ôn tập</button></div></div>';return}
  const q=exQ(),s=exam.ans[q.n];
  m.innerHTML=card(q,{label:"Câu "+(exam.pos+1)+" / "+n,posTxt:rev?"Xem lại":"Đang thi",show:rev,sel:new Set((s||"").split("").filter(Boolean)),fb:rev?fbOf(q,s):""})+
  '<div class="actions"><button class="btn" data-act="prev"'+(exam.pos===0?" disabled":"")+'>Câu trước</button><span class="sp"></span>'+(rev?'<button class="btn" data-act="exresult">Về kết quả</button>':'<button class="btn" data-act="exsubmit">Nộp bài</button>')+'<button class="btn pri" data-act="next"'+(exam.pos>=n-1?" disabled":"")+'>Câu tiếp</button></div><p class="keys">Phím A–F để chọn đáp án, mũi tên trái/phải để chuyển câu.</p>';
}
function render(){
  $("viall").textContent=viOn.size?"Ẩn bản dịch":"Hiện bản dịch";
  {let ok=0,bad=0;DATA.forEach(q=>{const s=status(q);if(s==="ok")ok++;else if(s==="bad")bad++});$("hstat").textContent="Đã làm "+(ok+bad)+"/"+DATA.length+(ok+bad?" · đúng "+Math.round(ok/(ok+bad)*100)+"%":"")}
  const ex=view==="exam"&&exam;$("q").style.display=ex?"none":"";
  const t=document.querySelector(".top .tm");t.hidden=!(ex&&!exam.done);if(ex&&!exam.done){t.textContent=fmt(exam.end-Date.now());t.classList.toggle("warn",exam.end-Date.now()<300000)}
  ex?renderExam():renderPractice();
}
function cur(){return view==="exam"&&exam?exQ():list[pos]}
function answer(q,v){saved[q.n]=v;sv(K,saved);pending=new Set();render()}
function go(d){if(view==="exam"&&exam){const p=exam.pos+d;if(p<0||p>=exam.ids.length)return;exam.pos=p;sv(K+"-exam",exam)}else{const p=pos+d;if(p<0||p>=list.length)return;pos=p;pending=new Set()}render();window.scrollTo({top:0})}
function pick(L){
  const q=cur();if(!q||!q.o.some(o=>o[0]===L))return;const multi=keyOf(q).length>1;
  if(view==="exam"&&exam){if(exam.done)return;let c=new Set((exam.ans[q.n]||"").split("").filter(Boolean));if(multi)c.has(L)?c.delete(L):c.add(L);else c=new Set([L]);const s=[...c].sort().join("");s?exam.ans[q.n]=s:delete exam.ans[q.n];sv(K+"-exam",exam);render();return}
  if(!q.a||saved[q.n]!=null)return;if(multi){pending.has(L)?pending.delete(L):pending.add(L);render()}else answer(q,L)
}
function jumpTo(n){const i=list.findIndex(x=>x.n===n);if(i>=0)pos=i;else{mode="all";query="";$("q").value="";build(false);pos=n-1}pending=new Set();$("side").classList.remove("open");render();window.scrollTo({top:0})}
async function translate(q){
  if(vi[q.n]){viOn.has(q.n)?viOn.delete(q.n):viOn.add(q.n);render();return}
  if(!sample||loadingVi)return;loadingVi=q.n;viErr=null;render();
  const p="Dịch câu hỏi trắc nghiệm sau sang tiếng Việt tự nhiên, chính xác; giữ thuật ngữ chuyên ngành quan trọng bằng tiếng Anh trong ngoặc khi cần. Chỉ trả về JSON đúng dạng {\"q\":\"...\",\"o\":{\"A\":\"...\"}} với đủ các lựa chọn.\nCâu hỏi: "+q.q+"\n"+q.o.map(o=>o[0]+". "+o[1]).join("\n");
  try{const r=await sample.json(p,{modelTier:"quick"});if(r&&typeof r.q==="string"){vi[q.n]=r;sv(K+"-vi",vi);viOn.add(q.n)}else viErr=q.n}catch(e){viErr=q.n}
  loadingVi=null;render();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const v=b.dataset.v,q=cur();
  switch(b.dataset.act){
    case"open":$("side").classList.add("open");break;
    case"close":$("side").classList.remove("open");break;
    case"mode":mode=v;pos=0;build(false);$("side").classList.remove("open");render();break;
    case"set":mode="set";setIdx=+v;pos=0;build(false);$("side").classList.remove("open");render();break;
    case"goto":jumpTo(+v);break;
    case"pick":pick(v);break;
    case"check":if(pending.size)answer(q,[...pending].sort().join(""));break;
    case"prev":go(-1);break;case"next":go(1);break;
    case"mark":marks.has(q.n)?marks.delete(q.n):marks.add(q.n);sv(K+"-m",[...marks]);render();break;
    case"vi":translate(q);break;
    case"viall":if(viOn.size)viOn.clear();else DATA.forEach(x=>{if(vi[x.n])viOn.add(x.n)});render();break;
    case"exstart":if(!exam||exam.done||confirm("Bỏ bài thi đang làm và bắt đầu đề mới?"))startExam();break;
    case"exsubmit":{const un=exam.ids.length-Object.keys(exam.ans).length;if(confirm(un?"Bạn còn "+un+" câu chưa trả lời. Nộp bài ngay?":"Nộp bài ngay?"))submitExam(false);break}
    case"exleave":if(exam.done||confirm("Thoát sẽ hủy bài thi đang làm. Tiếp tục?"))leaveExam();break;
    case"exreview":exam.review=true;exam.pos=0;render();window.scrollTo({top:0});break;
    case"exresult":exam.review=false;render();break;
    case"egoto":exam.pos=+v;exam.review=exam.done?true:false;sv(K+"-exam",exam);$("side").classList.remove("open");render();window.scrollTo({top:0});break;
    case"reset":if(confirm("Xóa toàn bộ kết quả đã làm?")){saved={};sv(K,saved);pos=0;build(false);render()}break}
});
$("q").addEventListener("input",e=>{query=e.target.value;pos=0;build(true);render()});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")$("side").classList.remove("open");
  if(e.target.id==="q")return;
  if(e.target.id==="jump"){if(e.key==="Enter"){const n=parseInt(e.target.value,10);if(n>=1&&n<=DATA.length)jumpTo(n)}return}
  if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);
  else if(/^[a-fA-F]$/.test(e.key))pick(e.key.toUpperCase());
  else if(e.key==="Enter"&&view==="practice"&&pending.size){const q=cur();if(q&&saved[q.n]==null)answer(q,[...pending].sort().join(""))}
});
$("sub").textContent=DATA.length+" câu hỏi · tiến độ tự động lưu trên trình duyệt này";
if(exam&&!exam.done){view="exam";if(Date.now()>=exam.end)submitExam(true);else startTick()}else if(exam){exam=null;sv(K+"-exam",null)}
build(false);render();
try{if(window.claude&&claude.use)claude.use("sample").then(s=>{if(s){sample=s;render()}}).catch(()=>{})}catch(e){}
</script>
</body>
</html>
