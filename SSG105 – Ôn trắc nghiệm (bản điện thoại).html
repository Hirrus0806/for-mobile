<script>
const DATA=[{"n": 1, "q": "Which statement expresses high emotional intelligence?", "o": [["A", "\"They are disrespecting me.\""], ["B", "\"Why am I so bad at this?\""], ["C", "\"I feel unheard when I'm interrupted during meetings.\""], ["D", "\"You always ignore my input\""], ["E", "\"I'm fine\""]], "a": "C"}, {"n": 2, "q": "In a group project without a clear leader, who is responsible for establishing psychological safety?", "o": [["A", "The course instructor."], ["B", "Every member of the team."], ["C", "The team member with the most technical skills."], ["D", "The person who created the team charter."]], "a": "B"}, {"n": 3, "q": "What is inappropriate when presenting a graduation thesis?", "o": [["A", "Wearing a well-fitted suit or a formal dress-and-blazer combination in neutral colors"], ["B", "Standing directly in front of your slides and reading the text off the screen"], ["C", "Standing at a slight angle between the presentation screen and the committee table"], ["D", "Holding the slide clicker lightly in one hand, dropping it to your side when not using it"]], "a": "B"}, {"n": 4, "q": "In the following case, which action demonstrates the stage of establishing criteria in the problem-solving process? \"A student group is working on a marketing presentation worth 30% of their final grade. Hung has gone completely silent for 4 days and hasn't done his 3 assigned slides.\"", "o": [["A", "The team looks into why this problem is happening."], ["B", "The team identifies the exact issue."], ["C", "The team decides what a \"good\" solution must look like."], ["D", "Team members brainstorm several different paths forward."], ["E", "The team checks if the solution actually worked."]], "a": "C"}, {"n": 5, "q": "What is the primary purpose of the \"reflection\" stage when overcoming barriers in written communication?", "o": [["A", "To instantly change words with synonyms to ensure a higher overall word count."], ["B", "To review the key points mentally and ensure each specific detail serves its purpose."], ["C", "To distribute the rough draft to a large audience for immediate verbal feedback."], ["D", "To ensure the finalized document uses the maximum number of complex sentences."]], "a": "B"}, {"n": 6, "q": "What is appropriate when emailing a professor to notify them about a class absence?", "o": [["A", "Clear notice of the date and a brief, respectful reason"], ["B", "Using slang"], ["C", "Giving a post-absence notice without justification"], ["D", "Asking for \"Present\" attendance check"], ["E", "Sharing highly personal details"]], "a": "A"}, {"n": 7, "q": "You need to write a proposal asking the company's executive team to approve a budget for transitioning the customer support team to an Al-powered chatbot system. Which question is optional to ask when determining the purpose of your document?", "o": [["A", "\"When does this take place?\""], ["B", "\"What is the core message and call to action?\""], ["C", "\"Why is this urgently necessary right now?\""], ["D", "\"Where will this document live and operate?\""], ["E", "\"How should the tone and structure be formatted?\""]], "a": "A"}, {"n": 8, "q": "A leader needs to tell his team that they fail to get a funding for their project. Which is an inappropriate facial expression when delivering the news?", "o": [["A", "Focused and steady gaze"], ["B", "Smiling or letting out a nervous chuckle"], ["C", "Calm absorbing nod"], ["D", "Serious and empathetic eye contact"], ["E", "Relaxed eyebrows"]], "a": "B"}, {"n": 9, "q": "When a speaker manages facts, ideas, or points of view to deliberately play upon the audience's inherent insecurities or fears to their own distinct advantage, what unethical practice are they committing?", "o": [["A", "Coercion"], ["B", "Deception"], ["C", "Manipulation"], ["D", "Bribery"]], "a": "C"}, {"n": 10, "q": "What DOES NOT make a social project proposal more persuasive?", "o": [["A", "Evidence"], ["B", "Financial transparency"], ["C", "Realistic plan"], ["D", "Careful assessment of risks"], ["E", "Massive goals"]], "a": "E"}, {"n": 11, "q": "How are \"hard skills\" distinct from \"soft skills\"?", "o": [["A", "Hard skills are difficult to learn, while soft skills can be mastered in a single afternoon workshop."], ["B", "Hard skills apply only to physical manufacturing, while soft skills apply exclusively to office roles."], ["C", "Hard skills are technical or specialized abilities, while soft skills are general, transferable traits like teamwork."], ["D", "Hard skills disappear over time, while soft skills remain permanently fixed without any practice."]], "a": "C"}, {"n": 12, "q": "What are the primary methods through which effective business writing is learned?", "o": [["A", "Through watching verbal presentations and observing the physical gestures of experienced speakers."], ["B", "Through memorizing extensive vocabulary lists and utilizing complex theoretical frameworks."], ["C", "Through avoiding any revisions and focusing entirely on producing a perfect first draft immediately."], ["D", "Through continuous practice, reading professional documents, and receiving constructive feedback."]], "a": "D"}, {"n": 13, "q": "You are arguing for a remote-work policy. You state your claim clearly, but the board is highly skeptical about employee productivity at home. How should you design your argument to navigate this effectively?", "o": [["A", "Ignore their skepticism to maintain a confident tone and focus solely on the benefits of remote work."], ["B", "Condense the entire argument into a brief summary so the board does not have time to find flaws."], ["C", "State a clear thesis, address the board's concerns as counterarguments, and provide evidence on how you will handle productivity risks."], ["D", "Restate the board's past failures in management in your own words to prove that their current skepticism is invalid."]], "a": "C"}, {"n": 14, "q": "What is NOT a result of high emotional intelligence?", "o": [["A", "An ability to make sound decisions"], ["B", "Better relationships"], ["C", "Stronger collaboration"], ["D", "No negative emotions"], ["E", "A high level of empathy"]], "a": "D"}, {"n": 15, "q": "You have restated a research paper's business model in your own words and matched its original length. To avoid plagiarism, what is your next essential step?", "o": [["A", "Condense the text further into a summary."], ["B", "Credit the original source appropriately"], ["C", "Change the overall document design and headings"], ["D", "Address the counterarguments of the business model."]], "a": "B"}, {"n": 16, "q": "What is the primary purpose of a persuasive presentation?", "o": [["A", "To create an engaging conversation that attract the audience while sparking curiosity."], ["B", "To influence the audience's beliefs, attitudes, or actions through carefully structured arguments and appeals."], ["C", "To provide controversial information and allow the audience to draw their conclusions independently."], ["D", "To narrate a compelling personal story that resonates emotionally with the audience without necessarily requiring action."]], "a": "B"}, {"n": 17, "q": "When does plagiarism occur?", "o": [["A", "When you restate another writer's idea in your own words and provide a citation."], ["B", "When you condense a long article into a short summary with proper credits."], ["C", "When you organize your main points before starting a draft."], ["D", "When you use someone else's words or ideas as your own."]], "a": "D"}, {"n": 18, "q": "What does NOT demonstrate business ethics to uphold in professional writing?", "o": [["A", "Absolute transparency"], ["B", "Distorting data"], ["C", "Clear distinction between fact and opinion"], ["D", "Active voice and clear language"], ["E", "Showing respect for readers"]], "a": "B"}, {"n": 19, "q": "When constructing a comprehensive Career Action Plan, what is the most effective method for structuring goals and actions?", "o": [["A", "Focus exclusively on long-term 20-year goals while ignoring immediate action items."], ["B", "List as many unmeasured goals as possible without assigning any realistic dates or execution parameters."], ["C", "Copy the exact action plan of a senior professional to ensure uniform tracking metrics."], ["D", "Set short-term goals alongside mid-term goals, all supported by concrete, actionable steps."]], "a": "D"}, {"n": 20, "q": "What percentage of Fortune 1000 companies use self-managing teams?", "o": [["A", "9%."], ["B", "60%."], ["C", "79%."], ["D", "91%."]], "a": "C"}, {"n": 21, "q": "If a drafted resumé contains excessive abbreviations, personal lifestyle details, expected salary, and spans over three pages for an entry-level role, which revisions should be prioritized?", "o": [["A", "Remove personal details, eliminate salary expectations, expand abbreviations, and condense to 1-2 pages."], ["B", "Keep the content identical but change the font to an ornate style to attract visual attention."], ["C", "Remove contact information to preserve privacy, and add a detailed physical description instead."], ["D", "Keep the three-page structure but append a comprehensive list of all high school coursework."]], "a": "A"}, {"n": 22, "q": "When sharing the work in a team project, what is often more important than the final product?", "o": [["A", "The learning experience."], ["B", "Doing all the work yourself."], ["C", "The frequency of missed deadlines."], ["D", "The informal ground rules."]], "a": "A"}, {"n": 23, "q": "In which of these examples is a group meeting unnecessary?", "o": [["A", "A student group changes the entire direction of their social project mid-way through."], ["B", "A corporate team launches a major quarterly initiative."], ["C", "The engineering team refuses to build a feature because it takes too long, while the marketing team insists it is vital for the launch."], ["D", "A team needs to create a list of potential sponsors for a charity gala."], ["E", "Drafting a proposal for the group project."]], "a": "E"}, {"n": 24, "q": "Which is NOT a topic for a social project proposal?", "o": [["A", "A student-led bike share and repair hub."], ["B", "Weekly STEM workshops for underrepresented youth."], ["C", "Implementing an Al-driven customer service chatbot for an e-commerce brand."], ["D", "Combatting heat-related illness in urban homeless populations."]], "a": "C"}, {"n": 25, "q": "Which feedback from the leader in the following case is a goal-directed feedback? \"The Campus Food Rescue is a student-run social project designed to reduce campus food waste. Every Monday, Wednesday, and Friday at closing time, students safely weigh, log, and transport the campus leftover meals to the local shelter. Lam, one member of the logistics team, forgot to check the volunteer schedule, causing 40 pounds of food to be thrown away on Wednesday night.\"", "o": [["A", "\"Lam, you need to be more responsible. Missing your volunteer shift like this isn't acceptable because everyone depends on you.\""], ["B", "\"Lam, I had to apologize to the cafeteria staff for twenty minutes because no one showed up, and it was incredibly embarrassing.\""], ["C", "\"Hey Lam, don't worry about Wednesday night! The cafeteria staff will get over it, and you're doing a great job overall.\""], ["D", "\"Lam, our logistics team is aimed at ensuring a 100% reliable pickup schedule so no food gets thrown away. Because Wednesday's shift went uncovered, we fell short of that target.\""]], "a": "D"}, {"n": 26, "q": "What is NOT true about conflict in teamwork?", "o": [["A", "Leaders should avoid conflict at all costs."], ["B", "There are many different sources of conflict for a team."], ["C", "If handled poorly, it can create distrust within a group."], ["D", "It can be constructive for team development."]], "a": "A"}, {"n": 27, "q": "What is the main problem with the following excerpt from the meeting minutes? \"Trang presented a wonderful, highly creative idea for the club's Gala dinner. Unsurprisingly, Tuan immediately started whining about the budget and shut down her ideas in a really rude, insensitive tone. He tried to force the team to buy cheap food from a local buffet, which would make our club look incredibly unprofessional to the whole university.\"", "o": [["A", "Introducing editorial bias or emotion."], ["B", "Lack of \"next-step\" mechanics."], ["C", "Total ambiguity."], ["D", "Over-detailing."], ["E", "Informal language."]], "a": "A"}, {"n": 28, "q": "According to the \"Five Key Drivers\", how does team size affect group cohesiveness?", "o": [["A", "Bigger teams lead to higher satisfaction."], ["B", "Bigger teams lead to lower satisfaction and more conflict."], ["C", "Size does not affect cohesiveness."], ["D", "Bigger teams make entry harder and increase status."]], "a": "B"}, {"n": 29, "q": "Which level of Maslow’s hierarchy of needs is referred to in the following statement? \"Fostering a collaborative, inclusive culture where team members feel seen and valued as individuals.\"", "o": [["A", "Physiological needs."], ["B", "Safety needs."], ["C", "Love and belonging."], ["D", "Esteem."], ["E", "Self-actualization."]], "a": "C"}, {"n": 30, "q": "Which organizational pattern is most suitable for explaining the steps in a business process?", "o": [["A", "Compare-contrast"], ["B", "Chronological order"], ["C", "Classification"], ["D", "Problem-solution"]], "a": "B"}, {"n": 31, "q": "What is the main purpose of using a clear and concise writing style in business communication?", "o": [["A", "To impress readers with complex vocabulary"], ["B", "To make messages easier for readers to understand"], ["C", "To increase the length of documents"], ["D", "To avoid using active voice"]], "a": "B"}, {"n": 32, "q": "Which statement best describes plagiarism?", "o": [["A", "Using visuals in a report"], ["B", "Presenting another person’s words or ideas as your own"], ["C", "Writing a summary in shorter form"], ["D", "Using headings in a report"]], "a": "B"}, {"n": 33, "q": "Why is feedback important in the writing process?", "o": [["A", "It replaces the need for revision"], ["B", "It helps identify unclear sections and improve communication"], ["C", "It guarantees that all readers will agree with the writer"], ["D", "It makes reports longer and more detailed"]], "a": "B"}, {"n": 34, "q": "What is the primary purpose of an analytical report?", "o": [["A", "To entertain readers"], ["B", "To record attendance"], ["C", "To interpret information and provide recommendations"], ["D", "To summarize meeting schedules only"]], "a": "C"}, {"n": 35, "q": "Which section of a report usually explains the project purpose, background, and scope?", "o": [["A", "Appendix"], ["B", "Introduction"], ["C", "Conclusion"], ["D", "References"]], "a": "B"}, {"n": 36, "q": "What question should a progress report answer?", "o": [["A", "Who won the project competition?"], ["B", "What were the original objectives and what progress has been made?"], ["C", "How many employees joined the company?"], ["D", "Which department has the highest salary?"]], "a": "B"}, {"n": 37, "q": "Which of the following is a common pitfall in report writing?", "o": [["A", "Using clear headings"], ["B", "Providing too much raw data without explanation"], ["C", "Including next steps and timelines"], ["D", "Organizing sections logically"]], "a": "B"}, {"n": 38, "q": "What should be included in the ‘Next Steps’ section of a progress report?", "o": [["A", "Only completed tasks"], ["B", "Personal opinions unrelated to the project"], ["C", "Clear actions, responsibilities, and timelines"], ["D", "A list of unrelated company policies"]], "a": "C"}, {"n": 39, "q": "Why should teams report project challenges honestly in a progress report?", "o": [["A", "To hide delays from managers"], ["B", "To avoid responsibility"], ["C", "To help managers understand problems and support solutions"], ["D", "To make the report longer"]], "a": "C"}, {"n": 40, "q": "Which statement best describes the purpose of a team meeting planner?", "o": [["A", "It replaces leadership during meetings"], ["B", "It structures agendas, decisions, and action items"], ["C", "It removes the need for follow-up"], ["D", "It limits participation"], ["E", "None of them."]], "a": "B"}, {"n": 41, "q": "Why should agenda items be organized logically with estimated times?", "o": [["A", "To reduce participation"], ["B", "To increase meeting complexity"], ["C", "To eliminate discussion entirely"], ["D", "To help the meeting stay focused and manageable"]], "a": "D"}, {"n": 42, "q": "What is one risk of inviting unnecessary participants to a meeting?", "o": [["A", "Reduced communication barriers"], ["B", "Simpler decision-making"], ["C", "Increased complexity and negative results"], ["D", "Better time management"]], "a": "C"}, {"n": 43, "q": "Why can circular seating arrangements improve interaction?", "o": [["A", "They reinforce hierarchy strongly"], ["B", "They encourage more equal participation and visibility"], ["C", "They reduce eye contact"], ["D", "They limit discussion opportunities"], ["E", "None of them."]], "a": "B"}, {"n": 44, "q": "Which participant behavior is recommended in the meeting checklist?", "o": [["A", "Leaving frequently during the discussion"], ["B", "Ignoring established turn-taking procedures"], ["C", "Demonstrating professionalism in verbal and nonverbal communication"], ["D", "Starting side conversations when bored"], ["E", "None of them."]], "a": "C"}, {"n": 45, "q": "A meeting leader regularly asks quieter members for opinions and summarizes key points. Which meeting skill is being demonstrated?", "o": [["A", "Facilitation and participation management"], ["B", "Dominating discussion"], ["C", "Conflict avoidance"], ["D", "Informal leadership only"]], "a": "A"}, {"n": 46, "q": "What is the purpose of agreeing on ground rules at the beginning of a meeting?", "o": [["A", "To encourage interruptions"], ["B", "To support respectful and organized discussion"], ["C", "To increase conflict"], ["D", "To reduce accountability"], ["E", "None of them."]], "a": "B"}, {"n": 47, "q": "Why is recording action items with deadlines important?", "o": [["A", "It creates unnecessary documentation"], ["B", "It avoids future meetings"], ["C", "It reduces member accountability"], ["D", "It clarifies responsibility and follow-up expectations"]], "a": "D"}, {"n": 48, "q": "Why are meeting roles rotated during practice activities?", "o": [["A", "To create confusion among participants"], ["B", "To ensure all members practise different teamwork skills"], ["C", "To shorten the activity"], ["D", "To reduce accountability"]], "a": "B"}, {"n": 49, "q": "What should happen after the meeting?", "o": [["A", "Team members should ignore the notes"], ["B", "The meeting record should be shared"], ["C", "All plans should change immediately"], ["D", "No follow-up is necessary"]], "a": "B"}, {"n": 50, "q": "An FPT student sits down to write an email requesting an internship at a software company. According to the \"Think, Then Write\" principle, what is the very first thing they should do before putting words on the page?", "o": [["A", "Write a quick first draft and plan to fix the confusion later."], ["B", "Clarify their purpose, their audience, and the desired outcome of the email."], ["C", "Immediately search for external sources on Google to copy a template."], ["D", "Create a working outline without knowing who the primary audience is."]], "a": "B"}, {"n": 51, "q": "Before starting a Capstone project proposal, which of the following is a crucial question the team must ask themselves to ensure their message is effective?", "o": [["A", "How can I use the most complex vocabulary possible?"], ["B", "How can I make this document as long as possible?"], ["C", "What is my main purpose: to inform, persuade, or request action?"], ["D", "Which formatting style will look the most creative, regardless of the rules?"]], "a": "C"}, {"n": 52, "q": "Why does the text highly recommend that business students use a \"Planning Checklist\" when preparing their assignments or business messages?", "o": [["A", "Because it allows writers to skip the research phase entirely."], ["B", "Because it guarantees the message will not require any headings or lists."], ["C", "Because it helps increase the word count of the final document."], ["D", "Because it reduces errors and saves time later in the writing process."]], "a": "D"}, {"n": 53, "q": "When using the Planning Checklist to determine the structure and style of a report, how should a writer organize their main points?", "o": [["A", "Logically from the reader's point of view."], ["B", "In the exact chronological order the research was found."], ["C", "From the most confusing point to the easiest point."], ["D", "Randomly, as long as headings and lists are used."]], "a": "A"}, {"n": 54, "q": "An FPT Business student is writing a report on campus cafeteria operations. They interview the cafeteria manager and review past FPT student feedback reports. What kind of research strategy is the student using?", "o": [["A", "Avoiding external sources to prevent bias."], ["B", "Using internal sources (such as organizational reports and interviews with people involved in the operation)."], ["C", "Relying purely on what they already know without learning anything new."], ["D", "Committing plagiarism by using company documents."]], "a": "B"}, {"n": 55, "q": "A student finds a great paragraph in a professional tech blog and copies it into their essay, changing only two words. They do not include a citation. What is this an example of?", "o": [["A", "Ethical writing, because they changed some words."], ["B", "A standard business research strategy."], ["C", "Paraphrasing effectively."], ["D", "Plagiarism, which is using others’ work without proper acknowledgment."]], "a": "D"}, {"n": 56, "q": "If an IT student needs to include the exact definition of a software framework from an authoritative database in their thesis, what MUST they do to avoid plagiarism?", "o": [["A", "Use quotation marks for the exact wording and keep track of/cite the source."], ["B", "Memorize the quote and pretend they thought of it themselves."], ["C", "Put the quote in bold text so the teacher knows it is important, without citing it."], ["D", "Paraphrase the exact wording so they don't have to use quotation marks or citations."]], "a": "A"}, {"n": 57, "q": "After analyzing all their research on Al trends, an FPT student groups related ideas together and creates a working outline. What is the primary function of this outline?", "o": [["A", "It serves as the final draft to be submitted for grading."], ["B", "It acts as a bridge from research to drafting."], ["C", "It replaces the need for an introduction and conclusion."], ["D", "It proves to the reader that no plagiarism occurred."]], "a": "B"}, {"n": 58, "q": "While reviewing articles for a literature review, a student reads \"critically.\" What does critical reading involve evaluating?", "o": [["A", "Only the publication date of the source to ensure it is from this year."], ["B", "The font style and formatting choices of the original author."], ["C", "The writer’s assumptions, logic, and possible bias."], ["D", "How easily the text can be copied without quotation marks."]], "a": "C"}, {"n": 59, "q": "An FPT Event Club leader is writing an email to recruit event volunteers. According to the planning checklist, what MUST they include to ensure students can actually sign up?", "o": [["A", "A long, detailed history of every past club event."], ["B", "Every single detail about the club so the scope isn't limited."], ["C", "The specific information the reader must have to respond (like a deadline and sign-up link)."], ["D", "Highly academic language to impress the university."]], "a": "C"}, {"n": 60, "q": "Which of the following is considered the \"nonverbal dimension\" in written communication?", "o": [["A", "The selection of short, simple words to ensure the clarity of the business message."], ["B", "The psychological expectations of both the source and the receiver."], ["C", "How the message is portrayed or displayed, such as the medium, typeface, or the appearance of a signature."], ["D", "Anything that blocks or distorts the communication process, such as time zone confusion."]], "a": "C"}, {"n": 61, "q": "Which of the following scenarios at FPT University best illustrates the \"Context\" element?", "o": [["A", "A Software Engineering student is trying to study for their Java exam in the library, but a group nearby is practicing Vovinam loudly, making it hard to concentrate."], ["B", "A lecturer posts a deadline update on FAP (FPT Academic Portal) expecting students to check the portal daily, but a freshman expects the lecturer to announce it verbally during the next class."], ["C", "The president of an FPT student club uses a shared Google Drive link to send the semester's event plan to all club members."], ["D", "After a group presentation in an EduNext slot, a student receives a grade and constructive comments from their peers evaluating their teamwork."]], "a": "B"}, {"n": 62, "q": "An FPT student structures their Capstone proposal in a specific order: first the problem, then the schedule, and finally the team’s responsibilities. Which \"Logos\" strategy are they applying?", "o": [["A", "Reference"], ["B", "Tone"], ["C", "Arrangement"], ["D", "Expectation"]], "a": "C"}, {"n": 63, "q": "According to the principle that \"the best style is the one that fits the situation,\" which of the following scenarios at FPT University strictly requires a \"Formal\" style of written communication?", "o": [["A", "Sending a message on a Zalo group chat to remind your Capstone teammates to meet at the 7-Eleven on campus."], ["B", "Writing a quick email to a friendly lecturer you've studied with for 4 semesters to ask if they are in their office."], ["C", "Drafting an official petition to the Head of the Academic Department to request a waiver for a Capstone prerequisite."], ["D", "Texting your roommate to ask what time the Dom A cafeteria closes tonight|"]], "a": "C"}, {"n": 64, "q": "An FPT student sends the following message via Zalo to a classmate they are paired with for an assignment: \"Hi Minh, could you please send me the latest PowerPoint slides before our presentation at 3 PM? Thanks!\" Based on the levels of style, which category does this message best fit?", "o": [["A", "Informal, because it is relaxed and friendly, yet still structured and suitable for academic/business communication."], ["B", "Colloquial, because it uses everyday slang and highly regional expressions."], ["C", "Casual, because it is written exactly how family members speak to each other at home."], ["D", "Formal, because it uses highly professional language, complex sentence structures, and an official tone."]], "a": "A"}, {"n": 65, "q": "An FPT University student is emailing the IT Helpdesk because they are unable to submit their assignment online. According to the principle \"writers should choose concrete terms when possible and avoid ambiguity,\" which of the following sentences is the BEST choice to include in the email?", "o": [["A", "EduNext displays an \"Error 404\" message every time I click the \"Submit\" button for my Capstone Phase 1 repository."], ["B", "The system is doing something weird with my stuff again."], ["C", "There is a really bad error happening when I try to upload my work to the class."], ["D", "I am experiencing a suboptimal technological phenomenon when interfacing with the university's submission portal."]], "a": "A"}, {"n": 66, "q": "A student club sends this welcome email to new international students: \"Let's get lit at the Dom this weekend!\" Why is this a poor choice for this specific audience?", "o": [["A", "It uses words that are too clear and direct."], ["B", "It uses local slang (\"get lit,\" \"the Dom\") that the international students likely won't understand."], ["C", "The grammar is completely incorrect."], ["D", "It doesn't use big, fancy words to impress them."]], "a": "B"}, {"n": 67, "q": "A student club president needs to write their first formal sponsorship proposal to a local company. What is the best strategy to learn how to write this effectively?", "o": [["A", "Write it at the last minute without showing anyone to keep it original."], ["B", "Avoid reading past proposals so it doesn't ruin their unique style."], ["C", "Wait for a burst of inspiration, since writing is a natural gift."], ["D", "Study successful past proposals, write a draft, and get feedback from an advisor."]], "a": "D"}, {"n": 68, "q": "An FPT student emails their mentor using texting abbreviations \"plz let me know’, all lowercase letters, and forgets to include their name. Which communication barrier does this represent?", "o": [["A", "Spending too much time on the \"Review, Reflect, and Revise\" step."], ["B", "Too much information and poor organization."], ["C", "Failing to \"sweat the small stuff\" by ignoring basic grammar and formatting."], ["D", "Using the wrong communication channel."]], "a": "C"}, {"n": 69, "q": "The FPT Event Club needs to announce a sudden venue change. To avoid confusing the students, what is the BEST strategy?", "o": [["A", "Post a quick, unedited draft immediately to save time."], ["B", "Use complex academic jargon to show the seriousness of the change."], ["C", "Include the entire history of the event to ensure there isn't too little information."], ["D", "Plan the message, adapt the language to the students, and revise it for clarity before posting."]], "a": "D"}, {"n": 70, "q": "What is one important benefit of choosing a college major based on your interests?", "o": [["A", "It guarantees a high salary immediately after graduation."], ["B", "It helps connect your strengths and enjoyment to possible careers."], ["C", "It removes the need to build professional skills."], ["D", "It allows you to avoid all difficult courses."]], "a": "B"}, {"n": 71, "q": "Which of the following is considered a transferable skill?", "o": [["A", "Communication"], ["B", "Driving a forklift"], ["C", "Repairing a specific machine"], ["D", "Operating one company’s software only"]], "a": "A"}, {"n": 72, "q": "What is the main purpose of a résumé?", "o": [["A", "To describe your personal hobbies in detail"], ["B", "To provide entertainment for employers"], ["C", "To market your qualifications and experiences for a job"], ["D", "To replace the job interview completely"]], "a": "C"}, {"n": 73, "q": "Which résumé format lists the most recent experience first?", "o": [["A", "Functional resumé"], ["B", "Hybrid resumé"], ["C", "Video résumé"], ["D", "Reverse chronological resumé"]], "a": "D"}, {"n": 74, "q": "Which item should NOT be included on a professional resumé?", "o": [["A", "Volunteer experience"], ["B", "Professional email address"], ["C", "Political affiliation unrelated to the job"], ["D", "Education and training"]], "a": "C"}, {"n": 75, "q": "What should a candidate do before attending a job interview?", "o": [["A", "Research the company and the position"], ["B", "Memorize every answer word for word"], ["C", "Wait for the interviewer to explain the company"], ["D", "Avoid reviewing their résumé"]], "a": "A"}, {"n": 76, "q": "What does the “A” in the STAR method stand for?", "o": [["A", "Assessment"], ["B", "Achievement"], ["C", "Action"], ["D", "Approach"]], "a": "C"}, {"n": 77, "q": "Which behavior is appropriate during an interview?", "o": [["A", "Interrupting the interviewer to show confidence"], ["B", "Using slang to sound friendly"], ["C", "Avoiding eye contact to reduce stress"], ["D", "Listening carefully and speaking clearly"]], "a": "D"}, {"n": 78, "q": "Why is career development described as an ongoing process?", "o": [["A", "Because career goals never change"], ["B", "Because people continuously review and adjust their plans"], ["C", "Because only managers need career planning"], ["D", "Because career decisions are completed in college"]], "a": "B"}, {"n": 79, "q": "What is a good example of building professional skills outside the classroom?", "o": [["A", "Ignoring networking opportunities"], ["B", "Avoiding teamwork activities"], ["C", "Participating in internships or volunteering"], ["D", "Studying only for exams"]], "a": "C"}, {"n": 80, "q": "How does persuasive speaking differ from informative speaking?", "o": [["A", "Persuasive speaking focuses only on explaining complex data"], ["B", "Informative speaking aims to change what listeners think or do"], ["C", "Persuasive speaking aims to change what listeners think, feel, or do"], ["D", "Informative speaking does not require clear organization"], ["E", "Persuasive speaking should not use accurate information"]], "a": "C"}, {"n": 81, "q": "What is ‘Pathos’ in the context of persuasive presentations?", "o": [["A", "The logical structure of the speech"], ["B", "The use of emotional appeal to move an audience"], ["C", "The speaker's academic degrees and titles"], ["D", "The ethical guidelines followed by the speaker"], ["E", "The physical distance between the speaker and the audience"]], "a": "B"}, {"n": 82, "q": "According to Maslow’s Hierarchy of Needs, which needs must generally be met before moving to higher levels?", "o": [["A", "Self-actualization needs"], ["B", "Esteem needs"], ["C", "Social needs"], ["D", "Basic physiological and safety needs"], ["E", "Intellectual needs"]], "a": "D"}, {"n": 83, "q": "What should ethical persuasive speaking avoid?", "o": [["A", "It proves the speaker has memorized the script"], ["B", "Manipulation, coercion, and false logic"], ["C", "Addressing audience needs"], ["D", "Using emotional stories"], ["E", "Organizing the speech into sections"]], "a": "B"}, {"n": 84, "q": "What is an 'Elevator Speech’?", "o": [["A", "A 20-minute presentation given in an elevator"], ["B", "A technical report about elevator safety"], ["C", "A prepared, brief introduction ions."], ["C", "Ability to judge, check, and even critique the value of material for a given purpose."], ["D", "Ability to grasp or construct meaning from oral, written, and graphic messages."]], "a": "B"}, {"n": 467, "q": "Strategies to stimulate your creative thinking include", "o": [["A", "Sleep on it"], ["B", "Put yourself in nerve-racking situations once in a while to fire up your brain."], ["C", "Keep a notebook with you so you always have a way to record fleeting thoughts."], ["D", "All of these are correct"]], "a": "D"}, {"n": 468, "q": "Status can be defined as:", "o": [["A", "A person’s perceived level of importance or significance within a particular context."], ["B", "A result of power, with its roots in global colonialism and conquests"], ["C", "An action can deny certain groups jobs that pay living wages, can establish unequal, can deny affordable housing, and the list goes on"], ["D", "None of these above"]], "a": "A"}, {"n": 469, "q": "Regarding the psychology of groups, we join groups to satisfy our need to belong, gain information and understanding through social comparison, achieve goals that might elude us if we worked alone, and ...", "o": [["A", "strengthen our bonds with others"], ["B", "show our respect to others"], ["C", "meet the requirements of a group-working environment"], ["D", "define our sense of self and social identity"]], "a": "D"}, {"n": 470, "q": "You are conducting a job campaign to obtain employment. What should you do after analyzing your qualifications and job preferences?", "o": [["A", "start an interview for a job"], ["B", "obtain information about employment opportunities"], ["C", "email cover letter to potential companies"], ["D", "go to gym to prepare good health and appearance for the job interview"]], "a": "B"}, {"n": 471, "q": "You are invited into the office for an interview. What should you not do?", "o": [["A", "Plop down in a chair then pull your phone out"], ["B", "Wait quietly until they are seated first"], ["C", "Shake hands with the interviewees then take a seat"], ["D", "Say thank you, and then ask if you can take a seat"]], "a": "A"}, {"n": 472, "q": "You don't have a job yet, but you’re applying for your first job. What should you write in the work experience section?", "o": [["A", "Just write something down, anything even if it’s not real."], ["B", "I helped my mom with the housework every weekend."], ["C", "I volunteered for three months at “SOS Children’s Village” to help children."], ["D", "I volunteered before, but it wasn’t really a job."]], "a": "C"}, {"n": 473, "q": "What should you do before you have an interview with a company?", "o": [["A", "Add friend or connect with interviewers in all platforms of social media"], ["B", "Do some background research on the job"], ["C", "Ask them if they serve food during the interview"], ["D", "Tell them you have another interview 15 minutes after theirs"]], "a": "B"}];
const VI={"1":{"q":"Phát biểu nào thể hiện trí tuệ cảm xúc cao?","o":{"A":"“Họ đang thiếu tôn trọng tôi.”","B":"“Sao mình tệ trong chuyện này thế?”","C":"“Tôi cảm thấy không được lắng nghe khi bị ngắt lời trong các cuộc họp.”","D":"“Bạn lúc nào cũng phớt lờ ý kiến của tôi.”","E":"“Tôi ổn.”"}},"2":{"q":"Trong một dự án nhóm không có trưởng nhóm rõ ràng, ai chịu trách nhiệm xây dựng sự an toàn tâm lý?","o":{"A":"Giảng viên của khóa học.","B":"Mọi thành viên trong nhóm.","C":"Thành viên có kỹ năng kỹ thuật cao nhất.","D":"Người đã soạn điều lệ nhóm."}},"3":{"q":"Điều gì là không phù hợp khi bảo vệ khóa luận tốt nghiệp?","o":{"A":"Mặc vest vừa vặn hoặc bộ váy kèm áo blazer trang trọng với tông màu trung tính","B":"Đứng ngay trước các slide và đọc nguyên văn chữ trên màn hình","C":"Đứng hơi nghiêng một góc giữa màn hình trình chiếu và bàn hội đồng","D":"Cầm nhẹ bút chuyển slide bằng một tay, hạ xuống bên người khi không dùng"}},"4":{"q":"Trong tình huống sau, hành động nào thể hiện giai đoạn thiết lập tiêu chí trong quy trình giải quyết vấn đề? “Một nhóm sinh viên đang làm bài thuyết trình marketing chiếm 30% điểm cuối kỳ. Hưng im lặng hoàn toàn suốt 4 ngày và chưa làm 3 slide được giao.”","o":{"A":"Nhóm tìm hiểu vì sao vấn đề này xảy ra.","B":"Nhóm xác định chính xác vấn đề.","C":"Nhóm quyết định một giải pháp “tốt” phải trông như thế nào.","D":"Các thành viên động não nhiều hướng đi khác nhau.","E":"Nhóm kiểm tra xem giải pháp có thực sự hiệu quả không."}},"5":{"q":"Mục đích chính của giai đoạn “phản tư” (reflection) khi vượt qua các rào cản trong giao tiếp bằng văn bản là gì?","o":{"A":"Thay ngay các từ bằng từ đồng nghĩa để tăng tổng số từ.","B":"Rà soát các ý chính trong đầu và bảo đảm từng chi tiết đều phục vụ đúng mục đích.","C":"Phát bản nháp cho đông đảo khán giả để nhận phản hồi miệng ngay lập tức.","D":"Bảo đảm văn bản cuối cùng dùng tối đa số câu phức."}},"6":{"q":"Điều gì là phù hợp khi gửi email cho giảng viên để báo nghỉ học?","o":{"A":"Thông báo rõ ngày nghỉ kèm lý do ngắn gọn, lịch sự","B":"Dùng tiếng lóng","C":"Báo sau khi đã nghỉ mà không đưa lý do","D":"Nhờ điểm danh “Có mặt” giúp","E":"Chia sẻ những chi tiết cá nhân quá riêng tư"}},"7":{"q":"Bạn cần viết đề xuất xin ban điều hành công ty phê duyệt ngân sách để chuyển đội chăm sóc khách hàng sang hệ thống chatbot dùng AI. Câu hỏi nào là không bắt buộc khi xác định mục đích của tài liệu?","o":{"A":"“Việc này diễn ra khi nào?”","B":"“Thông điệp cốt lõi và lời kêu gọi hành động là gì?”","C":"“Vì sao việc này cấp thiết ngay lúc này?”","D":"“Tài liệu này sẽ được lưu giữ và sử dụng ở đâu?”","E":"“Giọng văn và cấu trúc nên được định dạng thế nào?”"}},"8":{"q":"Một nhà lãnh đạo phải báo với nhóm rằng dự án của họ không nhận được tài trợ. Biểu cảm khuôn mặt nào là không phù hợp khi truyền đạt tin này?","o":{"A":"Ánh mắt tập trung, vững vàng","B":"Mỉm cười hoặc cười khúc khích lúng túng","C":"Gật đầu bình tĩnh, tiếp nhận","D":"Giao tiếp bằng mắt nghiêm túc và đồng cảm","E":"Lông mày thả lỏng"}},"9":{"q":"Khi người nói khéo léo dẫn dắt dữ kiện, ý tưởng hoặc quan điểm để cố tình đánh vào sự bất an hay nỗi sợ vốn có của khán giả nhằm trục lợi cho mình, họ đang vi phạm hành vi phi đạo đức nào?","o":{"A":"Cưỡng ép","B":"Lừa dối","C":"Thao túng","D":"Hối lộ"}},"10":{"q":"Điều gì KHÔNG làm cho một đề xuất dự án xã hội thuyết phục hơn?","o":{"A":"Bằng chứng","B":"Minh bạch tài chính","C":"Kế hoạch thực tế","D":"Đánh giá rủi ro cẩn thận","E":"Mục tiêu quá lớn"}},"11":{"q":"“Kỹ năng cứng” (hard skills) khác “kỹ năng mềm” (soft skills) ở điểm nào?","o":{"A":"Kỹ năng cứng khó học, còn kỹ năng mềm có thể thành thạo chỉ trong một buổi workshop chiều.","B":"Kỹ năng cứng chỉ áp dụng cho sản xuất vật chất, còn kỹ năng mềm chỉ áp dụng cho vị trí văn phòng.","C":"Kỹ năng cứng là năng lực kỹ thuật hoặc chuyên môn, còn kỹ năng mềm là những phẩm chất chung, có thể chuyển giao như làm việc nhóm.","D":"Kỹ năng cứng mất đi theo thời gian, còn kỹ năng mềm giữ nguyên vĩnh viễn mà không cần luyện tập."}},"12":{"q":"Viết thư tín kinh doanh hiệu quả chủ yếu được học bằng những cách nào?","o":{"A":"Bằng cách xem các bài thuyết trình và quan sát cử chỉ của những người nói có kinh nghiệm.","B":"Bằng cách học thuộc danh sách từ vựng dài và dùng các khung lý thuyết phức tạp.","C":"Bằng cách tránh mọi chỉnh sửa và tập trung viết ngay một bản nháp đầu tiên hoàn hảo.","D":"Bằng cách luyện tập liên tục, đọc các tài liệu chuyên nghiệp và nhận phản hồi mang tính xây dựng."}},"13":{"q":"Bạn đang lập luận cho chính sách làm việc từ xa. Bạn nêu luận điểm rõ ràng nhưng hội đồng rất hoài nghi về năng suất của nhân viên khi làm ở nhà. Bạn nên xây dựng lập luận thế nào để xử lý hiệu quả?","o":{"A":"Phớt lờ sự hoài nghi của họ để giữ giọng tự tin và chỉ tập trung vào lợi ích của làm việc từ xa.","B":"Cô đọng toàn bộ lập luận thành bản tóm tắt ngắn để hội đồng không có thời gian tìm ra lỗi.","C":"Nêu luận điểm rõ ràng, xử lý mối lo của hội đồng như các phản biện, và đưa bằng chứng về cách bạn sẽ kiểm soát rủi ro năng suất.","D":"Diễn đạt lại bằng lời của bạn những thất bại quản lý trước đây của họ để chứng minh sự hoài nghi hiện tại là vô căn cứ."}},"14":{"q":"Điều nào KHÔNG phải là kết quả của trí tuệ cảm xúc cao?","o":{"A":"Khả năng đưa ra quyết định đúng đắn","B":"Các mối quan hệ tốt hơn","C":"Hợp tác chặt chẽ hơn","D":"Không có cảm xúc tiêu cực nào","E":"Mức độ đồng cảm cao"}},"15":{"q":"Bạn đã diễn đạt lại mô hình kinh doanh của một bài nghiên cứu bằng lời của mình và giữ độ dài tương đương bản gốc. Để tránh đạo văn, bước thiết yếu tiếp theo là gì?","o":{"A":"Cô đọng văn bản hơn nữa thành bản tóm tắt.","B":"Ghi nguồn gốc một cách thích hợp","C":"Thay đổi thiết kế tổng thể và các đề mục của tài liệu","D":"Đề cập các phản biện đối với mô hình kinh doanh."}},"16":{"q":"Mục đích chính của một bài thuyết trình thuyết phục là gì?","o":{"A":"Tạo cuộc trò chuyện hấp dẫn thu hút khán giả đồng thời khơi gợi sự tò mò.","B":"Tác động đến niềm tin, thái độ hoặc hành động của khán giả thông qua các lập luận và lời kêu gọi được cấu trúc cẩn thận.","C":"Cung cấp thông tin gây tranh cãi và để khán giả tự rút ra kết luận.","D":"Kể một câu chuyện cá nhân cuốn hút, gây xúc động cho khán giả mà không nhất thiết đòi hỏi hành động."}},"17":{"q":"Đạo văn xảy ra khi nào?","o":{"A":"Khi bạn diễn đạt lại ý tưởng của người viết khác bằng lời của mình và có trích dẫn.","B":"Khi bạn cô đọng một bài báo dài thành bản tóm tắt ngắn và ghi nguồn đầy đủ.","C":"Khi bạn sắp xếp các ý chính trước khi bắt đầu viết bản nháp.","D":"Khi bạn dùng lời hoặc ý tưởng của người khác như của chính mình."}},"18":{"q":"Điều nào KHÔNG thể hiện đạo đức kinh doanh cần giữ vững trong văn bản chuyên nghiệp?","o":{"A":"Minh bạch tuyệt đối","B":"Bóp méo dữ liệu","C":"Phân biệt rõ giữa sự thật và ý kiến","D":"Dùng câu chủ động và ngôn ngữ rõ ràng","E":"Thể hiện sự tôn trọng người đọc"}},"19":{"q":"Khi xây dựng Kế hoạch hành động nghề nghiệp toàn diện, cách hiệu quả nhất để cấu trúc mục tiêu và hành động là gì?","o":{"A":"Chỉ tập trung vào mục tiêu dài hạn 20 năm và bỏ qua các việc cần làm ngay.","B":"Liệt kê càng nhiều mục tiêu không đo lường được càng tốt mà không gán mốc thời gian hay tham số thực hiện thực tế nào.","C":"Sao chép nguyên kế hoạch hành động của một chuyên gia cấp cao để có các chỉ số theo dõi đồng nhất.","D":"Đặt mục tiêu ngắn hạn song song với mục tiêu trung hạn, tất cả được hỗ trợ bằng các bước cụ thể, khả thi."}},"20":{"q":"Bao nhiêu phần trăm công ty trong danh sách Fortune 1000 sử dụng các nhóm tự quản?","o":{"A":"9%.","B":"60%.","C":"79%.","D":"91%."}},"21":{"q":"Nếu một bản resume nháp có quá nhiều chữ viết tắt, thông tin về lối sống cá nhân, mức lương mong muốn và dài hơn ba trang cho vị trí mới ra trường, nên ưu tiên chỉnh sửa những gì?","o":{"A":"Bỏ thông tin cá nhân, bỏ mức lương mong muốn, viết đầy đủ các chữ viết tắt và rút gọn còn 1–2 trang.","B":"Giữ nguyên nội dung nhưng đổi sang phông chữ cầu kỳ để thu hút ánh nhìn.","C":"Bỏ thông tin liên lạc để bảo vệ quyền riêng tư, và thêm mô tả chi tiết ngoại hình.","D":"Giữ cấu trúc ba trang nhưng thêm danh sách đầy đủ tất cả các môn học thời trung học."}},"22":{"q":"Khi chia sẻ công việc trong dự án nhóm, điều gì thường quan trọng hơn sản phẩm cuối cùng?","o":{"A":"Trải nghiệm học tập.","B":"Tự mình làm hết mọi việc.","C":"Tần suất trễ hạn.","D":"Các quy tắc ngầm không chính thức."}},"23":{"q":"Trong ví dụ nào dưới đây, một cuộc họp nhóm là không cần thiết?","o":{"A":"Một nhóm sinh viên thay đổi toàn bộ hướng đi của dự án xã hội giữa chừng.","B":"Một nhóm công ty khởi động một sáng kiến quý quan trọng.","C":"Nhóm kỹ thuật từ chối xây dựng một tính năng vì tốn quá nhiều thời gian, trong khi nhóm marketing khăng khăng đó là then chốt cho đợt ra mắt.","D":"Một nhóm cần lập danh sách các nhà tài trợ tiềm năng cho buổi tiệc từ thiện.","E":"Soạn thảo đề xuất cho dự án nhóm."}},"24":{"q":"Đâu KHÔNG phải là chủ đề cho một đề xuất dự án xã hội?","o":{"A":"Trung tâm chia sẻ và sửa chữa xe đạp do sinh viên điều hành.","B":"Các buổi workshop STEM hằng tuần cho thanh thiếu niên thiệt thòi.","C":"Triển khai chatbot chăm sóc khách hàng dùng AI cho một thương hiệu thương mại điện tử.","D":"Chống bệnh liên quan đến nắng nóng ở người vô gia cư tại đô thị."}},"25":{"q":"Phản hồi nào của người lãnh đạo trong tình huống sau là phản hồi hướng đến mục tiêu (goal-directed)? “Campus Food Rescue là một dự án xã hội do sinh viên điều hành nhằm giảm lãng phí thực phẩm trong khuôn viên trường. Vào thứ Hai, thứ Tư và thứ Sáu mỗi tuần lúc đóng cửa, sinh viên cân, ghi chép và vận chuyển an toàn các suất ăn thừa của trường đến nơi trú ẩn địa phương. Lâm, một thành viên đội hậu cần, quên kiểm tra lịch tình nguyện viên, khiến 40 pound thực phẩm bị bỏ đi vào tối thứ Tư.”","o":{"A":"“Lâm, bạn cần có trách nhiệm hơn. Bỏ ca tình nguyện như vậy là không chấp nhận được vì mọi người đều trông cậy vào bạn.”","B":"“Lâm, tôi phải xin lỗi nhân viên căng tin suốt hai mươi phút vì không ai đến, và điều đó cực kỳ xấu hổ.”","C":"“Này Lâm, đừng lo về tối thứ Tư nhé! Nhân viên căng tin sẽ quên thôi, và nhìn chung bạn làm rất tốt.”","D":"“Lâm, đội hậu cần của chúng ta nhằm bảo đảm lịch thu gom đáng tin cậy 100% để không thực phẩm nào bị bỏ đi. Vì ca tối thứ Tư không có người, chúng ta đã không đạt mục tiêu đó.”"}},"26":{"q":"Điều nào KHÔNG đúng về xung đột trong làm việc nhóm?","o":{"A":"Người lãnh đạo nên tránh xung đột bằng mọi giá.","B":"Có nhiều nguồn gốc khác nhau gây ra xung đột trong nhóm.","C":"Nếu xử lý kém, xung đột có thể gây mất lòng tin trong nhóm.","D":"Xung đột có thể mang tính xây dựng cho sự phát triển của nhóm."}},"27":{"q":"Vấn đề chính của đoạn trích biên bản họp sau là gì? “Trang đã trình bày một ý tưởng tuyệt vời, rất sáng tạo cho tiệc Gala của câu lạc bộ. Không bất ngờ, Tuấn lập tức rên rỉ về ngân sách và dập tắt ý tưởng của cô bằng giọng điệu rất thô lỗ, vô cảm. Anh ta cố ép cả nhóm mua đồ ăn rẻ ở một quán buffet địa phương, điều này sẽ khiến câu lạc bộ của chúng ta trông cực kỳ thiếu chuyên nghiệp trước toàn trường.”","o":{"A":"Đưa vào thiên kiến hoặc cảm xúc chủ quan của người ghi.","B":"Thiếu cơ chế “bước tiếp theo”.","C":"Hoàn toàn mơ hồ.","D":"Chi tiết quá mức.","E":"Ngôn ngữ thân mật, không trang trọng."}},"28":{"q":"Theo “Năm yếu tố then chốt” (Five Key Drivers), quy mô nhóm ảnh hưởng thế nào đến tính gắn kết của nhóm?","o":{"A":"Nhóm lớn hơn dẫn đến mức hài lòng cao hơn.","B":"Nhóm lớn hơn dẫn đến mức hài lòng thấp hơn và nhiều xung đột hơn.","C":"Quy mô không ảnh hưởng đến tính gắn kết.","D":"Nhóm lớn hơn khiến việc gia nhập khó hơn và làm tăng địa vị."}},"29":{"q":"Câu sau đề cập đến cấp bậc nào trong tháp nhu cầu của Maslow? “Nuôi dưỡng một văn hóa hợp tác, hòa nhập, nơi các thành viên cảm thấy được nhìn nhận và trân trọng như những cá nhân.”","o":{"A":"Nhu cầu sinh lý.","B":"Nhu cầu an toàn.","C":"Nhu cầu yêu thương và thuộc về.","D":"Nhu cầu được tôn trọng.","E":"Nhu cầu tự thể hiện (tự hoàn thiện)."}},"30":{"q":"Mô hình tổ chức nội dung nào phù hợp nhất để giải thích các bước của một quy trình kinh doanh?","o":{"A":"So sánh – đối chiếu","B":"Theo trình tự thời gian","C":"Phân loại","D":"Vấn đề – giải pháp"}},"31":{"q":"Mục đích chính của việc dùng văn phong rõ ràng, súc tích trong giao tiếp kinh doanh là gì?","o":{"A":"Gây ấn tượng với người đọc bằng từ vựng phức tạp","B":"Giúp người đọc dễ hiểu thông điệp hơn","C":"Làm tài liệu dài hơn","D":"Tránh dùng câu chủ động"}},"32":{"q":"Phát biểu nào mô tả đúng nhất về đạo văn?","o":{"A":"Dùng hình ảnh minh họa trong báo cáo","B":"Trình bày lời lẽ hoặc ý tưởng của người khác như của chính mình","C":"Viết bản tóm tắt ngắn hơn","D":"Dùng đề mục trong báo cáo"}},"33":{"q":"Vì sao phản hồi (feedback) quan trọng trong quá trình viết?","o":{"A":"Nó thay thế nhu cầu chỉnh sửa","B":"Nó giúp phát hiện các phần chưa rõ và cải thiện giao tiếp","C":"Nó bảo đảm mọi người đọc đều đồng ý với người viết","D":"Nó làm báo cáo dài và chi tiết hơn"}},"34":{"q":"Mục đích chính của một báo cáo phân tích là gì?","o":{"A":"Giải trí cho người đọc","B":"Ghi nhận sự có mặt","C":"Diễn giải thông tin và đưa ra khuyến nghị","D":"Chỉ tóm tắt lịch họp"}},"35":{"q":"Phần nào của báo cáo thường giải thích mục đích, bối cảnh và phạm vi của dự án?","o":{"A":"Phụ lục","B":"Phần giới thiệu","C":"Phần kết luận","D":"Tài liệu tham khảo"}},"36":{"q":"Một báo cáo tiến độ nên trả lời câu hỏi nào?","o":{"A":"Ai đã thắng cuộc thi dự án?","B":"Các mục tiêu ban đầu là gì và đã đạt được tiến độ nào?","C":"Có bao nhiêu nhân viên gia nhập công ty?","D":"Phòng ban nào có mức lương cao nhất?"}},"37":{"q":"Điều nào sau đây là một lỗi thường gặp khi viết báo cáo?","o":{"A":"Dùng đề mục rõ ràng","B":"Đưa quá nhiều dữ liệu thô mà không giải thích","C":"Bao gồm các bước tiếp theo và mốc thời gian","D":"Sắp xếp các phần một cách hợp lý"}},"38":{"q":"Nên đưa gì vào mục “Các bước tiếp theo” (Next Steps) của báo cáo tiến độ?","o":{"A":"Chỉ các nhiệm vụ đã hoàn thành","B":"Ý kiến cá nhân không liên quan đến dự án","C":"Các hành động, trách nhiệm và mốc thời gian rõ ràng","D":"Danh sách các chính sách công ty không liên quan"}},"39":{"q":"Vì sao các nhóm nên báo cáo trung thực những thách thức của dự án trong báo cáo tiến độ?","o":{"A":"Để che giấu sự chậm trễ với quản lý","B":"Để trốn tránh trách nhiệm","C":"Để giúp quản lý hiểu vấn đề và hỗ trợ tìm giải pháp","D":"Để báo cáo dài hơn"}},"40":{"q":"Phát biểu nào mô tả đúng nhất mục đích của bảng kế hoạch cuộc họp nhóm (team meeting planner)?","o":{"A":"Nó thay thế vai trò lãnh đạo trong cuộc họp","B":"Nó cấu trúc chương trình nghị sự, các quyết định và các đầu việc hành động","C":"Nó loại bỏ nhu cầu theo dõi sau họp","D":"Nó hạn chế sự tham gia","E":"Không đáp án nào."}},"41":{"q":"Vì sao các mục trong chương trình nghị sự nên được sắp xếp hợp lý kèm thời gian ước tính?","o":{"A":"Để giảm sự tham gia","B":"Để tăng độ phức tạp của cuộc họp","C":"Để loại bỏ hoàn toàn thảo luận","D":"Để giúp cuộc họp tập trung và dễ kiểm soát"}},"42":{"q":"Một rủi ro khi mời những người tham dự không cần thiết vào cuộc họp là gì?","o":{"A":"Giảm rào cản giao tiếp","B":"Ra quyết định đơn giản hơn","C":"Tăng độ phức tạp và dẫn đến kết quả tiêu cực","D":"Quản lý thời gian tốt hơn"}},"43":{"q":"Vì sao cách sắp xếp chỗ ngồi hình tròn có thể cải thiện tương tác?","o":{"A":"Chúng củng cố mạnh mẽ thứ bậc","B":"Chúng khuyến khích sự tham gia bình đẳng hơn và mọi người nhìn thấy nhau","C":"Chúng làm giảm giao tiếp bằng mắt","D":"Chúng hạn chế cơ hội thảo luận","E":"Không đáp án nào."}},"44":{"q":"Hành vi nào của người tham dự được khuyến nghị trong danh mục kiểm tra cuộc họp?","o":{"A":"Thường xuyên rời đi giữa lúc thảo luận","B":"Phớt lờ quy trình luân phiên phát biểu đã thống nhất","C":"Thể hiện tính chuyên nghiệp trong giao tiếp bằng lời và phi ngôn ngữ","D":"Bắt đầu nói chuyện riêng khi chán","E":"Không đáp án nào."}},"45":{"q":"Một người điều hành cuộc họp thường xuyên hỏi ý kiến các thành viên ít nói và tóm tắt các điểm chính. Kỹ năng họp nào đang được thể hiện?","o":{"A":"Điều phối và quản lý sự tham gia","B":"Áp đảo cuộc thảo luận","C":"Né tránh xung đột","D":"Chỉ là lãnh đạo không chính thức"}},"46":{"q":"Mục đích của việc thống nhất các quy tắc chung ở đầu cuộc họp là gì?","o":{"A":"Để khuyến khích việc ngắt lời","B":"Để hỗ trợ thảo luận tôn trọng và có tổ chức","C":"Để tăng xung đột","D":"Để giảm trách nhiệm giải trình","E":"Không đáp án nào."}},"47":{"q":"Vì sao việc ghi lại các đầu việc hành động kèm thời hạn lại quan trọng?","o":{"A":"Nó tạo ra tài liệu không cần thiết","B":"Nó tránh các cuộc họp sau này","C":"Nó làm giảm trách nhiệm của thành viên","D":"Nó làm rõ trách nhiệm và kỳ vọng theo dõi sau họp"}},"48":{"q":"Vì sao các vai trò trong cuộc họp được luân phiên trong các hoạt động thực hành?","o":{"A":"Để gây nhầm lẫn cho người tham gia","B":"Để bảo đảm mọi thành viên thực hành các kỹ năng làm việc nhóm khác nhau","C":"Để rút ngắn hoạt động","D":"Để giảm trách nhiệm giải trình"}},"49":{"q":"Điều gì nên xảy ra sau cuộc họp?","o":{"A":"Các thành viên nên bỏ qua ghi chú","B":"Biên bản cuộc họp nên được chia sẻ","C":"Mọi kế hoạch nên thay đổi ngay lập tức","D":"Không cần theo dõi gì thêm"}},"50":{"q":"Một sinh viên FPT ngồi xuống viết email xin thực tập tại một công ty phần mềm. Theo nguyên tắc “Think, Then Write” (Nghĩ trước, viết sau), việc đầu tiên họ nên làm trước khi đặt bút viết là gì?","o":{"A":"Viết nhanh bản nháp đầu tiên và dự định sửa chỗ rối sau.","B":"Làm rõ mục đích, đối tượng người đọc và kết quả mong muốn của email.","C":"Lập tức lên Google tìm nguồn bên ngoài để chép một mẫu có sẵn.","D":"Lập dàn ý làm việc mà không biết đối tượng chính là ai."}},"51":{"q":"Trước khi bắt đầu đề xuất dự án Capstone, câu hỏi then chốt nào sau đây nhóm phải tự đặt ra để thông điệp có hiệu quả?","o":{"A":"Làm sao dùng được từ vựng phức tạp nhất có thể?","B":"Làm sao để tài liệu này dài nhất có thể?","C":"Mục đích chính của tôi là gì: thông tin, thuyết phục hay yêu cầu hành động?","D":"Phong cách định dạng nào trông sáng tạo nhất, bất kể quy định?"}},"52":{"q":"Vì sao văn bản đặc biệt khuyến nghị sinh viên kinh doanh dùng “Danh mục kiểm tra lập kế hoạch” (Planning Checklist) khi chuẩn bị bài tập hoặc thông điệp kinh doanh?","o":{"A":"Vì nó cho phép người viết bỏ qua hoàn toàn giai đoạn nghiên cứu.","B":"Vì nó bảo đảm thông điệp không cần đề mục hay danh sách.","C":"Vì nó giúp tăng số từ của tài liệu cuối cùng.","D":"Vì nó giảm lỗi và tiết kiệm thời gian ở các giai đoạn viết sau."}},"53":{"q":"Khi dùng Danh mục kiểm tra lập kế hoạch để xác định cấu trúc và văn phong của báo cáo, người viết nên tổ chức các ý chính như thế nào?","o":{"A":"Một cách logic theo góc nhìn của người đọc.","B":"Theo đúng thứ tự thời gian tìm thấy tài liệu nghiên cứu.","C":"Từ điểm rối nhất đến điểm dễ nhất.","D":"Ngẫu nhiên, miễn là có đề mục và danh sách."}},"54":{"q":"Một sinh viên ngành Kinh doanh FPT đang viết báo cáo về hoạt động căng tin trường. Bạn ấy phỏng vấn quản lý căng tin và xem lại các báo cáo phản hồi của sinh viên FPT trước đây. Bạn ấy đang dùng chiến lược nghiên cứu nào?","o":{"A":"Tránh nguồn bên ngoài để không bị thiên kiến.","B":"Dùng nguồn nội bộ (như báo cáo của tổ chức và phỏng vấn những người tham gia vận hành).","C":"Chỉ dựa vào những gì đã biết mà không học thêm điều gì mới.","D":"Phạm tội đạo văn do dùng tài liệu của tổ chức."}},"55":{"q":"Một sinh viên tìm thấy một đoạn văn hay trên blog công nghệ chuyên nghiệp và chép vào bài luận, chỉ đổi hai từ và không ghi nguồn. Đây là ví dụ của điều gì?","o":{"A":"Viết có đạo đức, vì đã đổi một số từ.","B":"Một chiến lược nghiên cứu kinh doanh tiêu chuẩn.","C":"Diễn đạt lại (paraphrase) hiệu quả.","D":"Đạo văn – tức là dùng công trình của người khác mà không ghi nhận đúng cách."}},"56":{"q":"Nếu một sinh viên IT cần đưa vào luận văn định nghĩa nguyên văn của một framework phần mềm từ cơ sở dữ liệu uy tín, họ PHẢI làm gì để tránh đạo văn?","o":{"A":"Dùng dấu ngoặc kép cho đúng nguyên văn và theo dõi/trích dẫn nguồn.","B":"Học thuộc câu trích và giả vờ là mình nghĩ ra.","C":"In đậm câu trích để giáo viên biết là quan trọng mà không cần trích dẫn.","D":"Diễn đạt lại nguyên văn để khỏi phải dùng ngoặc kép hay trích dẫn."}},"57":{"q":"Sau khi phân tích toàn bộ nghiên cứu về xu hướng AI, một sinh viên FPT nhóm các ý liên quan lại và lập dàn ý làm việc. Chức năng chính của dàn ý này là gì?","o":{"A":"Nó là bản nháp cuối cùng để nộp chấm điểm.","B":"Nó đóng vai trò cầu nối từ nghiên cứu sang soạn thảo.","C":"Nó thay thế nhu cầu có phần mở đầu và kết luận.","D":"Nó chứng minh với người đọc rằng không có đạo văn."}},"58":{"q":"Khi xem lại các bài báo cho phần tổng quan tài liệu, một sinh viên đọc “phản biện” (critically). Đọc phản biện bao gồm đánh giá điều gì?","o":{"A":"Chỉ ngày xuất bản của nguồn để bảo đảm là của năm nay.","B":"Kiểu phông chữ và lựa chọn định dạng của tác giả gốc.","C":"Các giả định, logic và khả năng thiên kiến của người viết.","D":"Việc văn bản dễ bị sao chép đến mức nào khi không có dấu ngoặc kép."}},"59":{"q":"Một trưởng câu lạc bộ sự kiện FPT đang viết email tuyển tình nguyện viên. Theo danh mục kiểm tra lập kế hoạch, họ PHẢI đưa gì vào để sinh viên thực sự có thể đăng ký?","o":{"A":"Một lịch sử dài, chi tiết về mọi sự kiện trước đây của câu lạc bộ.","B":"Mọi chi tiết về câu lạc bộ để phạm vi không bị giới hạn.","C":"Thông tin cụ thể người đọc cần có để phản hồi (như hạn chót và đường dẫn đăng ký).","D":"Ngôn ngữ mang tính học thuật cao để gây ấn tượng với trường."}},"60":{"q":"Điều nào sau đây được xem là “khía cạnh phi ngôn ngữ” (nonverbal dimension) trong giao tiếp bằng văn bản?","o":{"A":"Việc chọn từ ngắn, đơn giản để bảo đảm thông điệp kinh doanh rõ ràng.","B":"Những kỳ vọng tâm lý của cả nguồn phát và người nhận.","C":"Cách thông điệp được thể hiện hoặc hiển thị, như phương tiện, kiểu chữ hoặc hình thức chữ ký.","D":"Bất cứ thứ gì cản trở hoặc làm méo quá trình giao tiếp, như nhầm lẫn múi giờ."}},"61":{"q":"Tình huống nào sau đây tại Đại học FPT minh họa rõ nhất yếu tố “Bối cảnh” (Context)?","o":{"A":"Một sinh viên Kỹ thuật phần mềm đang cố ôn thi Java trong thư viện, nhưng một nhóm gần đó tập Vovinam ồn ào khiến bạn khó tập trung.","B":"Một giảng viên đăng cập nhật hạn nộp bài trên FAP (FPT Academic Portal) và mong sinh viên kiểm tra cổng mỗi ngày, nhưng một tân sinh viên lại mong giảng viên thông báo bằng lời ở buổi học tiếp theo.","C":"Chủ nhiệm một câu lạc bộ sinh viên FPT dùng đường dẫn Google Drive chung để gửi kế hoạch sự kiện của học kỳ cho mọi thành viên.","D":"Sau buổi thuyết trình nhóm trong một slot EduNext, một sinh viên nhận điểm và các nhận xét mang tính xây dựng từ bạn bè đánh giá khả năng làm việc nhóm của mình."}},"62":{"q":"Một sinh viên FPT cấu trúc đề xuất Capstone theo thứ tự cụ thể: trước hết là vấn đề, rồi đến lịch trình, và cuối cùng là trách nhiệm của nhóm. Bạn ấy đang áp dụng chiến lược “Logos” nào?","o":{"A":"Tham chiếu","B":"Giọng điệu","C":"Sắp xếp (bố cục)","D":"Kỳ vọng"}},"63":{"q":"Theo nguyên tắc “phong cách tốt nhất là phong cách phù hợp với tình huống”, tình huống nào sau đây tại Đại học FPT bắt buộc phải dùng văn phong “Trang trọng” (Formal)?","o":{"A":"Nhắn trong nhóm chat Zalo để nhắc đồng đội Capstone gặp nhau ở 7-Eleven trong trường.","B":"Viết nhanh một email cho giảng viên thân thiện đã dạy bạn 4 kỳ để hỏi thầy/cô có ở văn phòng không.","C":"Soạn đơn kiến nghị chính thức gửi Trưởng bộ môn để xin miễn một môn tiên quyết của Capstone.","D":"Nhắn cho bạn cùng phòng hỏi tối nay căng tin Dom A đóng cửa lúc mấy giờ."}},"64":{"q":"Một sinh viên FPT gửi tin nhắn Zalo sau cho bạn cùng cặp làm bài tập: “Chào Minh, bạn gửi giúp mình các slide PowerPoint mới nhất trước buổi thuyết trình lúc 3 giờ chiều nhé? Cảm ơn bạn!” Dựa trên các mức độ văn phong, tin nhắn này phù hợp nhất với loại nào?","o":{"A":"Informal (không trang trọng), vì thoải mái, thân thiện nhưng vẫn có cấu trúc và phù hợp với giao tiếp học thuật/kinh doanh.","B":"Colloquial (khẩu ngữ), vì dùng tiếng lóng thường ngày và các cách nói mang tính địa phương cao.","C":"Casual (suồng sã), vì viết đúng như cách các thành viên gia đình nói chuyện với nhau ở nhà.","D":"Formal (trang trọng), vì dùng ngôn ngữ rất chuyên nghiệp, cấu trúc câu phức tạp và giọng điệu chính thức."}},"65":{"q":"Một sinh viên Đại học FPT gửi email cho IT Helpdesk vì không thể nộp bài tập trực tuyến. Theo nguyên tắc “người viết nên chọn thuật ngữ cụ thể khi có thể và tránh mơ hồ”, câu nào sau đây là lựa chọn TỐT NHẤT để đưa vào email?","o":{"A":"EduNext hiện thông báo “Error 404” mỗi lần tôi bấm nút “Submit” cho repository Capstone Giai đoạn 1 của mình.","B":"Hệ thống lại đang làm gì đó kỳ cục với đồ của tôi.","C":"Có một lỗi rất tệ xảy ra khi tôi cố tải bài lên lớp.","D":"Tôi đang gặp một hiện tượng công nghệ dưới mức tối ưu khi giao tiếp với cổng nộp bài của trường."}},"66":{"q":"Một câu lạc bộ sinh viên gửi email chào mừng sinh viên quốc tế mới: “Let's get lit at the Dom this weekend!” Vì sao đây là lựa chọn kém cho đối tượng cụ thể này?","o":{"A":"Nó dùng từ quá rõ ràng và trực tiếp.","B":"Nó dùng tiếng lóng địa phương (“get lit”, “the Dom”) mà sinh viên quốc tế nhiều khả năng không hiểu.","C":"Ngữ pháp hoàn toàn sai.","D":"Nó không dùng từ to tát, cầu kỳ để gây ấn tượng với họ."}},"67":{"q":"Chủ nhiệm một câu lạc bộ sinh viên cần viết đề xuất tài trợ chính thức đầu tiên gửi một công ty địa phương. Chiến lược tốt nhất để học cách viết hiệu quả là gì?","o":{"A":"Viết vào phút chót và không cho ai xem để giữ tính độc đáo.","B":"Tránh đọc các đề xuất trước đây để không làm hỏng phong cách riêng.","C":"Chờ một cơn cảm hứng bùng nổ, vì viết là năng khiếu bẩm sinh.","D":"Nghiên cứu các đề xuất thành công trước đây, viết bản nháp và xin phản hồi từ cố vấn."}},"68":{"q":"Một sinh viên FPT gửi email cho người hướng dẫn bằng chữ viết tắt kiểu nhắn tin “plz let me know”, viết toàn chữ thường và quên ghi tên. Đây là biểu hiện của rào cản giao tiếp nào?","o":{"A":"Dành quá nhiều thời gian cho bước “Review, Reflect, and Revise” (Xem lại, Phản tư, Chỉnh sửa).","B":"Quá nhiều thông tin và tổ chức kém.","C":"Không “chú ý chi tiết nhỏ” do bỏ qua ngữ pháp và định dạng cơ bản.","D":"Dùng sai kênh giao tiếp."}},"69":{"q":"Câu lạc bộ Sự kiện FPT cần thông báo đột xuất đổi địa điểm. Để tránh gây rối cho sinh viên, chiến lược TỐT NHẤT là gì?","o":{"A":"Đăng ngay bản nháp chưa chỉnh sửa để tiết kiệm thời gian.","B":"Dùng thuật ngữ học thuật phức tạp để thể hiện mức độ nghiêm trọng của thay đổi.","C":"Đưa toàn bộ lịch sử sự kiện vào để chắc chắn không thiếu thông tin.","D":"Lên kế hoạch cho thông điệp, điều chỉnh ngôn ngữ phù hợp với sinh viên và rà soát cho rõ ràng trước khi đăng."}},"70":{"q":"Một lợi ích quan trọng của việc chọn chuyên ngành đại học dựa trên sở thích là gì?","o":{"A":"Nó bảo đảm mức lương cao ngay sau khi tốt nghiệp.","B":"Nó giúp kết nối điểm mạnh và niềm yêu thích của bạn với các nghề nghiệp khả dĩ.","C":"Nó loại bỏ nhu cầu xây dựng kỹ năng chuyên nghiệp.","D":"Nó cho phép bạn né mọi môn học khó."}},"71":{"q":"Điều nào sau đây được xem là kỹ năng có thể chuyển giao (transferable skill)?","o":{"A":"Giao tiếp","B":"Lái xe nâng","C":"Sửa một loại máy cụ thể","D":"Chỉ vận hành phần mềm của một công ty"}},"72":{"q":"Mục đích chính của một bản résumé (CV) là gì?","o":{"A":"Mô tả chi tiết sở thích cá nhân của bạn","B":"Mang lại sự giải trí cho nhà tuyển dụng","C":"Quảng bá trình độ và kinh nghiệm của bạn cho một công việc","D":"Thay thế hoàn toàn buổi phỏng vấn"}},"73":{"q":"Định dạng résumé nào liệt kê kinh nghiệm gần nhất lên đầu?","o":{"A":"Résumé theo kỹ năng (functional)","B":"Résumé kết hợp (hybrid)","C":"Résumé dạng video","D":"Résumé theo thứ tự thời gian đảo ngược"}},"74":{"q":"Mục nào KHÔNG nên đưa vào một résumé chuyên nghiệp?","o":{"A":"Kinh nghiệm tình nguyện","B":"Địa chỉ email chuyên nghiệp","C":"Khuynh hướng chính trị không liên quan đến công việc","D":"Học vấn và đào tạo"}},"75":{"q":"Ứng viên nên làm gì trước khi đi phỏng vấn?","o":{"A":"Tìm hiểu về công ty và vị trí ứng tuyển","B":"Học thuộc từng câu trả lời từng chữ","C":"Chờ người phỏng vấn giới thiệu về công ty","D":"Tránh xem lại résumé của mình"}},"76":{"q":"Chữ “A” trong phương pháp STAR là viết tắt của gì?","o":{"A":"Assessment (Đánh giá)","B":"Achievement (Thành tựu)","C":"Action (Hành động)","D":"Approach (Cách tiếp cận)"}},"77":{"q":"Hành vi nào là phù hợp trong buổi phỏng vấn?","o":{"A":"Ngắt lời người phỏng vấn để thể hiện sự tự tin","B":"Dùng tiếng lóng để nghe thân thiện","C":"Tránh giao tiếp bằng mắt để giảm căng thẳng","D":"Lắng nghe cẩn thận và nói rõ ràng"}},"78":{"q":"Vì sao phát triển nghề nghiệp được mô tả là một quá trình liên tục?","o":{"A":"Vì mục tiêu nghề nghiệp không bao giờ thay đổi","B":"Vì con người liên tục xem xét và điều chỉnh kế hoạch của mình","C":"Vì chỉ quản lý mới cần lập kế hoạch nghề nghiệp","D":"Vì các quyết định nghề nghiệp đã hoàn tất từ thời đại học"}},"79":{"q":"Đâu là ví dụ tốt về việc xây dựng kỹ năng chuyên nghiệp ngoài lớp học?","o":{"A":"Bỏ qua các cơ hội kết nối (networking)","B":"Né các hoạt động làm việc nhóm","C":"Tham gia thực tập hoặc hoạt động tình nguyện","D":"Chỉ học để thi"}},"80":{"q":"Thuyết trình thuyết phục khác thuyết trình cung cấp thông tin ở điểm nào?","o":{"A":"Thuyết phục chỉ tập trung giải thích dữ liệu phức tạp","B":"Cung cấp thông tin nhằm thay đổi điều người nghe nghĩ hoặc làm","C":"Thuyết phục nhằm thay đổi điều người nghe nghĩ, cảm nhận hoặc làm","D":"Cung cấp thông tin không đòi hỏi tổ chức rõ ràng","E":"Thuyết phục không nên dùng thông tin chính xác"}},"81":{"q":"“Pathos” là gì trong bối cảnh các bài thuyết trình thuyết phục?","o":{"A":"Cấu trúc logic của bài nói","B":"Việc dùng sức hấp dẫn cảm xúc để lay động khán giả","C":"Học vị và chức danh học thuật của người nói","D":"Các nguyên tắc đạo đức mà người nói tuân theo","E":"Khoảng cách vật lý giữa người nói và khán giả"}},"82":{"q":"Theo Tháp nhu cầu Maslow, những nhu cầu nào nhìn chung phải được đáp ứng trước khi chuyển lên các cấp cao hơn?","o":{"A":"Nhu cầu tự thể hiện","B":"Nhu cầu được tôn trọng","C":"Nhu cầu xã hội","D":"Nhu cầu sinh lý cơ bản và an toàn","E":"Nhu cầu trí tuệ"}},"83":{"q":"Thuyết phục có đạo đức nên tránh điều gì?","o":{"A":"Nó chứng minh người nói đã học thuộc kịch bản","B":"Thao túng, cưỡng ép và lập luận sai","C":"Giải quyết nhu cầu của khán giả","D":"Dùng những câu chuyện cảm xúc","E":"Tổ chức bài nói thành các phần"}},"84":{"q":"“Elevator Speech” là gì?","o":{"A":"Bài thuyết trình 20 phút được trình bày trong thang máy","B":"Báo cáo kỹ thuật về an toàn thang máy","C":"Phần giới thiệu hoặc giới thiệu ý tưởng ngắn gọn, được chuẩn bị sẵn cho những cơ hội bất ngờ","D":"Bài nói chỉ dành cho các giám đốc cấp cao","E":"Bài nói thuần thông tin, không có mục tiêu"}},"85":{"q":"Trong Tháp nhu cầu Maslow, cấp nào nằm ở đỉnh cao nhất?","o":{"A":"Sinh lý","B":"An toàn","C":"Xã hội","D":"Được tôn trọng","E":"Tự thể hiện (tự hoàn thiện)"}},"86":{"q":"Chức năng nào của bài thuyết trình thuyết phục nhằm khiến khán giả thực hiện một hành động cụ thể?","o":{"A":"Kích thích","B":"Thuyết phục","C":"Kêu gọi hành động","D":"Cung cấp thông tin","E":"Gây bối rối"}},"87":{"q":"Trong bối cảnh Tháp nhu cầu Maslow, nhu cầu “An toàn” bao gồm:","o":{"A":"Thức ăn, nước uống và giấc ngủ","B":"An ninh, ổn định và sự bảo vệ","C":"Tình bạn và sự thuộc về","D":"Đạt tới tiềm năng đầy đủ","E":"Địa vị và danh tiếng"}},"88":{"q":"Một quảng cáo bảo hiểm nói: “Hãy mua gói của chúng tôi để yên tâm nhà bạn được bảo vệ khỏi hỏa hoạn.” Quảng cáo này nhắm vào nhu cầu nào?","o":{"A":"Nhu cầu sinh lý","B":"Nhu cầu nhận thức","C":"Tự thể hiện","D":"Nhu cầu an toàn","E":"Nhu cầu được tôn trọng"}},"89":{"q":"Bạn gặp một nhà đầu tư tiềm năng ở sảnh và chỉ có 60 giây để giải thích về startup của mình. Bạn nên dùng:","o":{"A":"Elevator speech (bài nói thang máy)","B":"Báo cáo phân tích chi tiết","C":"Bài thuyết trình PowerPoint","D":"Ngụy biện logic","E":"Bản tóm tắt thông tin về lịch sử"}},"90":{"q":"Theo các nguyên tắc của giao tiếp phi ngôn ngữ, vì sao nói rằng “Nonverbal is Inevitable” (Phi ngôn ngữ là không thể tránh khỏi)?","o":{"A":"Vì giao tiếp phi ngôn ngữ không thể tránh được; con người gửi thông điệp phi ngôn ngữ ngay cả khi im lặng","B":"Vì giao tiếp phi ngôn ngữ chỉ có trong các bài nói bằng lời","C":"Vì các tín hiệu phi ngôn ngữ luôn được diễn giải đúng","D":"Vì lời nói kém đáng tin hơn chuyển động cơ thể","E":"Vì thông điệp phi ngôn ngữ luôn quan trọng hơn lời nói"}},"91":{"q":"Nguyên tắc “Nonverbal is Multi-Channel” (Phi ngôn ngữ đa kênh) có ý nghĩa gì đối với người nói?","o":{"A":"Nghĩa là giao tiếp phi ngôn ngữ dùng nhiều kênh cùng lúc","B":"Nghĩa là người nói chỉ nên tập trung vào một kênh","C":"Nghĩa là giao tiếp phi ngôn ngữ chỉ xảy ra trên TV","D":"Nghĩa là kênh lời nói và phi ngôn ngữ không bao giờ mâu thuẫn","E":"Nghĩa là bạn cần thiết bị đặc biệt để gửi thông điệp"}},"92":{"q":"Trong bối cảnh “Chuyển động trong bài nói”, mục đích chính của “Speaker’s Triangle” (Tam giác của người nói) là gì?","o":{"A":"Giữ người nói đứng yên một chỗ","B":"Che giấu sự lo lắng của người nói","C":"Báo hiệu sự chuyển tiếp giữa các ý chính của bài nói","D":"Làm người nói trông như vận động viên","E":"Bảo đảm người nói luôn quay mặt về phía công cụ trực quan"}},"93":{"q":"Vì sao “Giao tiếp bằng mắt” (Eye Contact) lại quan trọng để thành công với khán giả?","o":{"A":"Nó chứng minh người nói đã học thuộc kịch bản","B":"Nó giúp xây dựng uy tín và sự kết nối với khán giả","C":"Nó ngăn khán giả ngủ gật","D":"Nó cho phép người nói thấy ai đang dùng điện thoại","E":"Luật pháp yêu cầu trong môi trường kinh doanh"}},"94":{"q":"Điều nào sau đây là ví dụ về “Artifact” (vật dụng) trong giao tiếp phi ngôn ngữ?","o":{"A":"Giọng điệu của người nói","B":"Quần áo hoặc trang sức của người nói","C":"Cử chỉ tay của người nói","D":"Sự im lặng của người nói","E":"Chữ viết trên slide"}},"95":{"q":"“Paralanguage” (ngôn ngữ phụ trợ) là gì?","o":{"A":"Việc dùng ngôn ngữ ký hiệu","B":"Những từ cụ thể được chọn cho bài nói","C":"Ngôn ngữ chỉ phi công dùng","D":"Nghiên cứu về cách quần áo truyền đạt địa vị","E":"Các khía cạnh phi ngôn ngữ của giọng nói như cao độ, âm lượng và tốc độ"}},"96":{"q":"Chiến lược nào giúp người nói xây dựng uy tín và sự kết nối bằng phi ngôn ngữ?","o":{"A":"Tránh giao tiếp bằng mắt","B":"Áp dụng các chiến lược phi ngôn ngữ để xây dựng uy tín và sự kết nối","C":"Nói bằng giọng đều đều","D":"Đứng sau một bục phát biểu lớn","E":"Dùng nhiều thuật ngữ kỹ thuật"}},"97":{"q":"Bạn giơ ngón cái “thumbs up” ở một nước ngoài và mọi người tỏ vẻ bị xúc phạm. Điều này minh họa:","o":{"A":"Phi ngôn ngữ là không thể tránh khỏi","B":"Ý nghĩa phi ngôn ngữ phụ thuộc vào văn hóa, tình huống và mối quan hệ","C":"Phi ngôn ngữ đa kênh","D":"Công cụ trực quan củng cố các ý chính","E":"Phi ngôn ngữ luôn có sức ảnh hưởng"}},"98":{"q":"Một khán giả nhận thấy tay người nói đang run. Người nói bảo mình tự tin, nhưng khán giả tin rằng họ đang lo lắng. Vì sao?","o":{"A":"Thông điệp bằng lời có sức ảnh hưởng lớn hơn","B":"Khán giả đang thô lỗ","C":"Giọng người nói quá nhỏ","D":"Hành vi phi ngôn ngữ thường có sức ảnh hưởng lớn hơn thông điệp bằng lời","E":"Có quá nhiều vật dụng (artifacts)"}},"99":{"q":"Một sinh viên thuyết trình với giọng rất cao và nhịp nhanh. Đây là loại nào?","o":{"A":"Paralanguage (ngôn ngữ phụ trợ)","B":"Chuyển động cơ thể","C":"Vật dụng (Artifacts)","D":"Không gian","E":"Đặc điểm thể chất"}},"100":{"q":"Theo quy trình Tư duy phản biện (Reflective Thinking) của John Dewey, bước đầu tiên khi giải quyết vấn đề nhóm là gì?","o":{"A":"Phân tích vấn đề","B":"Đưa ra các giải pháp khả dĩ","C":"Xác định vấn đề","D":"Đánh giá các giải pháp","E":"Thiết lập tiêu chí cho các giải pháp"}},"101":{"q":"Rủi ro phổ biến khi vấn đề được xác định quá rộng là gì?","o":{"A":"Bỏ sót thông tin quan trọng","B":"Làm nhóm choáng ngợp","C":"Hạn chế sự sáng tạo","D":"Dẫn đến giải pháp tức thời","E":"Bỏ qua các dữ kiện dựa trên dữ liệu"}},"102":{"q":"Trong quy trình Bảy bước, điều gì xảy ra ở giai đoạn “Phân tích vấn đề”?","o":{"A":"Nhóm chọn giải pháp tốt nhất","B":"Nhóm thu thập thông tin và xem xét nhiều góc nhìn","C":"Nhóm phớt lờ phản hồi của khách hàng","D":"Nó buộc mọi người giao tiếp theo cùng một cách để tránh xung đột.","E":"Nhóm phân vai như Người điều phối và Người ghi chép"}},"103":{"q":"“Xung đột” được định nghĩa thế nào trong bối cảnh làm việc nhóm?","o":{"A":"Dấu hiệu cho thấy một mối quan hệ đang thất bại vĩnh viễn","B":"Một sự đấu tranh gắn với những mục tiêu hoặc nhu cầu được nhận thức là đối lập","C":"Một sự gián đoạn không cần thiết và luôn nên tránh","D":"Một phương pháp lãnh đạo dùng để trừng phạt thành viên kém hiệu quả","E":"Tình huống mà mọi người đồng ý về mọi thứ"}},"104":{"q":"Khi đưa phản hồi, vì sao nó nên “hướng đến mục tiêu” (Goal-directed)?","o":{"A":"Để cho thấy người lãnh đạo luôn đúng","B":"Để tập trung vào khuyết điểm tính cách của cá nhân","C":"Để gắn phản hồi với các mục tiêu và tiêu chuẩn chung","D":"Để làm phản hồi mang tính cá nhân nhất có thể","E":"Để người nhận phản hồi cảm thấy bị trừng phạt"}},"105":{"q":"Bước cuối cùng trong quy trình Tư duy phản biện của Dewey là gì?","o":{"A":"Thực hiện giải pháp đã chọn","B":"Đánh giá các giải pháp","C":"Giải tán nhóm","D":"Ăn mừng thành công","E":"Theo dõi và đánh giá kết quả"}},"106":{"q":"Một thành viên nhóm khó chịu vì bạn đã đổi slide của họ. Để dùng “Phản hồi mang tính hợp tác” (Collaborative Feedback), bạn xử lý thế nào?","o":{"A":"“Slide của bạn xấu.”","B":"“Mình muốn đồng bộ phong cách. Bạn thấy thay đổi này thế nào?”","C":"Đổi lại như cũ và không nói gì","D":"Bảo họ đừng cảm xúc nữa","E":"Nhờ trưởng nhóm xử lý"}},"107":{"q":"Bạn chờ đến sau cuộc họp mới đưa phản hồi cho một người bạn một cách riêng tư. Đây là quy tắc nào?","o":{"A":"Hướng đến mục tiêu","B":"Phản hồi tôn trọng","C":"Hợp tác","D":"Khai thác xung đột","E":"Phân tích"}},"108":{"q":"Sự khác biệt giữa phản ứng “Mang tính xây dựng” và “Mang tính phá hoại” đối với xung đột là gì?","o":{"A":"Phản ứng mang tính xây dựng tập trung vào tính cách của người khác","B":"Phản ứng phá hoại khuyến khích đối thoại cởi mở","C":"Phản ứng mang tính xây dựng khuyến khích học hỏi và giải quyết","D":"Phản ứng mang tính xây dựng luôn thụ động","E":"Phản ứng phá hoại bảo vệ phẩm giá của người khác"}},"109":{"q":"Chiến lược “Giữ thể diện” (Face-saving) trong quản lý xung đột là gì?","o":{"A":"Tách vấn đề khỏi con người và bảo vệ uy tín","B":"Tấn công uy tín của một người để hạ thấp quyền lực của họ","C":"Phớt lờ hoàn toàn người đó trong cuộc họp","D":"Dùng đánh giá và phán xét để thắng cuộc tranh luận","E":"Ép ai đó thừa nhận sai trước cả nhóm"}},"110":{"q":"Vì sao căng thẳng và thay đổi có thể tạo ra thách thức trong làm việc nhóm?","o":{"A":"Các nhóm không bao giờ cần điều chỉnh quy trình","B":"Công việc hợp tác thường đòi hỏi sự điều chỉnh và hoàn thiện","C":"Căng thẳng tự động cải thiện giao tiếp","D":"Thay đổi loại bỏ nhu cầu có mục tiêu"}},"111":{"q":"Vì sao trí tuệ cảm xúc quan trọng trong làm việc nhóm?","o":{"A":"Nó giảm mọi trách nhiệm","B":"Nó cải thiện sự hợp tác và các mối quan hệ","C":"Nó xóa bỏ hạn chót","D":"Nó thay thế giao tiếp"}},"112":{"q":"Tình huống nào nhiều khả năng phản ánh trí tuệ cảm xúc thấp trong một nhóm sinh viên đại học?","o":{"A":"Bất đồng mang tính xây dựng","B":"Mức độ gắn kết và tham gia cao","C":"Rút lui, ít nỗ lực và trễ hạn","D":"Cùng cam kết với mục tiêu"}},"113":{"q":"Mục đích chính của việc bày tỏ cảm xúc một cách hiệu quả là gì?","o":{"A":"Xả ngay sự bực tức","B":"Bảo vệ các mối quan hệ trong nhóm trong khi truyền đạt cảm xúc","C":"Tránh mọi cuộc thảo luận về cảm xúc","D":"Thắng trong các bất đồng","E":"Tất cả đều đúng"}},"114":{"q":"Vì sao xem một vấn đề như một thách thức lại cải thiện làm việc nhóm?","o":{"A":"Thách thức loại bỏ hoàn toàn căng thẳng","B":"Thách thức làm giảm động lực","C":"Thách thức khuyến khích nỗ lực và tư duy hướng mục tiêu","D":"Thách thức giúp né tránh trách nhiệm giải trình"}},"115":{"q":"Nguy cơ của các cuộc thảo luận mang nhiều cảm xúc là gì?","o":{"A":"Chúng loại bỏ bất đồng","B":"Chúng luôn cải thiện làm việc nhóm","C":"Chúng tự động làm giảm sự tham gia","D":"Chúng có thể cản trở việc giải quyết vấn đề mang tính xây dựng"}},"116":{"q":"Sự kết hợp nào hỗ trợ tốt nhất cho làm việc nhóm hiệu quả?","o":{"A":"Giao tiếp hung hăng và phản ứng cảm xúc","B":"Bình tĩnh, đồng cảm và hành vi mang tính xây dựng","C":"Im lặng và né tránh","D":"Cạnh tranh và đổ lỗi"}},"117":{"q":"Mục đích chính của hoạt động “Vòng tròn tri ân” (Appreciation Circle) là gì?","o":{"A":"So sánh kết quả học tập","B":"Củng cố lòng tin và tương tác tích cực","C":"Xác định các thành viên yếu","D":"Phân công vai trò lãnh đạo"}},"118":{"q":"Vì sao giao tiếp tôn trọng được nhấn mạnh trong làm việc nhóm?","o":{"A":"Nó củng cố sự hợp tác và giảm rối loạn chức năng","B":"Nó loại bỏ nhu cầu làm việc nhóm","C":"Nó bảo đảm sự đồng thuận trong mọi cuộc thảo luận","D":"Nó tăng sự kiểm soát theo thứ bậc"}},"119":{"q":"Phẩm chất nào giúp các nhóm mạnh hơn?","o":{"A":"Tự nhận thức","B":"Né tránh","C":"Im lặng","D":"Chỉ cạnh tranh"}},"120":{"q":"Một thách thức lớn của việc quản lý nhóm là gì?","o":{"A":"Tránh giao tiếp","B":"Cân bằng nhu cầu cá nhân và nhu cầu nhóm","C":"Loại bỏ mọi xung đột","D":"Làm việc một mình","E":"Không đáp án nào."}},"121":{"q":"Vì sao việc chuyển từ nhân viên lên quản lý có thể khó khăn?","o":{"A":"Quản lý làm ít việc hơn.","B":"Kỹ năng kỹ thuật không còn hữu ích.","C":"Quản lý phải tập trung nhiều hơn vào con người và các mối quan hệ","D":"Quản lý không còn giao tiếp với nhóm.","E":"Tất cả các đáp án trên."}},"122":{"q":"Ngoài các nhân viên báo cáo trực tiếp, nhà quản lý mới nên quản lý những ai?","o":{"A":"Chỉ khách hàng","B":"Chỉ các quản lý cấp cao","C":"Các bên liên quan như đồng nghiệp ngang cấp và những người có ảnh hưởng","D":"Không ai khác"}},"123":{"q":"Một nhà quản lý muốn cân bằng hiệu quả các nghịch lý (paradox) của nhóm. Hành động nào phản ánh đúng nhất mục tiêu này?","o":{"A":"Chỉ khuyến khích cạnh tranh cá nhân","B":"Hỗ
