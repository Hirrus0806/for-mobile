 trợ cả tính tự chủ lẫn trách nhiệm giải trình","C":"Loại bỏ bất đồng khỏi các cuộc thảo luận","D":"Giao trách nhiệm giống hệt nhau cho mọi thành viên"}},"124":{"q":"Ví dụ nào phản ánh đúng nhất “lãnh đạo bằng sức ảnh hưởng” thay vì bằng quyền lực?","o":{"A":"Đe dọa trừng phạt khi có sai sót","B":"Tự mình kiểm soát mọi quyết định của nhóm","C":"Xây dựng lòng tin và uy tín với các thành viên","D":"Tránh thảo luận với nhóm"}},"125":{"q":"Một nhà lãnh đạo công khai thừa nhận sai lầm, thực hiện đúng lời hứa và hành xử nhất quán. Hành vi lãnh đạo cốt lõi nào đang được thể hiện?","o":{"A":"Ủy quyền","B":"Chính trực","C":"Cạnh tranh","D":"Quyền lực chính thức"}},"126":{"q":"Phản ứng nào thể hiện rõ nhất việc quản lý bất đồng một cách xây dựng?","o":{"A":"Phớt lờ các ý kiến đối lập","B":"Công kích con người thay vì ý tưởng","C":"Ghi nhận cả hai quan điểm và dùng bằng chứng để bảo vệ lập trường","D":"Kết thúc thảo luận trước khi xung đột xuất hiện"}},"127":{"q":"Vì sao các nhóm tự quản thường làm tăng động lực của thành viên?","o":{"A":"Thành viên tránh trách nhiệm.","B":"Vai trò lãnh đạo hoàn toàn biến mất.","C":"Các thành viên kiểm soát nhiều hoạt động hằng ngày hơn.","D":"Mục tiêu trở nên kém quan trọng hơn."}},"128":{"q":"Vì sao hoạt động “Leader-as-Coach” (Lãnh đạo như người huấn luyện) cấm đưa lời khuyên trực tiếp?","o":{"A":"Để giảm giao tiếp","B":"Để khuyến khích người lãnh đạo dẫn dắt tư duy của người khác thông qua các câu hỏi","C":"Để tăng thứ bậc trong nhóm","D":"Để chỉ kiểm tra chuyên môn kỹ thuật"}},"129":{"q":"Một nhà lãnh đạo thay đổi phong cách giao tiếp tùy theo độ khó của nhiệm vụ và kinh nghiệm của nhóm. Điều này thể hiện nguyên tắc nào?","o":{"A":"Tính nhất quán trong lãnh đạo","B":"Sự linh hoạt của lãnh đạo theo tình huống","C":"Quyền lực tập trung","D":"Cạnh tranh cá nhân"}},"130":{"q":"Tin nhắn văn bản (text message) là gì?","o":{"A":"Tin nhắn văn bản là một thông điệp viết ngắn được gửi và nhận bằng thiết bị số.","B":"Nó hữu ích cho giao tiếp không trang trọng, ngắn gọn, cần phản hồi nhanh.","C":"Tin nhắn văn bản là một phần của bức tranh giao tiếp.","D":"Tin nhắn văn bản là một hình thức giao tiếp bằng văn bản gồm các thông điệp ngắn.","E":"Tất cả đều đúng."}},"131":{"q":"Điều gì làm cho việc nhắn tin trong kinh doanh hiệu quả?","o":{"A":"Xác định chính xác người nhận.","B":"Nhắn tin thường dùng ký hiệu và mã để biểu đạt đúng suy nghĩ, ý tưởng và cảm xúc.","C":"Nhắn tin là công cụ để viết thông điệp.","D":"Nhận thức được các hạn chế của nó và ngăn ngừa hiểu lầm bằng những tin nhắn ngắn gọn.","E":"Tất cả đều đúng."}},"132":{"q":"Điều nào mô tả đúng nhất về E-mail?","o":{"A":"Thư điện tử, thường gọi là Email, có thể dùng như tin nhắn và được chuyển đến điện thoại di động.","B":"Nó là một thông điệp viết để xác nhận việc đã liên lạc.","C":"Duy trì giao tiếp hiệu quả.","D":"Truyền đạt giao tiếp phi ngôn ngữ.","E":"Tất cả đều đúng."}},"133":{"q":"Làm thế nào để viết một email kinh doanh hiệu quả?","o":{"A":"Lời chào và dòng tiêu đề phù hợp cần rõ ràng để tránh nhầm lẫn trong trường hợp thư vô tình gửi nhầm người nhận.","B":"Tránh dùng toàn chữ in hoa và chữ viết tắt.","C":"Dùng định dạng tốt.","D":"Đọc lại, chỉnh sửa và rà soát.","E":"Tất cả đều đúng."}},"134":{"q":"Mục đích của bản ghi nhớ (memo) là gì?","o":{"A":"Mục đích của memo thường là thông báo, nhưng đôi khi có yếu tố thuyết phục hoặc kêu gọi hành động.","B":"Chia sẻ thông tin với nhân viên.","C":"Thường được dùng để truyền đạt chính sách và quy trình.","D":"Để cập nhật thông tin mới trong nhóm.","E":"Tất cả đều đúng."}},"135":{"q":"Điều nào sau đây mô tả đúng nhất về một thư kinh doanh (business letter)?","o":{"A":"Thư là những thông điệp ngắn gửi đến người nhận thường nằm ngoài tổ chức.","B":"Kỹ năng viết để thực hiện các nhiệm vụ cụ thể trong giao tiếp.","C":"Tạo ra một ý tưởng mới trong giao tiếp.","D":"Nó có thể dùng để giới thiệu bạn với một nhà tuyển dụng tiềm năng.","E":"Tất cả các đáp án trên."}},"136":{"q":"Điều nào sau đây là nguyên tắc chính khi viết một thư kinh doanh?","o":{"A":"Lời chào, phần giới thiệu, phần thân và phần kết.","B":"Ngày tháng nên đặt ở đầu thư","C":"Chủ đề hoặc mục đích của văn bản.","D":"Địa chỉ của bạn để người khác có thể gửi thư hồi âm.","E":"Tất cả đều đúng."}},"137":{"q":"Điều nào sau đây thuộc các yếu tố chung của một đề xuất kinh doanh (business proposal)?","o":{"A":"Các đề xuất kinh doanh hiệu quả được xây dựng quanh những ý tưởng hoặc giải pháp tuyệt vời.","B":"Các hạng mục truyền thống.","C":"Ethos, pathos và logos.","D":"Viết một cách chuyên nghiệp.","E":"Tất cả đều đúng."}},"138":{"q":"Điều nào sau đây KHÔNG được khuyến nghị khi viết thư kinh doanh?","o":{"A":"Ngắn gọn và cụ thể.","B":"Chủ đề hoặc mục đích của văn bản.","C":"Duy trì thông tin về chứng chỉ/năng lực.","D":"Dùng toàn chữ in hoa.","E":"Ngày tháng nên đặt ở đầu thư."}},"139":{"q":"Mục đích của dòng tiêu đề (subject line) trong email là gì?","o":{"A":"Dùng càng nhiều từ càng tốt.","B":"Thể hiện thông tin chuyên môn của bạn bằng văn bản.","C":"Giúp người nhận hiểu được cốt lõi của thông điệp.","D":"Nhấn mạnh chủ đề chính.","E":"Tất cả đều đúng."}},"140":{"q":"Điều lệ nhóm (Team charter) bao gồm những gì?","o":{"A":"Mục tiêu của nhóm","B":"Bảo đảm ý tưởng của từng thành viên đều được xem xét","C":"Thời gian và tần suất các cuộc họp trong nhóm làm việc","D":"Đặt một số quy tắc chung trong nhóm","E":"Tất cả các đáp án trên"}},"141":{"q":"Hành động nào sau đây có thể giúp cải thiện lòng tin trong nhóm của bạn tốt nhất?","o":{"A":"Tránh đổ lỗi, làm gương, ghi nhận đóng góp và thảo luận trước về lòng tin","B":"Chia sẻ thông tin","C":"Giữ liên lạc","D":"Có khả năng ra quyết định","E":"Tất cả đều đúng."}},"142":{"q":"Những kỹ năng và hành vi lãnh đạo nào có thể ảnh hưởng hiệu quả đến các thành viên trong nhóm?","o":{"A":"Trung thực trong giao tiếp và giữ lời hứa","B":"Tích cực trong giải quyết vấn đề","C":"Duy trì giao tiếp hiệu quả","D":"Theo dõi và hỗ trợ các thành viên trong nhóm","E":"Tất cả các đáp án trên"}},"143":{"q":"Các nhà lãnh đạo ảnh hưởng và xây dựng lòng tin nơi các thành viên trong nhóm bằng cách nào?","o":{"A":"Có khả năng quản lý trong công việc nhóm","B":"Có uy tín, thể hiện rằng bạn chắc chắn về điều mình muốn","C":"Tạo năng lượng tích cực","D":"Quản lý sự đồng thuận và bất đồng","E":"Tất cả các đáp án trên"}},"144":{"q":"Đặc điểm then chốt của các nhóm làm việc hiệu quả là gì?","o":{"A":"Cùng chịu trách nhiệm để đạt được các mục tiêu chung cụ thể","B":"Vận hành phụ thuộc lẫn nhau","C":"Đòi hỏi sự ổn định","D":"Nắm quyền hạn và quyền ra quyết định","E":"Tất cả các đáp án trên"}},"145":{"q":"Một số cách giúp tạo ra môi trường an toàn về tâm lý là gì?","o":{"A":"Tham gia tích cực","B":"Tránh đổ lỗi","C":"Đưa tất cả thành viên vào quá trình ra quyết định","D":"Luôn cởi mở với phản hồi","E":"Tất cả các đáp án trên"}},"146":{"q":"3 thành phần nào tạo nên tử số của phương trình lòng tin (trust equation)?","o":{"A":"Uy tín (credibility), sự thân tình (intimacy) và độ tin cậy (reliability)","B":"Năng lực, khả năng và chứng chỉ phù hợp","C":"Uy tín, sự thân tình và sự tôn trọng","D":"Lòng tốt, sự tôn trọng, trí thông minh","E":"Tất cả các đáp án trên"}},"147":{"q":"An toàn tâm lý (psychological safety) là gì?","o":{"A":"Các thành viên nhóm cảm thấy an toàn để là chính mình và được chấp nhận như chính con người họ","B":"Tăng sự sáng tạo và đổi mới","C":"Cải thiện năng suất","D":"Chìa khóa để cải thiện sự đa dạng và nâng cao làm việc nhóm","E":"Tất cả các đáp án trên"}},"148":{"q":"Khi các thành viên nhóm cảm thấy an toàn để tham gia vào quá trình học hỏi, họ đang trải nghiệm cấp độ An toàn tâm lý nào?","o":{"A":"An toàn hòa nhập (Inclusion safety)","B":"An toàn học hỏi (Learner safety)","C":"An toàn đóng góp (Contributor safety)","D":"An toàn thách thức (Challenger safety)","E":"Tất cả các đáp án trên"}},"149":{"q":"Điều gì tạo nên một nhóm tuyệt vời?","o":{"A":"An toàn tâm lý","B":"Sự đáng tin cậy","C":"Cấu trúc và sự rõ ràng","D":"Ý nghĩa và tác động","E":"Tất cả các đáp án trên"}},"150":{"q":"Định nghĩa của Nhóm (Team) là gì?","o":{"A":"Nhóm là tập hợp những người có kỹ năng bổ trợ cho nhau cùng làm việc để đạt một mục tiêu cụ thể.","B":"Nhóm là khả năng giao tiếp trong làm việc nhóm.","C":"Nhóm là cùng chia sẻ trách nhiệm trong làm việc nhóm.","D":"Làm việc nhóm có khả năng mang kỹ năng kỹ thuật vào nhóm.","E":"Tất cả các đáp án trên."}},"151":{"q":"Các đặc điểm then chốt của Nhóm là gì?","o":{"A":"Cùng chịu trách nhiệm để đạt một mục tiêu chung cụ thể.","B":"Chia sẻ thông tin trong làm việc nhóm.","C":"Đòi hỏi sự ổn định trong làm việc nhóm.","D":"Các thành viên có khả năng ra quyết định trong nhóm.","E":"Tất cả các đáp án trên."}},"152":{"q":"Vì sao các tổ chức lớn dựa nhiều vào các nhóm để cải thiện hoạt động?","o":{"A":"Các giám đốc điều hành cho biết hoạt động dựa trên nhóm có năng suất cao hơn và giảm lỗi dịch vụ.","B":"Nhóm có thể giải quyết nhiều thách thức trong thế giới hoạt động doanh nghiệp.","C":"Nhóm có khả năng giao tiếp hiệu quả.","D":"Nhóm ra quyết định và giải quyết vấn đề một cách đúng đắn.","E":"Tất cả các đáp án trên."}},"153":{"q":"Những yếu tố then chốt nào góp phần tạo nên làm việc nhóm hiệu quả?","o":{"A":"Các thành viên giao tiếp hiệu quả và dựa vào nhau để cùng nhau hoàn thành công việc tốt hơn so với làm riêng lẻ.","B":"Các thành viên có thể đóng góp các nguồn lực quý giá trong công việc nhóm.","C":"Các thành viên có khả năng chia sẻ thông tin trong nhóm.","D":"Các thành viên đảm nhận đúng vai trò nhiệm vụ trong dự án.","E":"Tất cả các đáp án trên."}},"154":{"q":"Những yếu tố then chốt nào góp phần tạo nên sự gắn kết của nhóm (Team Cohesiveness)?","o":{"A":"Quy mô nhóm, sự tương đồng, thành công, tính độc quyền và cạnh tranh.","B":"Thái độ tích cực trong giao tiếp nhóm.","C":"Kỹ năng kỹ thuật để thực hiện dự án.","D":"Phản hồi mang tính xây dựng và lắng nghe chủ động","E":"Tất cả các đáp án trên."}},"155":{"q":"Động lực nhóm (group motivation) nghĩa là gì?","o":{"A":"Cho người đó một nguyên nhân hay lý do để hành động.","B":"Động lực nhóm mang lại cảm hứng và sự khích lệ thúc đẩy các thành viên cùng làm việc để đạt mục tiêu chung.","C":"Cảm giác chung rằng nhóm có quyền lực và khả năng ra quyết định.","D":"Cảm giác chung rằng nhóm đang theo đuổi một mục tiêu có ý nghĩa.","E":"Tất cả các đáp án trên."}},"156":{"q":"Những trở ngại nào làm xói mòn hiệu suất?","o":{"A":"Không sẵn lòng hợp tác.","B":"Thiếu sự hỗ trợ của quản lý.","C":"Thiếu sự cam kết.","D":"Quản lý không ủy quyền.","E":"Tất cả các đáp án trên."}},"157":{"q":"Mục tiêu nhóm (Group Goals) có nghĩa là gì?","o":{"A":"Một nhóm hiệu quả vừa hiểu rõ mục tiêu của mình, vừa tin rằng mục tiêu đó có ý nghĩa và đáng làm.","B":"Các thành viên nhóm phải giao tiếp hiệu quả.","C":"Các thành viên nhóm có vai trò nhiệm vụ rõ ràng.","D":"Các thành viên nhóm có vai trò xây dựng quan hệ.","E":"Tất cả các đáp án trên."}},"158":{"q":"Nhóm cần những kỹ năng nào?","o":{"A":"Kỹ năng giao tiếp.","B":"Kỹ năng liên cá nhân.","C":"Kỹ năng kỹ thuật.","D":"Kỹ năng ra quyết định và giải quyết vấn đề.","E":"Tất cả các đáp án trên."}},"159":{"q":"Các thành viên nhóm có thể đối mặt với những thách thức nào?","o":{"A":"Hoàn thành nhiệm vụ được giao.","B":"Duy trì giao tiếp.","C":"Cải thiện sự gắn kết của nhóm.","D":"Ra quyết định trong nhóm.","E":"Tất cả các đáp án trên."}},"160":{"q":"1. Giai đoạn cuối trong mô hình Quá trình xung đột","o":{"A":"Thất vọng (Frustration)","B":"Nhận thức hóa (Conceptualization)","C":"Hành vi (Behavior)","D":"Kết quả (Outcome)"}},"161":{"q":"2. Giai đoạn đầu tiên trong mô hình Quá trình xung đột là gì?","o":{"A":"Thất vọng (Frustration)","B":"Nhận thức hóa (Conceptualization)","C":"Hành vi (Behavior)","D":"Kết quả (Outcome)"}},"162":{"q":"3. Chế độ xử lý xung đột nào có thể dùng khi các vấn đề quan trọng với người khác hơn là với bạn — để làm hài lòng người khác và duy trì sự hợp tác","o":{"A":"Né tránh (Avoiding)","B":"Cạnh tranh (Competing)","C":"Thỏa hiệp (Compromising)","D":"Nhượng bộ (Accommodating)"}},"163":{"q":"4. Chế độ xử lý xung đột nào có thể dùng khi vấn đề là tầm thường, hoặc khi có những vấn đề quan trọng hơn","o":{"A":"Né tránh (Avoiding)","B":"Cạnh tranh (Competing)","C":"Thỏa hiệp (Compromising)","D":"Nhượng bộ (Accommodating)"}},"164":{"q":"5. Chế độ xử lý xung đột nào có thể dùng khi các đối thủ có quyền lực ngang nhau cùng theo đuổi những mục tiêu loại trừ lẫn nhau","o":{"A":"Né tránh (Avoiding)","B":"Cạnh tranh (Competing)","C":"Thỏa hiệp (Compromising)","D":"Nhượng bộ (Accommodating)"}},"165":{"q":"Kỹ thuật can thiệp nào sau đây nên được dùng một cách tiết chế?","o":{"A":"Thích nghi (Adaptation)","B":"Cấu trúc (Structural)","C":"Quản lý (Managerial)","D":"Loại bỏ tự nguyện hoặc không tự nguyện"}},"166":{"q":"Khi xung đột nảy sinh, kỹ thuật can thiệp nào nên được dùng như biện pháp cuối cùng?","o":{"A":"Thích nghi (Adaptation)","B":"Cấu trúc (Structural)","C":"Quản lý (Managerial)","D":"Loại bỏ tự nguyện hoặc không tự nguyện"}},"167":{"q":"Cách giải quyết xung đột nào nên được cân nhắc khi mức gây rối tiềm tàng lớn hơn lợi ích của việc giải quyết?","o":{"A":"Hợp tác (Collaborating)","B":"Thỏa hiệp (Compromising)","C":"Né tránh (Avoiding)","D":"Nhượng bộ (Accommodating)"}},"168":{"q":"Việc rút lui hoặc đè nén xung đột được gọi là ....","o":{"A":"Hợp tác (Collaborating)","B":"Cưỡng ép (Forcing)","C":"Nhượng bộ (Accommodating)","D":"Né tránh (Avoiding)"}},"169":{"q":"Giai đoạn nào phù hợp với phát biểu sau: “Các thành viên thực hiện kế hoạch và đạt được mục tiêu”?","o":{"A":"Thực thi (Performing)","B":"Xung đột (Storming)","C":"Giải tán (Adjourning)","D":"Chuẩn hóa (Norming)","E":"Hình thành (Forming)"}},"170":{"q":"Đâu là giai đoạn cao nhất trong các Giai đoạn phát triển nhóm của Tuckman?","o":{"A":"Hình thành (Forming)","B":"Xung đột (Storming)","C":"Giải tán (Adjourning)","D":"Chuẩn hóa (Norming)","E":"Thực thi (Performing)"}},"171":{"q":"Điều nào KHÔNG ĐÚNG về power-with (quyền lực cùng nhau)?","o":{"A":"Đó là quyền lực để đề xuất và được lắng nghe.","B":"Nó nảy sinh từ cảm giác kết nối của chúng ta.","C":"Người lãnh đạo không được lạm dụng quyền lực của mình.","D":"Sự tôn trọng và bình đẳng được thể hiện trong nhóm."}},"172":{"q":"Điều gì bạn KHÔNG nên làm trong buổi phỏng vấn đầu tiên?","o":{"A":"Hỏi về mức lương","B":"Kết nối với người phỏng vấn","C":"Truyền đạt lý do bạn phù hợp","D":"Kết thúc bằng việc sắp xếp buổi phỏng vấn tiếp theo"}},"173":{"q":"Điều nào KHÔNG ĐÚNG về tác động của so sánh hướng lên (upward comparison)?","o":{"A":"Bất mãn","B":"Cảm hứng","C":"Biết ơn","D":"Ghen tị"}},"174":{"q":"Điều nào KHÔNG ĐÚNG về so sánh xã hội (social comparison)?","o":{"A":"So sánh xã hội là một xu hướng tâm lý tự nhiên và có thể tác động mạnh đến cách chúng ta cảm nhận và hành xử.","B":"So sánh xã hội không phải là một hiện tượng xấu xí cần tránh.","C":"Động cơ của so sánh xã hội có thể mang lại sức đẩy bạn cần để vươn lên trước thử thách, một động lực, và do đó tiến bộ hơn về mục tiêu của mình.","D":"So sánh xã hội và tác động của nó lên sự tự đánh giá sẽ không phụ thuộc vào tính cách và những khác biệt."}},"175":{"q":"Phát biểu nào KHÔNG đúng về sự sáng tạo?","o":{"A":"Mọi con người đều sáng tạo bẩm sinh, nhất là khi sáng tạo được hiểu là một kỹ năng giải quyết vấn đề.","B":"Là người tư duy sáng tạo, bạn tò mò, lạc quan và giàu trí tưởng tượng.","C":"Sáng tạo được khơi dậy khi có một vấn đề cần giải quyết.","D":"Con người không sáng tạo bẩm sinh."}},"176":{"q":"Phát biểu nào sau đây KHÔNG đúng về một người tư duy sáng tạo?","o":{"A":"Tò mò, lạc quan","B":"Xem vấn đề là giới hạn của sự phát triển","C":"Luôn thách thức các giả định và tạm hoãn phán xét","D":"Giàu trí tưởng tượng"}},"177":{"q":"Điều nào KHÔNG ĐÚNG về giai đoạn Nhận thức hóa (Conceptualization) trong mô hình quá trình xung đột?","o":{"A":"Đó là điều các bên nghĩ đối thủ muốn như một giải pháp","B":"Đó là giai đoạn giải quyết vấn đề và vạch chiến lược.","C":"Các bên cố gắng áp dụng các chế độ giải quyết xung đột.","D":"Các bên cố gắng hiểu bản chất của vấn đề."}},"178":{"q":"Điều nào sau đây KHÔNG phải là chiến lược để tránh xảy ra Groupthink (tư duy tập thể)?","o":{"A":"Chỉ định người phản biện (devil’s advocate) trong các cuộc thảo luận","B":"Sử dụng chuyên gia bên ngoài","C":"Có một nhà lãnh đạo nhóm đầy sức hút","D":"Phân các nhóm khác nhau cho các nhiệm vụ khác nhau"}},"179":{"q":"Nhãn nào sau đây KHÔNG thể hiện cách hành vi của thành viên có thể gây rối một cuộc họp?","o":{"A":"Người nói to, át tiếng","B":"Người thì thầm","C":"Người đến muộn","D":"Người tổng kết"}},"180":{"q":"Chiến lược nào sau đây KHÔNG thể hỗ trợ sinh viên đại học nâng cao trí tuệ văn hóa (cultural intelligence)?","o":{"A":"Đọc sách của các tác giả có nền tảng văn hóa đa dạng.","B":"Tham gia các workshop, hội thảo, lễ hội và sự kiện liên văn hóa.","C":"Tham gia vừa học vừa làm ở nước ngoài hoặc chương trình trao đổi học tập.","D":"Làm việc trong một nhóm với cùng những đồng đội của các học kỳ trước."}},"181":{"q":"Điều nào KHÔNG phải là chiến lược để phát triển bản thân thành người tư duy phản biện?","o":{"A":"Lên lịch vận động thể chất trong ngày.","B":"Thử thách bản thân nhìn những điều quen thuộc theo cách mới.","C":"Thể hiện bản thân.","D":"Không suy nghĩ gì trong thời gian rảnh."}},"182":{"q":"Điều nào KHÔNG phải là đặc điểm của giai đoạn Sáng tạo (Creating) trong Thang phân loại của Bloom?","o":{"A":"Bạn có thể ghép các phần lại thành một chỉnh thể mới mạch lạc hoặc độc đáo.","B":"Bạn áp dụng tài liệu vào những tình huống mới và cụ thể.","C":"Bạn có thể sắp xếp lại các yếu tố thành một mô hình hoặc cấu trúc mới.","D":"Bạn dùng các phương pháp tạo ra, lập kế hoạch hoặc sản xuất."}},"183":{"q":"Điều nào KHÔNG đúng về lý thuyết trao đổi lãnh đạo – thành viên (leader-member exchange)?","o":{"A":"Nó tập trung vào các hệ quả gắn với quá trình lãnh đạo.","B":"Nó xem lãnh đạo gồm một số mối quan hệ song phương (dyadic) liên kết nhau.","C":"Các mối quan hệ trao đổi chất lượng thấp có xu hướng gắn với mức hiệu suất, cam kết và hài lòng thấp hơn.","D":"Chất lượng mối quan hệ được phản ánh bởi mức độ thành công trong nhiệm vụ."}},"184":{"q":"Yếu tố nào KHÔNG thuộc một báo cáo?","o":{"A":"Kết luận","B":"Phần thân","C":"Biên bản họp","D":"Bìa"}},"185":{"q":"Cái nào KHÔNG phải một phần của email?","o":{"A":"Dòng tiêu đề","B":"Lời chào kết","C":"Chữ ký","D":"Chủ đề"}},"186":{"q":"Cái nào sau đây KHÔNG phải một cấp độ kỹ năng nhận thức?","o":{"A":"Đánh giá","B":"Hướng dẫn","C":"Ghi nhớ","D":"Áp dụng"}},"187":{"q":"Cái nào sau đây KHÔNG phải một thành phần của đề xuất kinh doanh?","o":{"A":"Giới thiệu công ty","B":"Bối cảnh","C":"Phân tích thị trường","D":"Lịch trình"}},"188":{"q":"Lời khuyên nào sau đây KHÔNG phù hợp cho buổi phỏng vấn xin việc?","o":{"A":"Xem lại mô tả công việc","B":"Tự tin","C":"Đến với sự chuẩn bị","D":"Ăn mặc xuề xòa"}},"189":{"q":"Đâu KHÔNG phải là đặc điểm của tư duy phản biện?","o":{"A":"Hoài nghi (có tinh thần nghi vấn)","B":"Tư duy theo nhóm","C":"Xem xét các giả định","D":"Phát hiện thiên kiến"}},"190":{"q":"Lựa chọn nào dưới đây KHÔNG phải là lý do để tham gia giao tiếp?","o":{"A":"Hiểu bản sắc của chúng ta","B":"Đáp ứng nhu cầu của chúng ta","C":"Hiểu các bối cảnh giao tiếp","D":"Thu thập thông tin","E":"Thao túng người khác"}},"191":{"q":"Điều nào sau đây KHÔNG phải là hệ quả tiêu cực khi xảy ra Groupthink (tư duy tập thể)?","o":{"A":"Không xem xét các phương án thay thế","B":"Không có kế hoạch dự phòng","C":"Không tìm kiếm ý kiến chuyên gia","D":"Cần tìm kiếm chuyên môn từ bên ngoài"}},"192":{"q":"Điều nào sau đây KHÔNG phải là cách chống lại căng thẳng?","o":{"A":"Chăm sóc thể chất đúng cách cho bản thân","B":"Ưu tiên thời gian của bạn","C":"Tránh ma túy và rượu","D":"Bỏ các câu lạc bộ hoặc hoạt động ngoại khóa"}},"193":{"q":"Lời khuyên nào sau đây KHÔNG phù hợp cho buổi phỏng vấn xin việc?","o":{"A":"Tìm hiểu về công ty","B":"Tìm hiểu các công ty khác trong cùng ngành","C":"Luyện trả lời các câu hỏi về công việc","D":"Luyện trả lời các câu hỏi về đời sống cá nhân"}},"194":{"q":"Phát biểu nào sau đây KHÔNG phải là mục tiêu của việc dùng công cụ trực quan?","o":{"A":"Cho khán giả thấy bạn có thể diễn tả ý tưởng theo nhiều cách","B":"Làm bài nói thú vị hơn","C":"Nâng cao uy tín của bạn với tư cách người nói","D":"Truyền đạt thông tin phức tạp hoặc hấp dẫn trong thời gian ngắn"}},"195":{"q":"Điều nào sau đây KHÔNG phải là đặc điểm của lãnh đạo?","o":{"A":"Tự tin và ý thức về bản sắc cá nhân","B":"Sẵn sàng chịu đựng căng thẳng trong quan hệ giữa người với người","C":"Sự trưởng thành để không chịu đựng thất vọng và chậm trễ","D":"Khả năng ảnh hưởng đến hành vi của người khác"}},"196":{"q":"Phát biểu nào sau đây KHÔNG đúng?","o":{"A":"Từ “Logic” bắt nguồn từ tiếng Hy Lạp cổ logike","B":"“Logic” chỉ khoa học hoặc nghệ thuật của lập luận","C":"“Logic” cho phép một người đánh giá các lập luận và suy luận","D":"“Logic” không thể giúp phân biệt suy luận tốt và xấu"}},"197":{"q":"Phát biểu nào KHÔNG đúng về sự sáng tạo?","o":{"A":"Mọi con người đều sáng tạo bẩm sinh, nhất là khi sáng tạo được hiểu là một kỹ năng giải quyết vấn đề","B":"Là người tư duy sáng tạo, bạn tò mò, lạc quan và giàu trí tưởng tượng","C":"Sáng tạo được khơi dậy khi có một vấn đề cần giải quyết","D":"Con người không sáng tạo bẩm sinh"}},"198":{"q":"Phát biểu nào KHÔNG đúng về địa vị (status)?","o":{"A":"Địa vị có thể được định nghĩa là mức độ quan trọng hay ý nghĩa mà một người được nhận thức trong một bối cảnh nhất định.","B":"Trong một nhóm, các thành viên có địa vị cao hơn có xu hướng được tôn trọng hơn, có uy tín và quyền lực hơn những người có địa vị thấp hơn.","C":"Các nhóm có thể trao địa vị cho thành viên dựa trên tuổi, sự giàu có, giới tính, chủng tộc hoặc sắc tộc, năng lực, vóc dáng, trí thông minh được nhận thức và/hoặc các thuộc tính khác.","D":"Thường thì khi nhóm đã hình thành và bắt đầu xác lập các chuẩn mực, việc phân bổ địa vị khác nhau giữa các thành viên đã được quyết định chỉ dựa trên địa vị ban đầu mà mọi người mang vào nhóm."}},"199":{"q":"Điều nào KHÔNG phải là một ngộ nhận (fiction) về Tư duy sáng tạo?","o":{"A":"Mỗi vấn đề chỉ có một giải pháp hoặc một đáp án đúng","B":"Câu trả lời, giải pháp hay phương pháp tốt nhất đã được khám phá rồi","C":"Các câu trả lời sáng tạo thì phức tạp về công nghệ","D":"Giải pháp sáng tạo nên là đáp án cho mọi vấn đề"}},"200":{"q":"Điều nào sau đây KHÔNG phải là đặc điểm của một thư xin việc (cover letter):","o":{"A":"Nó xác định vị trí bạn quan tâm.","B":"Nó cho thấy bạn biết đến vị trí hoặc công ty bằng cách nào.","C":"Nó giúp bạn nổi bật so với mọi đối thủ có thể có.","D":"Nó giải thích vì sao bạn không hài lòng với hiệu suất của mình."}},"201":{"q":"Ai KHÔNG nên được mời tham dự cuộc họp?","o":{"A":"Những người sẽ bị ảnh hưởng trực tiếp bởi kết quả","B":"Những người bất đồng hoặc đại diện cho quan điểm thiểu số","C":"Những người có quyền thực thi các quyết định","D":"Những người không liên quan đến các vấn đề được thảo luận"}},"202":{"q":"Điều nào sau đây không phải là đặc điểm của người tư duy phản biện?","o":{"A":"Phát hiện thiên kiến","B":"Xem xét các giả định","C":"Mù quáng chấp nhận quyền uy","D":"Hoài nghi"}},"203":{"q":"Hưng nhận được email từ khách hàng về một dự án nhóm anh đang làm, nhưng anh không biết câu trả lời. Anh nên","o":{"A":"Trả lời ngay bằng bất kỳ thông tin nào anh nghĩ mình biết về câu hỏi","B":"Tự tìm câu trả lời và chỉ trả lời khi tìm ra thông tin","C":"Không trả lời vì anh không biết câu trả lời và đó không phải việc của anh","D":"Trả lời trong vòng 24 giờ rằng anh đang tìm câu trả lời cho câu hỏi của họ và sẽ sớm liên hệ lại"}},"204":{"q":"Hành vi nào mọi người thường KHÔNG biểu hiện khi họ đang lừa dối?","o":{"A":"Giảm giao tiếp bằng mắt khi trò chuyện","B":"Những quãng ngừng gượng gạo trong hội thoại","C":"Giảm tốc độ nói","D":"Tăng việc mỉm cười"}},"205":{"q":"Theo Barge, Lumsden, Parker và Hoffman, tất cả các hành động và thái độ được khuyến nghị sau đây có thể giúp bạn điều phối cuộc họp tốt, NGOẠI TRỪ:","o":{"A":"Bắt đầu bằng điều gì đó tích cực","B":"Bảo đảm mọi người hiểu vai trò của mình","C":"Bám sát chương trình nghị sự","D":"Chỉ bắt đầu cuộc họp sau khi tất cả các thành viên nhóm liên quan đã đến."}},"206":{"q":"Điều nào ĐÚNG về phản hồi trực tiếp (direct feedback)?","o":{"A":"Nó chỉ xảy ra khi tất cả các bên liên quan có mặt cùng lúc.","B":"Nó là phản hồi không đến trực tiếp từ nguồn.","C":"Một thông điệp khởi đầu bằng email gửi cho một người cụ thể là một loại phản hồi trực tiếp.","D":"Nó là phản hồi đến từ người nhận."}},"207":{"q":"Điều nào ĐÚNG về đề xuất theo yêu cầu (solicited proposal)?","o":{"A":"Chúng là những “cuộc gọi chào hàng” của văn bản kinh doanh.","B":"Chúng thường mang tính chung chung hơn là dành riêng cho khách hàng.","C":"Chúng chỉ ở dạng lời nói trực tiếp.","D":"Chúng thường mang tính gián tiếp, đấu thầu mở cho công chúng và được công bố chính thức để mọi người cùng xem."}},"208":{"q":"Điều nào ĐÚNG về văn hóa định hướng dài hạn (long-term orientation)","o":{"A":"Hoa Kỳ có cách tiếp cận dài hạn hơn đối với cuộc sống và kết quả","B":"Nếu bạn làm việc trong nền văn hóa định hướng dài hạn, bạn có thể cần chú trọng hơn việc đáp lễ lời chào, quà tặng và phần thưởng.","C":"Định hướng dài hạn thường được đánh dấu bởi sự kiên trì, tiết kiệm và thanh đạm","D":"Tất cả những điều trên"}},"209":{"q":"Điều nào ĐÚNG về biên bản họp (minutes)?","o":{"A":"Biên bản là văn bản ghi lại sự tương tác và tóm tắt các điểm chính được nêu, các quyết định được đưa ra và các hành động được giao.","B":"Mục đích chính của biên bản là nhận được sự đồng thuận của những người ra quyết định","C":"Biên bản thường được dùng để truyền đạt chính sách, quy trình hoặc công việc chính thức liên quan trong một tổ chức.","D":"Biên bản là những thông điệp ngắn gửi cho người nhận thường nằm ngoài tổ chức."}},"210":{"q":"Điều nào đúng về căng thẳng mạn tính?","o":{"A":"Căng thẳng mạn tính có thể làm suy yếu hệ miễn dịch và gây rối loạn hầu hết các quá trình trong cơ thể, dẫn đến tăng nguy cơ nhiều vấn đề sức khỏe.","B":"Căng thẳng mạn tính có thể giúp bạn phát triển những kỹ năng cần thiết để xử lý các tình huống có khả năng thử thách hoặc đe dọa trong đời.","C":"Chuẩn bị cho một chuyến đi nghỉ hoặc một kỳ thi cuối kỳ có thể gây căng thẳng mạn tính.","D":"Căng thẳng mạn tính không gây ra những vấn đề nghiêm trọng như bệnh tim và suy giảm trí nhớ, sự tập trung."}},"211":{"q":"Khi chuẩn bị nội dung báo cáo, bạn nên đặt tất cả các câu hỏi dưới đây NGOẠI TRỪ.","o":{"A":"Báo cáo nói về ai và/hoặc được chuẩn bị cho ai?","B":"Đã làm gì, đã giải quyết những vấn đề nào và kết quả ra sao, bao gồm kết luận và/hoặc khuyến nghị?","C":"Đối tượng được nghiên cứu xảy ra ở đâu?","D":"Quản lý trả bạn bao nhiêu tiền để viết báo cáo?"}},"212":{"q":"Tất cả những điều sau đây là cách dùng tư duy phản biện để đánh giá thông tin, NGOẠI TRỪ","o":{"A":"Sẵn sàng thay đổi quan điểm của mình","B":"Có đầu óc tìm tòi","C":"Chấp nhận điều gì đó mà không hỏi bằng chứng","D":"Đặt câu hỏi cho chính kết luận của mình"}},"213":{"q":"Tất cả các tiêu chí sau đây nên được cân nhắc khi xác định ai nên được mời họp NGOẠI TRỪ:","o":{"A":"Những người sẽ bị ảnh hưởng trực tiếp bởi kết quả","B":"Những người có chuyên môn đặc biệt","C":"Những người bất đồng hoặc đại diện cho quan điểm thiểu số","D":"Những người có quyền thực thi các quyết định","E":"Những người không liên quan đến các vấn đề được lên lịch thảo luận"}},"214":{"q":"Dưới đây là các hướng dẫn để Điều phối một cuộc họp, NGOẠI TRỪ:","o":{"A":"Bắt đầu bằng điều gì đó tích cực","B":"Chú ý các chi tiết hậu cần","C":"Dùng mỉa mai và hoài nghi để làm mọi thứ vui vẻ và lành mạnh","D":"Chuẩn bị cho điều bất ngờ"}},"215":{"q":"Dưới đây là những câu hỏi mà ứng viên nên chuẩn bị để hỏi trong buổi phỏng vấn NGOẠI TRỪ","o":{"A":"Những trách nhiệm chính của công việc là gì?","B":"Xin mô tả thói quen làm việc thường ngày của vị trí này?","C":"Hiệu suất công việc được đánh giá thế nào và bao lâu một lần?","D":"Công ty có thể trả cho tôi bao nhiêu?"}},"216":{"q":"Tất cả các chiến lược sau đây dùng để giữ cuộc họp diễn ra với nhịp độ thoải mái NGOẠI TRỪ","o":{"A":"Chỉ bắt đầu cuộc họp khi tất cả các thành viên quan trọng đã có mặt","B":"Đặt giới hạn thời gian cho từng mục trong chương trình","C":"Giữ tập trung vào mục tiêu của cuộc họp","D":"Lên lịch một cuộc họp khác để bàn công việc còn dang dở"}},"217":{"q":"Đại học là nơi tuyệt vời để nâng cao kỹ năng tư duy sáng tạo như trong các ví dụ dưới đây, NGOẠI TRỪ","o":{"A":"Thiết kế câu hỏi thi mẫu để kiểm tra kiến thức khi học cho kỳ thi cuối kỳ","B":"Nghĩ ra chiến lược mạng xã hội cho một câu lạc bộ trong trường","C":"Lập kế hoạch để giao tiếp tốt hơn với các bạn đồng môn","D":"Đề xuất một kế hoạch học tập cho chuyên ngành bạn đang tự thiết kế cho mình"}},"218":{"q":"Các mẹo dưới đây là hướng dẫn viết email hiệu quả, NGOẠI TRỪ:","o":{"A":"Nếu bạn chèn đường dẫn, hãy thử để chắc chắn nó đầy đủ.","B":"Đọc lại, chỉnh sửa và rà soát","C":"Dùng “Reply All” (Trả lời tất cả) thường xuyên để chắc chắn mọi người nhận email ban đầu đều theo dõi được cuộc trao đổi đang diễn ra.","D":"Dòng tiêu đề nên rõ ràng, ngắn gọn và cụ thể.","E":"Lời chào phù hợp nên thể hiện sự tôn trọng và tránh nhầm lẫn trong trường hợp thư vô tình gửi nhầm người nhận."}},"219":{"q":"Các lý do để chúng ta tham gia giao tiếp là tất cả những điều dưới đây, NGOẠI TRỪ","o":{"A":"Thống trị người khác vì lợi ích cá nhân","B":"Hiểu bối cảnh giao tiếp","C":"Hiểu bản sắc của chúng ta","D":"Đáp ứng nhu cầu của chúng ta"}},"220":{"q":"Theo Đại học DePaul, tất cả các mục sau được nêu trong lộ trình nghề nghiệp, NGOẠI TRỪ","o":{"A":"Hiểu chính mình","B":"Khám phá và lựa chọn các phương án","C":"Tích lũy kiến thức và kinh nghiệm","D":"Sách về phát triển nghề nghiệp"}},"221":{"q":"Khi kinh doanh trong môi trường toàn cầu đa dạng, bạn sẽ muốn có thái độ cởi mở, tôn trọng đối với sự khác biệt văn hóa của người khác bằng cách làm tất cả những điều sau, ngoại trừ","o":{"A":"chấp nhận nhu cầu giao tiếp gián tiếp của người khác như ở châu Á.","B":"cởi mở để hiểu và tôn trọng những cách nghĩ và cảm nhận khác nhau của người thuộc các nền văn hóa khác.","C":"nhận ra rằng nền văn hóa của bạn chỉ là một cách — chứ không phải cách duy nhất — để tin tưởng và làm mọi việc.","D":"vội vàng phán xét sớm về diễn biến của một thương vụ."}},"222":{"q":"Hệ quả của quyền lực cưỡng chế (Coercive power) là gì? (chọn 2 đáp án)","o":{"A":"Khó kiểm soát.","B":"Áp lực của nó dẫn đến hiệu suất công việc tăng.","C":"Cấp dưới thường thấy ít lý do để hợp tác.","D":"Nó phụ thuộc vào vị trí chính thức mà một người nắm giữ."}},"223":{"q":"Đặc điểm của một nhà lãnh đạo không chính thức (informal leader) là gì? (chọn 2 đáp án)","o":{"A":"Vai trò do nhóm giao","B":"Nhóm thừa nhận người đó là lãnh đạo của mình","C":"Một năng lực chính thức được công nhận bởi cả người trong và ngoài nhóm","D":"Được khuyến khích thực hiện đầy đủ các vai trò quản lý bởi các tổ chức có mức độ tham gia cao"}},"224":{"q":"Yêu cầu của tư duy ở cấp độ đại học là gì? (chọn 2 đáp án)","o":{"A":"Bạn cần áp dụng đúng những hiểu biết học được trong bài giảng để giải quyết các vấn đề được giao","B":"Điều quan trọng là nhận ra hoặc nhớ lại kiến thức bạn đã có.","C":"Bạn cần liên hệ các ý tưởng trừu tượng với các tình huống thực tế.","D":"Bạn cần khả năng phân tách hoặc phân biệt các phần của tài liệu thành các thành phần để hiểu rõ hơn cấu trúc tổ chức."}},"225":{"q":"Chúng ta làm gì khi sử dụng logic? (chọn 2 đáp án)","o":{"A":"Chúng ta đánh giá sức mạnh của các lập luận.","B":"Chúng ta phân biệt thông tin đúng và sai.","C":"Chúng ta thu thập càng nhiều dữ liệu càng tốt.","D":"Chúng ta xem xét các lý do nền tảng."}},"226":{"q":"Những phát biểu nào dưới đây KHÔNG đúng về giao tiếp phi ngôn ngữ? (chọn 2 đáp án)","o":{"A":"Giao tiếp phi ngôn ngữ là không thể đảo ngược.","B":"Giao tiếp phi ngôn ngữ là quá trình truyền đạt thông điệp mà không dùng lời.","C":"Có thể tách một hành động phi ngôn ngữ ra khỏi bối cảnh của mọi hành vi giao tiếp bằng lời và phi ngôn ngữ khác.","D":"Hầu hết mọi người có xu hướng tin thông điệp phi ngôn ngữ hơn thông điệp bằng lời, vì chúng ta thường phản ứng nhanh hơn khi nghĩ, do đó phản ứng phi ngôn ngữ truyền đạt phản ứng ban đầu của ta trước khi xử lý qua ngôn ngữ hay hình thành một phản hồi phù hợp.","E":"Các tín hiệu phi ngôn ngữ luôn rõ ràng, nên chúng ta không cần manh mối ngữ cảnh để hiểu chúng."}},"227":{"q":"Những công nghệ nào có khả năng giúp người dùng tăng kỹ năng tư duy phản biện và sáng tạo trong giai đoạn Hiểu (Understanding) của Thang phân loại Bloom? (chọn 2 đáp án)","o":{"A":"Lectora","B":"Email","C":"Youtube","D":"Flickr"}},"228":{"q":"Khi nào chúng ta xây dựng một nhóm? (Chọn 2 đáp án)","o":{"A":"Với các nhiệm vụ hoặc vấn đề đơn giản","B":"Khi cần nhiều năng lực và kỹ năng khác nhau","C":"Khi cần mức cam kết cao","D":"Khi lợi ích của các thành viên khác nhau hoặc xung đột"}},"229":{"q":"Vì sao kỹ năng tư duy sáng tạo là một dạng giải quyết vấn đề? (chọn 2 đáp án)","o":{"A":"Cần tạo ra các ý tưởng thay thế.","B":"Các giả định khác nhau được xem xét kỹ.","C":"Người ta cần dùng lập luận vững chắc để giải quyết vấn đề.","D":"Nó liên quan đến việc dùng các chiến lược làm thông tâm trí để suy nghĩ và ý tưởng của chúng ta vượt qua những giới hạn hiện tại của vấn đề."}},"230":{"q":"Vì sao các nhiệm vụ và mục tiêu do nhóm đặt ra không thể được hoàn thành bởi từng cá nhân? (Chọn 2 đáp án)","o":{"A":"Hạn chế về thời gian và nguồn lực","B":"Ít cá nhân sở hữu tất cả các năng lực và chuyên môn liên quan","C":"Mọi thành viên đều có năng lực và kỹ năng","D":"Nguồn nhân lực sẵn có"}},"231":{"q":"Vì sao con người tham gia các nhóm khác nhau? (Chọn 2 đáp án)","o":{"A":"Nhóm đáp ứng các nhu cầu tâm lý của họ","B":"Nhóm đáp ứng các nhu cầu xã hội của họ","C":"Con người có thể giảm cảm giác bất an khi “đứng một mình”","D":"Con người cảm thấy mạnh mẽ hơn"}},"232":{"q":"Chúng ta thường hỏi những câu hỏi nào trong quá trình tư duy sáng tạo? (chọn 3 đáp án)","o":{"A":"Mình có thể kết hợp các góc nhìn/giải pháp không?","B":"Còn gì khác ngoài kia không?","C":"Sao lại không?","D":"Điều gì tốt ở...?"}},"233":{"q":"Danh mục kiểm tra để bảo đảm báo cáo đạt được mục tiêu gồm: (Chọn 3 đáp án)","o":{"A":"Thông tin chính xác, đầy đủ và có tư liệu chứng minh","B":"Hình, bảng và minh họa rõ ràng và được ghi nhãn đúng","C":"Báo cáo trình bày càng nhiều tiến độ càng tốt, ngay cả khi không đạt hết mục tiêu.","D":"Báo cáo thể hiện nỗ lực tốt nhất của bạn"}},"234":{"q":"Thuật ngữ nào chỉ những người được đặt vào vị trí lãnh đạo bởi các lực lượng bên ngoài nhóm? Chọn hai đáp án.","o":{"A":"Lãnh đạo nổi lên (Emergent leader)","B":"Lãnh đạo chính thức (Formal leader)","C":"Lãnh đạo không chính thức (Informal leader)","D":"Lãnh đạo được chỉ định (Designated leader)"}},"235":{"q":"(Các) yếu tố quan trọng quyết định liệu mọi người có tham gia so sánh xã hội hay không là:","o":{"A":"Tính liên quan (Relevance)","B":"Sự tương đồng (Similarity)","C":"Sự quan tâm","D":"Cảm xúc","E":"Lĩnh vực nhận thức","F":"Tất cả các đáp án đều đúng"}},"236":{"q":"Phần tóm tắt (abstract) của báo cáo bao gồm những gì?","o":{"A":"Nêu bật chủ đề, phương pháp, dữ liệu và kết quả","B":"Danh sách các phần chính của báo cáo","C":"Nhãn, báo cáo, tiêu đề đặc điểm, tác giả","D":"Phương pháp luận"}},"237":{"q":"Theo Edward Hall, bốn nhóm khoảng cách chính dùng trong giao tiếp là:","o":{"A":"Thân mật, Chạm, Cử chỉ và Không gian công cộng","B":"Thân mật, Cá nhân, Xã hội và Không gian công cộng","C":"Cá nhân, Vật dụng, Ngôn ngữ phụ trợ và Không gian công cộng","D":"Cá nhân, Biểu cảm khuôn mặt, Đặc điểm thể chất và Không gian công cộng"}},"238":{"q":"PDCA là viết tắt của:","o":{"A":"Plan — demonstrate — check — articulate (Lập kế hoạch — trình diễn — kiểm tra — diễn đạt)","B":"Prepare — demonstrate — calibrate — act (Chuẩn bị — trình diễn — hiệu chỉnh — hành động)","C":"Plan — do — check — act (Lập kế hoạch — thực hiện — kiểm tra — hành động)","D":"Prepare — do — check — act (Chuẩn bị — thực hiện — kiểm tra — hành động)"}},"239":{"q":"“Tầm kiểm soát” (span of control) trung bình có bao nhiêu người trong nhóm?","o":{"A":"3","B":"5","C":"7","D":"10"}},"240":{"q":"Nhóm tuổi nào được xem là có những lựa chọn mang tính tạm thời và thể hiện mong muốn tự chủ?","o":{"A":"12–17","B":"18 – 26","C":"27 – 31","D":"32 – 42"}},"241":{"q":"Định dạng ngày tháng nào tốt nhất cho một thư xin việc?","o":{"A":"October 9, 2023","B":"9/10/23","C":"9/10/2023","D":"9th October, 23"}},"242":{"q":"Độ dài điển hình của một thư xin việc là bao nhiêu?","o":{"A":"1–2 đoạn","B":"2–3 đoạn","C":"3–4 đoạn","D":"Hơn 4 đoạn"}},"243":{"q":"_____ là “khả năng phán đoán, kiểm tra và thậm chí phê bình giá trị của tài liệu cho một mục đích nhất định”.","o":{"A":"Áp dụng (Applying)","B":"Đánh giá (Evaluating)","C":"Phân tích (Analyzing)","D":"Sáng tạo (Creating)"}},"244":{"q":"_____ là “khả năng nắm bắt hoặc xây dựng ý nghĩa từ các thông điệp bằng lời, văn bản và đồ họa”.","o":{"A":"Ghi nhớ (Remembering)","B":"Hiểu (Understanding)","C":"Phân tích (Analyzing)","D":"Áp dụng (Applying)"}},"245":{"q":"“_____ cho phép một cá nhân hoặc nhóm đưa ra các quyết định ảnh hưởng đến người khác và thực thi sự kiểm soát”.","o":{"A":"Power-from-within (Quyền lực từ bên trong)","B":"Power-with (Quyền lực cùng nhau)","C":"Power-over (Quyền lực lên người khác)","D":"Power-from-outside (Quyền lực từ bên ngoài)"}},"246":{"q":"Các nền văn hóa _____ tập trung vào nhu cầu của quốc gia, cộng đồng, gia đình hoặc nhóm người lao động","o":{"A":"Tập thể (Collectivist)","B":"Cá nhân (Individualistic)","C":"Khoảng cách quyền lực thấp","D":"Khoảng cách quyền lực cao"}},"247":{"q":"... là quá trình liên tục xây dựng các kỹ năng, kiến thức và kinh nghiệm liên quan đến đời sống nghề nghiệp của bạn","o":{"A":"Việc làm (Employment)","B":"Một nghề (An occupation)","C":"Sự nghiệp (A career)","D":"Không đáp án nào đúng"}},"248":{"q":"Phản ứng khả dĩ trước hệ quả của quyền lực hợp pháp (legitimate power) là gì?","o":{"A":"Kháng cự","B":"Tuân thủ","C":"Cam kết","D":"Né tránh"}},"249":{"q":"Lời khuyên tốt để giao tiếp hiệu quả trong buổi phỏng vấn xin việc là gì?","o":{"A":"Dùng biệt ngữ","B":"Nói lan man","C":"Giữ giao tiếp bằng mắt","D":"Quá thân thiện"}},"250":{"q":"Ưu điểm chính của hiệu ứng hỗ trợ xã hội (social facilitation) là gì?","o":{"A":"Cảm thấy tốt hơn","B":"Thực hiện nhiệm vụ tốt hơn","C":"Làm việc độc lập hơn","D":"Có cơ hội thăng tiến cao"}},"251":{"q":"Một nhược điểm của nhóm lớn là gì?","o":{"A":"Đánh giá quá cao khả năng của mình","B":"Xếp mình trên mức trung bình","C":"Tham gia nhiều hơn","D":"Giảm giao tiếp"}},"252":{"q":"Giải pháp nhanh nhất và dễ nhất để giảm xung đột là gì?","o":{"A":"Tách biệt về mặt vật lý","B":"Dùng các quy tắc và quy định","C":"Tham vấn bên thứ ba","D":"Đối đầu và đàm phán"}},"253":{"q":"Tác động tiêu cực của so sánh hướng xuống (downward comparison) là gì?","o":{"A":"Ghen tị","B":"Bất mãn","C":"Khinh miệt","D":"Bi quan"}},"254":{"q":"Việc đầu tiên cần làm trước khi đi phỏng vấn xin việc là gì?","o":{"A":"Ăn mặc phù hợp","B":"Việc sử dụng ngôn ngữ cơ thể","C":"Đọc kỹ mô tả công việc","D":"Theo dõi kết quả phỏng vấn"}},"255":{"q":"Thực hành tốt nhất cuối cùng để thúc đẩy kỹ năng đa văn hóa là gì?","o":{"A":"Phát triển trí tuệ văn hóa (cultural intelligence)","B":"Phát triển sự phức tạp về nhận thức","C":"Phát triển năng lực văn hóa (cultural competence)","D":"Phát triển kỹ năng liên văn hóa"}},"256":{"q":"Cách ăn mặc tốt nhất để gây ấn tượng với nhà tuyển dụng trong buổi phỏng vấn là gì?","o":{"A":"Mặc gì cũng được","B":"Theo xu hướng (áo crop top, giày Jordan, v.v.)","C":"Mặc vest trang trọng","D":"Mặc bộ đồ thể thao Nike"}},"257":{"q":"Ethos chỉ điều gì?","o":{"A":"Uy tín và đạo đức","B":"Đam mê và nhiệt huyết","C":"Logic hoặc lý lẽ","D":"Cảm xúc và sự hào phóng"}},"258":{"q":"Đặc điểm của tư duy phản biện là gì?","o":{"A":"Xem xét các giả định","B":"Thách thức lập luận","C":"Phát hiện thiên kiến","D":"Tất cả các đáp án trên đều đúng"}},"259":{"q":"Các phản ứng hành vi khả dĩ trước hệ quả của quyền lực là gì?","o":{"A":"Đáng tin cậy và phản bội","B":"Phàn nàn và tuân thủ","C":"Cam kết và tuân thủ","D":"Đáng tin cậy và kháng cự"}},"260":{"q":"Hai yếu tố chính trong so sánh xã hội là gì?","o":{"A":"Sự tương đồng và sự thân thiện","B":"Sự cởi mở và sự độc lập","C":"Tính liên quan và sự tương đồng","D":"Lòng tự trọng và sự đáng tin"}},"261":{"q":"Những điều cơ bản khi thực hiện so sánh xã hội là gì?","o":{"A":"Sự tương đồng và sự tuân thủ","B":"Sự cởi mở và sự thân thiện","C":"Tính liên quan và sự tương đồng","D":"Lòng tự trọng và sự độc lập"}},"262":{"q":"Từ “Team” (Nhóm) là viết tắt của gì?","o":{"A":"Together Everything Access More","B":"Together Everyone Accept More","C":"Together Everyone Assist Members","D":"Together Everyone Achieves More (Cùng nhau mọi người đạt được nhiều hơn)"}},"263":{"q":"Loại giao tiếp phi ngôn ngữ nào liên quan đến các khía cạnh lời nói và phi lời nói của bài phát biểu?","o":{"A":"Chạm","B":"Không gian","C":"Vật dụng (Artifacts)","D":"Ngôn ngữ phụ trợ (Paralanguage)"}},"264":{"q":"Loại báo cáo nào được dùng để cập nhật tình trạng dự án cho ban quản lý?","o":{"A":"Báo cáo tiến độ (Progress Report)","B":"Báo cáo khuyến nghị","C":"Báo cáo tóm tắt","D":"Báo cáo tài chính"}},"265":{"q":"Những chủ đề thông tin nào bạn không nên đưa vào résumé?","o":{"A":"Kỹ năng","B":"Đời sống tình cảm","C":"Học vấn","D":"Kinh nghiệm làm việc"}},"266":{"q":"Loại thông tin nào bạn nên đưa vào résumé?","o":{"A":"Số an sinh xã hội của bạn","B":"Thông tin gia đình bạn","C":"Các kỹ năng nghề nghiệp và lịch sử làm việc của bạn","D":"Gia phả của bạn"}},"267":{"q":"Cần chuẩn bị gì trước cuộc họp?","o":{"A":"Lập lịch họp","B":"Quyết định cách thức họp","C":"Mời người tham dự","D":"Tất cả các điều trên"}},"268":{"q":"Bạn luôn nên làm gì sau buổi phỏng vấn?","o":{"A":"Bỏ chạy","B":"Hỏi về mức lương","C":"Cảm ơn người phỏng vấn","D":"Gọi cho họ nhiều lần"}},"269":{"q":"Sinh viên có thể đưa gì vào thư xin việc của mình?","o":{"A":"Điểm trung bình (GPA)","B":"Kỹ năng mềm","C":"Hoạt động tình nguyện","D":"Tất cả đều đúng"}},"270":{"q":"Cấp độ kỹ năng học tập thấp nhất trong Thang phân loại Bloom là gì?","o":{"A":"Ghi nhớ","B":"Hiểu","C":"Phân tích","D":"Áp dụng"}},"271":{"q":"Cấp độ kỹ năng học tập cao nhất trong Thang phân loại Bloom là gì?","o":{"A":"Phân tích","B":"Áp dụng","C":"Đánh giá","D":"Sáng tạo"}},"272":{"q":"Phản ứng hành vi nào sau đây có khả năng được sử dụng?","o":{"A":"Khoan dung","B":"Nhiệt huyết","C":"Chấp nhận","D":"Kháng cự"}},"273":{"q":"Đâu là thành phần then chốt trong hợp tác?","o":{"A":"Sự trung thực","B":"Sự chăm chỉ","C":"Sự hào phóng","D":"Sự tin tưởng"}},"274":{"q":"Loại phản hồi nào truyền đạt sự cảm thông và đồng cảm với nguồn phát thông điệp?","o":{"A":"Đánh giá (Evaluative)","B":"Diễn giải (Interpretive)","C":"Hỗ trợ (Supportive)","D":"Thấu hiểu (Understanding)"}},"275":{"q":"Từ nào mô tả đúng nhất phát biểu sau: “Các thành viên cần sự giúp đỡ của nhau để hoàn thành mục đích mà họ tham gia nhóm”?","o":{"A":"Tính bền vững","B":"Sự phụ thuộc lẫn nhau (Interdependence)","C":"Sự tương tác","D":"Bản sắc"}},"276":{"q":"Thành phần nào được đề cập trong ảnh hưởng của tình huống đối với hợp tác?","o":{"A":"Sự chăm chỉ","B":"Sự đồng nhất với nhóm","C":"Đầu óc cởi mở","D":"Sự hào phóng"}},"277":{"q":"Bạn cho rằng hoạt động nào đòi hỏi mức hợp tác lớn nhất?","o":{"A":"Săn thú hoang","B":"Đi câu cá","C":"Chèo thuyền kayak","D":"Trượt tuyết"}},"278":{"q":"Điều nào sau đây có thể được xem là mặt tích cực của xung đột?","o":{"A":"Giúp các cá nhân và thành viên nhóm trưởng thành và phát triển bản sắc cá nhân","B":"Ảnh hưởng đến bầu không khí xã hội của nhóm và kìm hãm sự gắn kết nhóm","C":"Khiến mọi người chuyển năng lượng khỏi việc thực hiện công việc","D":"Ảnh hưởng đến căng thẳng và các hệ quả tâm sinh lý của căng thẳng"}},"279":{"q":"Lĩnh vực kỹ năng học tập nào sau đây có nghĩa là “Điều bạn nên quan tâm”?","o":{"A":"Lĩnh vực nhận thức (Cognitive)","B":"Lĩnh vực cảm xúc – thái độ (Affective)","C":"Lĩnh vực tâm vận động (Psychomotor)","D":"Lĩnh vực phản tư (Reflective)"}},"280":{"q":"Mục nào sau đây là không bắt buộc trong một résumé?","o":{"A":"Kinh nghiệm làm việc","B":"Nền tảng học vấn","C":"Kỹ năng liên quan đến công việc","D":"Sở thích"}},"281":{"q":"Điều nào sau đây mang lại lợi thế lớn cho người lãnh đạo trong quan hệ với đồng đội?","o":{"A":"Quyền kiểm soát đồng đội","B":"Địa vị vượt trội","C":"Trí tuệ văn hóa (Cultural intelligence)","D":"Giao tiếp rõ ràng, tường minh"}},"282":{"q":"Thành ngữ nào sau đây có thể dùng để mô tả mối quan hệ giữa quyền lực và áp bức?","o":{"A":"A blessing in disguise (Trong cái rủi có cái may)","B":"The best of both worlds (Cả hai đều tốt)","C":"Get out of hand (Vượt khỏi tầm kiểm soát)","D":"Two sides of the same coin (Hai mặt của một đồng xu)"}},"283":{"q":"Trong bốn khác biệt văn hóa then chốt, điều nào có thể bị một số người coi là xúc phạm?","o":{"A":"Giao tiếp trực tiếp so với gián tiếp","B":"Giọng nói và độ trôi chảy","C":"Thái độ khác nhau đối với thứ bậc","D":"Các chuẩn mực ra quyết định xung đột"}},"284":{"q":"Điều nào sau đây nên diễn ra trước khi bạn phỏng vấn xin việc?","o":{"A":"Luyện trả lời các câu hỏi thường gặp","B":"Tìm hiểu về công ty hoặc tổ chức","C":"Xem lại bản mô tả công việc","D":"Tất cả các đáp án đều đúng"}},"285":{"q":"Nhu cầu nào trong Tháp nhu cầu Maslow chủ yếu được đáp ứng khi một nhóm tuần tra khu phố được lập ra để ngăn chặn tội phạm trong cộng đồng?","o":{"A":"Sinh lý","B":"Được tôn trọng","C":"Yêu thương và thuộc về","D":"An toàn"}},"286":{"q":"Cách giải quyết xung đột nào nên được cân nhắc khi mức gây rối tiềm tàng lớn hơn lợi ích của việc giải quyết?","o":{"A":"Hợp tác (Collaborating)","B":"Thỏa hiệp (Compromising)","C":"Né tránh (Avoiding)","D":"Nhượng bộ (Accommodating)"}},"287":{"q":"Công nghệ nào có thể giúp sinh viên tạo cảm giác cộng đồng với lớp và tham gia các cuộc trò chuyện theo chuỗi liên tục về các bài đọc và chủ đề được giao, làm nổi bật các quan điểm đa dạng?","o":{"A":"Bảng trắng tương tác","B":"Diễn đàn thảo luận (Discussion boards)","C":"Hệ thống phản hồi của học viên","D":"Máy quay phim kỹ thuật số"}},"288":{"q":"Hiệu ứng nào mô tả đúng nhất phát biểu: “Nhìn chung, con người có tự khái niệm học thuật tốt hơn nếu họ là chú ếch to trong cái ao nhỏ thay vì chú ếch nhỏ trong cái ao lớn”?","o":{"A":"Hiệu ứng tâm lý đám đông","B":"Hiệu ứng Ao ếch (Frog Pond Effect)","C":"Hiệu ứng Dunning-Kruger","D":"Hiệu ứng nhà kính"}},"289":{"q":"Hình thức phỏng vấn nào đặc biệt dùng để sàng lọc loại bớt ứng viên?","o":{"A":"Phỏng vấn qua hội nghị web","B":"Phỏng vấn sàng lọc (Screening interview)","C":"Phỏng vấn nhóm","D":"Phỏng vấn một–một"}},"290":{"q":"Hình thức phỏng vấn nào đặc biệt dùng để sàng lọc loại bớt ứng viên?","o":{"A":"Phỏng vấn hội đồng (Panel)","B":"Phỏng vấn nhóm","C":"Phỏng vấn qua hội nghị web","D":"Phỏng vấn sàng lọc (Screening interview)"}},"291":{"q":"Hành động nào thuộc chiến lược “Xác định các giải pháp sẵn có”?","o":{"A":"Xác định vấn đề","B":"Sắp xếp thông tin một cách logic","C":"So sánh và đối chiếu các giải pháp khả dĩ","D":"Bảo vệ giải pháp của bạn"}},"292":{"q":"Những từ nào dưới đây thể hiện sự nhấn mạnh?","o":{"A":"Significantly, primarily, especially (Đáng kể, chủ yếu, đặc biệt)","B":"But, however, by contrast (Nhưng, tuy nhiên, ngược lại)","C":"For example, to illustrate, like (Ví dụ, để minh họa, như)","D":"First, second, last (Thứ nhất, thứ hai, cuối cùng)"}},"293":{"q":"Bạn nên dùng những từ nào khi muốn đưa ra các ý tưởng đối lập?","o":{"A":"Significantly, primarily, especially (Đáng kể, chủ yếu, đặc biệt)","B":"Nevertheless, however, by contrast (Tuy nhiên, song, ngược lại)","C":"For example, to illustrate, like (Ví dụ, để minh họa, như)","D":"First, second, last (Thứ nhất, thứ hai, cuối cùng)"}},"294":{"q":"Loại quyền lực nào có thể được tạo ra bằng cách kiểm soát các nguồn lực như tiền bạc, tình yêu và thông tin?","o":{"A":"Power-over (Quyền lực lên người khác)","B":"Power-with (Quyền lực cùng nhau)","C":"Power-from-within (Quyền lực từ bên trong)","D":"Quyền lực hợp pháp (Legitimate power)"}},"295":{"q":"Khi mọi người có thể nâng cao sự tự đánh giá của mình bằng cách so sánh bản thân với những người xếp thấp hơn trong công ty, họ đang trải qua","o":{"A":"tác dụng phụ của cuộc sống","B":"hành vi xấu","C":"hiệu ứng tự nâng cao (self-enhanced effect)","D":"duy trì sự tự đánh giá (self-evaluation maintenance)"}},"296":{"q":"Khi số lượng đối tượng so sánh tăng lên, so sánh xã hội có xu hướng","o":{"A":"Tăng","B":"Giữ nguyên","C":"Bị bóp méo","D":"Giảm"}},"297":{"q":"Khi bạn giải quyết một vấn đề bằng tư duy phản biện, bước chính đầu tiên bạn nên thực hiện là gì?","o":{"A":"Kêu gọi giúp đỡ","B":"Xác định vấn đề","C":"Đi kiếm gì đó ăn","D":"Xác định các giải pháp khả dĩ"}},"298":{"q":"Khi một ngôn ngữ chiếm ưu thế trong nhóm, điều gì có thể xảy ra với người không nói được ngôn ngữ đó?","o":{"A":"Bị coi là kém năng lực trong nhóm","B":"Cảm thấy bị bỏ rơi","C":"Bị xem là đóng góp ít hơn","D":"Tất cả đều đúng"}},"299":{"q":"Ai là người đóng góp trong cuộc họp (meeting contributor)?","o":{"A":"Người ngủ gật (Sleeper)","B":"Người thì thầm (Whisperer)","C":"Người đến muộn (Latecomer)","D":"Người báo cáo (Reporter)"}},"300":{"q":"Nhân viên báo cáo cho ai trong một nhóm ma trận (matrix team)?","o":{"A":"Một quản lý duy nhất","B":"Các quản lý khác nhau","C":"Tổng giám đốc","D":"CEO của tổ chức"}},"301":{"q":"Các nhà tuyển dụng tiềm năng coi người giới thiệu từ ai là loại người giới thiệu tốt nhất?","o":{"A":"Bạn bè của bạn","B":"Giảng viên hoặc quản lý trước đây của bạn","C":"Gia đình bạn","D":"Bạn thân nhất của bạn"}},"302":{"q":"Thư xin việc (cover letter) còn có thể được gọi là","o":{"A":"Résumé hoặc CV","B":"Thư ứng tuyển (A letter of application)","C":"Đơn ứng tuyển","D":"Thư bán hàng CV"}},"303":{"q":"“Nảy sinh từ cảm giác kết nối của chúng ta, hay sự gắn bó của chúng ta với những con người khác và với môi trường” có thể dùng để mô tả loại quyền lực nào?","o":{"A":"Power-from-within (Quyền lực từ bên trong)","B":"Power-with (Quyền lực cùng nhau)","C":"Power-over (Quyền lực lên người khác)","D":"Không đáp án nào trong số này"}},"304":{"q":"Quyền hành (Authority) là tên gọi khác của:","o":{"A":"Quyền lực chuyên gia (Expert Power)","B":"Quyền lực hợp pháp (Legitimate Power)","C":"Quyền lực khen thưởng (Reward Power)","D":"Quyền lực cưỡng chế (Coercive Power)"}},"305":{"q":"Văn bản tóm tắt những điều đã được thảo luận hoặc quyết định, và các hành động mà thành viên nhóm phải thực hiện sau cuộc họp được gọi là:","o":{"A":"Bản tóm tắt","B":"Biên bản họp (Minutes)","C":"Chương trình nghị sự","D":"Hồ sơ lưu"}},"306":{"q":"Bảng kê về học vấn, kinh nghiệm làm việc, kỹ năng liên quan đến công việc, thành tích, lịch sử tình nguyện, thực tập, nội trú và/hoặc nhiều thứ khác. Định nghĩa nào sau đây khớp với mô tả trên? B. Proposal C. Résumé D. Outline","o":{"A":"Thư xin việc (Cover letter)","B":"Đề xuất (Proposal)","C":"Résumé","D":"Dàn ý (Outline)"}},"307":{"q":"“Một cuộc đấu tranh được bày tỏ giữa các bên phụ thuộc lẫn nhau về những mục tiêu mà họ cho là không tương thích hoặc những nguồn lực mà họ cho là không đủ” là định nghĩa của?","o":{"A":"Đàm phán","B":"Xung đột (Conflict)","C":"Thất vọng","D":"Cạnh tranh"}},"308":{"q":"Là sinh viên Kỹ thuật phần mềm, bạn sẽ có thể giải thích ở mức cơ bản các khái niệm liên quan đến kiến trúc máy tính, hệ điều hành, mạng máy tính, cơ sở dữ liệu... Chúng thuộc giai đoạn kỹ năng học tập nào của Thang phân loại Bloom?","o":{"A":"Áp dụng","B":"Hiểu","C":"Phân tích","D":"Đánh giá"}},"309":{"q":"“A và B là bạn học. A có thể đưa B tiền xăng cho xe máy của B vì B chở A đi học mỗi ngày, dù điều đó nghĩa là A sẽ có ít tiền tiêu hơn cho cuối tuần.” Theo Định hướng giá trị xã hội (Social Value Orientation – SVO), trong tình huống này A đang thể hiện:","o":{"A":"Định hướng cá nhân chủ nghĩa","B":"Định hướng hợp tác","C":"Định hướng cạnh tranh","D":"Định hướng nhượng bộ"}},"310":{"q":"Quyền lực cưỡng chế (Coercive power) còn được gọi là:","o":{"A":"Quyền lực dựa trên sự kính trọng","B":"Quyền lực nhóm","C":"Quyền lực kỷ luật","D":"Quyền lực trừng phạt"}},"311":{"q":"Các nhóm chính thức (formal groups) được dùng để","o":{"A":"Tổ chức và phân phối công việc","B":"Làm việc độc lập","C":"Làm mọi thứ rõ ràng hơn","D":"Cảm thấy như gia đình"}},"312":{"q":"Điền vào chỗ trống bằng cụm từ phù hợp: Con người ... bởi so sánh xã hội khi sự so sánh ...","o":{"A":"Bị ảnh hưởng nhiều hơn – mang tính cục bộ hơn","B":"Bị ảnh hưởng nhiều hơn – ít cục bộ hơn","C":"Bị ảnh hưởng nhiều hơn – rộng và chung chung","D":"Bị ảnh hưởng ít hơn – mang tính cục bộ hơn"}},"313":{"q":"Đối với sinh viên mới tốt nghiệp ít kinh nghiệm, số trang résumé được ưu tiên là:","o":{"A":"một.","B":"hai.","C":"ba.","D":"bốn."}},"314":{"q":"Nhóm không chỉ đáp ứng nhu cầu thuộc về, mà còn cung cấp thông tin, sự trợ giúp và","o":{"A":"Kỹ năng được phát triển","B":"Giao tiếp tốt hơn","C":"Hỗ trợ xã hội","D":"Động lực"}},"315":{"q":"Giai đoạn cuối cùng trong mô hình Quá trình xung đột?","o":{"A":"Thất vọng (Frustration)","B":"Nhận thức hóa (Conceptualization)","C":"Hành vi (Behavior)","D":"Kết quả (Outcome)"}},"316":{"q":"Mục tiêu học tập (Learning objectives) là những điều chỉ rõ ai đó sẽ biết, quan tâm đến, hoặc có thể làm được gì sau một trải nghiệm học tập.","o":{"A":"Goals (Mục tiêu)","B":"Purposes (Mục đích)","C":"Targets (Chỉ tiêu)","D":"Plans (Kế hoạch)"}},"317":{"q":"Trong quá trình ra quyết định nhóm, nếu có nhiều người đồng ý với một quan điểm nhất định, chúng ta có thể cho rằng nhóm có _____.","o":{"A":"sự đồng thuận hoàn toàn","B":"sự phân cực nhóm (group polarization)","C":"chia sẻ kiến thức của nhóm","D":"Mọi nguồn lực đều được huy động"}},"318":{"q":"Trong nhóm của bạn, bạn có thể tự do bày tỏ suy nghĩ và nhu cầu, và được giao các nhiệm vụ phù hợp với năng lực cá nhân. Bạn dường như đang trải nghiệm loại quyền lực nào?","o":{"A":"Power-from-within (Quyền lực từ bên trong)","B":"Quyền lực độc lập","C":"Power-with (Quyền lực cùng nhau)","D":"Quyền lực chuyên gia"}},"319":{"q":"Ở giai đoạn phát triển nhóm nào, các thành viên bộc lộ thông tin về bản thân trong những tương tác lịch sự nhưng dè dặt, khám phá mục đích của nhóm và thu thập thông tin về sở thích, kỹ năng và khuynh hướng cá nhân của nhau?","o":{"A":"Hình thành (Forming)","B":"Xung đột (Storming)","C":"Chuẩn hóa (Norming)","D":"Thực thi (Performing)","E":"Giải tán (Adjourning)"}},"320":{"q":"Để tạo ấn tượng tốt, những từ tích cực thể hiện sự lạc quan và tự tin là","o":{"A":"Regret, sorry, terror (Hối tiếc, xin lỗi, kinh hoàng)","B":"Trouble, unable, happy (Rắc rối, không thể, vui)","C":"Wrong, obnoxious, yes (Sai, khó chịu, vâng)","D":"Willing, thank, appreciate (Sẵn lòng, cảm ơn, trân trọng)"}},"321":{"q":"Để tạo ấn tượng tốt nhằm đạt mục tiêu của thông điệp, những từ tích cực thể hiện sự lạc quan và tự tin là","o":{"A":"Disapprove, impossible, obnoxious (Không tán thành, bất khả thi, khó chịu)","B":"Deny, hateful, not (Từ chối, đáng ghét, không)","C":"Contradict, fault, unable (Mâu thuẫn, lỗi, không thể)","D":"Favorable, compliment, answerable (Thuận lợi, khen ngợi, có thể giải đáp)"}},"322":{"q":"Trong Nghiên cứu Đặc điểm Lãnh đạo, đặc điểm nào bao gồm khả năng phân tích mạnh?","o":{"A":"Tự tin","B":"Động lực lãnh đạo","C":"Nghị lực (Drive)","D":"Năng lực nhận thức"}},"323":{"q":"Ở cấp độ kỹ năng nào sau đây bạn sẽ phán đoán, kiểm tra và phê bình giá trị của tài liệu?","o":{"A":"Áp dụng","B":"Phân tích","C":"Đánh giá","D":"Sáng tạo"}},"324":{"q":"Ở giai đoạn phát triển nghề nghiệp nào, các cá nhân thường trải qua một thời kỳ ổn định và có thể bắt đầu đánh giá lại mục tiêu nghề nghiệp dài hạn?","o":{"A":"Tăng trưởng (Growth)","B":"Khám phá (Exploration)","C":"Thiết lập (Establishment)","D":"Duy trì (Maintenance)"}},"325":{"q":"Trong quá trình viết một bài luận để thể hiện lập trường của bạn về việc ủng hộ hay phản đối vắc-xin Covid-19, bạn so sánh và đối chiếu các lập luận khác nhau của cả hai phía. Bạn đang dùng chiến lược giải quyết vấn đề nào?","o":{"A":"Xác định vấn đề","B":"Xác định các giải pháp sẵn có","C":"Chọn giải pháp của bạn","D":"Xem xét các giải pháp thay thế"}},"326":{"q":"Trong phát triển nghề nghiệp, ai có vai trò đưa ra việc làm và thảo luận các lộ trình nghề nghiệp đa dạng?","o":{"A":"Vai trò của cá nhân","B":"Vai trò của quản lý","C":"Quản lý trực tiếp","D":"Vai trò của nhà tuyển dụng"}},"327":{"q":"“Kinesics” là thuật ngữ chỉ ngành nghiên cứu về","o":{"A":"Ngôn ngữ phụ trợ (Paralanguage)","B":"Chuyển động cơ thể","C":"Đặc điểm thể chất","D":"Vật dụng (Artifacts)"}},"328":{"q":"Trong tất cả các cơ sở quyền lực mà con người có, quyền lực nào được dùng nhiều nhất, bị lên án nhiều nhất và khó kiểm soát nhất?","o":{"A":"Quyền lực khen thưởng","B":"Quyền lực cưỡng chế","C":"Quyền lực tham chiếu (Referent power)","D":"Quyền lực hợp pháp"}},"329":{"q":"Một trong những phát hiện then chốt trong các thí nghiệm về hiệu ứng Dunning-Kruger là những người kém kỹ năng thì","o":{"A":"Luôn hài lòng với kết quả","B":"Thường ghen tị với người khác","C":"Không được thưởng và thiên kiến","D":"Quá tự tin vào kết quả của mình"}},"330":{"q":"Một trong ba nhóm của định hướng giá trị xã hội (SVO) là?","o":{"A":"Kém năng lực","B":"Hợp tác","C":"Ám ảnh","D":"Hào phóng"}},"331":{"q":"Những người xem so sánh hướng lên là một mối đe dọa thì có","o":{"A":"Tư duy tiêu cực","B":"Tư duy phát triển (growth mindset)","C":"Tư duy cố định (fixed mindset)","D":"Cảm giác ghen tị"}},"332":{"q":"Con người thường so sánh mình với bạn bè hoặc đồng nghiệp hơn là với mức trung bình của ngành hay quốc gia. Sự so sánh này được gọi là gì trong các yếu tố tình huống?","o":{"A":"Số lượng","B":"Cục bộ (Local)","C":"Gần với một chuẩn mực (Proximity to a standard)","D":"Liên quan đến bản thân (Self-relevant)"}},"333":{"q":"Con người có thể tuyên bố rằng họ có thể sống độc lập và tách biệt, nhưng thực ra họ có","o":{"A":"Nhu cầu thuộc về","B":"Nhu cầu được bao gồm","C":"Nhu cầu trò chuyện với ai đó","D":"Không đáp án nào đúng"}},"334":{"q":"Tăng lương, thăng chức, những nhiệm vụ được giao hấp dẫn, thêm trách nhiệm, thiết bị mới là ví dụ của:","o":{"A":"Quyền lực khen thưởng","B":"Quyền lực hợp pháp","C":"Quyền lực chuyên gia","D":"Quyền lực cưỡng chế"}},"335":{"q":"Xét về yếu tố chuyên nghiệp, định dạng tài liệu điện tử nào thường được đề xuất dùng nhất để giữ nguyên vị trí nội dung và tránh những thay đổi vô ý khi hiển thị?","o":{"A":"Excel","B":"Word","C":"Power Point","D":"PDF"}},"336":{"q":"Các dấu hiệu của căng thẳng bao gồm ...","o":{"A":"Tim đập mạnh","B":"Khó thở","C":"Đau bụng","D":"Tất cả đều đúng"}},"337":{"q":"(Các) chiến lược để phát triển bản thân thành người tư duy phản biện","o":{"A":"Định nghĩa lại cách bạn nhìn mọi thứ","B":"Phản tư và luyện tập","C":"Thể hiện bản thân","D":"Tất cả đều đúng"}},"338":{"q":"Việc chỉnh sửa cụ thể đòi hỏi chú ý đến những điều sau: định dạng, dữ kiện, tên, chính tả, dấu câu, và","o":{"A":"Nội dung","B":"Ngữ pháp","C":"Tổ chức","D":"Văn phong"}},"339":{"q":"Susan là nhân viên mới của nhóm IT 3 tại công ty FPT Software. Cấp trên của cô bảo cô chuẩn bị báo cáo hướng dẫn khách hàng Nhật Bản cách ứng dụng mới hoạt động. Đó là loại báo cáo nào?","o":{"A":"Kỹ thuật","B":"Tài chính","C":"Khả thi","D":"Đánh giá nhu cầu"}},"340":{"q":"Một số người xem các chuẩn mực xã hội và ý kiến của người khác để biện minh cho vị trí của mình trong cuộc sống, một số khác thì xem ... để thực hiện tốt hơn.","o":{"A":"ý kiến và sự tương đồng","B":"hiệu suất và khả năng","C":"ý kiến và giá trị","D":"sự tương đồng và sự thân thiện"}},"341":{"q":"Để sử dụng loại quyền lực NÀY: trừng phạt riêng tư, thông báo cho cấp dưới về quy tắc và hình phạt, hoặc loại quyền lực NÀY có thể được dùng mà không làm tổn hại đến sự chính trực cá nhân.","o":{"A":"Quyền lực khen thưởng","B":"Quyền lực hợp pháp","C":"Tiêu chí đánh giá","D":"Quyền lực cưỡng chế"}},"342":{"q":"Để tạo phần mở đầu tốt cho một thông điệp thuyết phục, bạn nên giữ nó","o":{"A":"Trung lập","B":"Tiêu cực và khách quan, vô cảm","C":"Khách quan, vô cảm","D":"Tích cực và mang tính cá nhân"}},"343":{"q":"Suy nghĩ và tư duy có thể được hiểu là ___ trong tâm trí.","o":{"A":"Các khuôn mẫu – hệ thống và sơ đồ","B":"Trật tự và cấu trúc","C":"Hành động và kiểm soát","D":"Phân tích và đánh giá"}},"344":{"q":"Ngành nghiên cứu chuyển động cơ thể, then chốt để hiểu giao tiếp phi ngôn ngữ, được gọi là","o":{"A":"Kinesics (nghiên cứu chuyển động cơ thể)","B":"Chronemics (nghiên cứu về thời gian)","C":"Proxemics (nghiên cứu về khoảng cách)","D":"Haptics (nghiên cứu về xúc giác)"}},"345":{"q":"Người phụ trách điều hành một cuộc họp là","o":{"A":"Trưởng nhóm","B":"Người thống trị","C":"Chủ tọa (Chairperson)","D":"Người ghi biên bản"}},"346":{"q":"Phần quan trọng nhất của một đề xuất là","o":{"A":"Chi phí","B":"Giải pháp","C":"Tuyên bố mục đích","D":"Bối cảnh"}},"347":{"q":"Bản ghi chép bằng văn bản về thảo luận và hoạt động của một nhóm là","o":{"A":"biên bản họp","B":"một báo cáo","C":"một chương trình nghị sự","D":"một ghi chú"}},"348":{"q":"Mục đích của một đề xuất kinh doanh là ....","o":{"A":"nêu ra một vấn đề","B":"suy ngẫm về công việc","C":"kể lại những gì bạn đã làm","D":"đưa ra một lời kêu gọi thuyết phục"}},"349":{"q":"Đặc điểm của nhóm nên bao gồm một trong các yếu tố sau","o":{"A":"Sự tương tác","B":"Quan hệ ngắn hạn","C":"Hành động độc lập","D":"Các thành viên không phản ứng"}},"350":{"q":"Thí nghiệm về nhu cầu tự đánh giá đã cho thấy con người biết về bản thân bằng cách","o":{"A":"có thái độ tích cực trong cuộc sống","B":"so sánh với người khác","C":"tìm kiếm hạnh phúc","D":"cảm thấy trọn vẹn"}},"351":{"q":"Những xung đột này, liên quan đến câu hỏi nên đưa ra lựa chọn nào trong một tình huống nhất định, dựa trên những quan điểm khác nhau về dữ kiện","o":{"A":"Xung đột về nội dung (substance)","B":"Xung đột về quy trình","C":"Xung đột do nhận thức sai về sự khác biệt","D":"Không đáp án nào trong số này"}},"352":{"q":"“Quyền lực của một cá nhân mạnh trong một nhóm ngang hàng, quyền lực không phải để ra lệnh, mà để đề xuất và được lắng nghe, để bắt đầu một việc và thấy nó diễn ra” có thể dùng để mô tả loại quyền lực nào?","o":{"A":"Power-from-within (Quyền lực từ bên trong)","B":"Power-with (Quyền lực cùng nhau)","C":"Power-over (Quyền lực lên người khác)","D":"Không đáp án nào trong số này"}},"353":{"q":"Phần quan trọng nhất của một thư ứng tuyển là:","o":{"A":"phần kết thúc thúc đẩy hành động","B":"phần mở đầu thu hút sự chú ý","C":"phần giải thích logic","D":"phần tóm tắt trình độ"}},"354":{"q":"“Lĩnh vực tâm vận động” (Psychomotor Domain) của các kỹ năng học tập nghĩa là:","o":{"A":"Điều bạn nên biết","B":"Điều bạn nên quan tâm","C":"Điều bạn nên có thể làm","D":"Không đáp án nào đúng"}},"355":{"q":"Từ “power” (quyền lực) nghĩa đen là:","o":{"A":"“Có thể làm được”","B":"“Sự ảnh hưởng”","C":"“Sức mạnh”","D":"Không đáp án nào trong số này"}},"356":{"q":"Thư xin việc của bạn nên được gửi đến:","o":{"A":"Tên công ty","B":"Một người cụ thể","C":"Chủ tịch công ty","D":"Bất kỳ quản lý nào liên quan đến công ty"}},"357":{"q":"Quản lý của bạn thể hiện mức độ chính trực cao. Hai đặc điểm nào đại diện tốt nhất cho người quản lý này?","o":{"A":"Ăn nói lưu loát và tự tin","B":"Đáng tin cậy và cần mẫn","C":"Đáng tin và trung thực","D":"Tự tin và đồng cảm"}},"358":{"q":"Bạn bắt đầu lập kế hoạch cho một đề xuất bằng cách","o":{"A":"xác định các yếu tố.","B":"xác định các giải pháp.","C":"lên lịch nghiên cứu.","D":"nêu vấn đề."}},"359":{"q":"Bạn được giao thiết kế một áp phích cho sự kiện sắp tới ở trường đại học. Bạn quyết định đến vườn bách thảo để tìm cảm hứng. Mẹo tư duy sáng tạo nào bạn dường như đang dùng trong trường hợp này?","o":{"A":"Cảm nhận (Sensing)","B":"Tưởng tượng (Imagining)","C":"Vận động (Moving)","D":"Học hỏi (Learning)"}},"360":{"q":"(Chọn 1 đáp án) Cử chỉ này được coi là một sự xúc phạm ở:","o":{"A":"Nhật Bản","B":"Brazil","C":"Pháp","D":"Ấn Độ","E":"Nigeria","F":"Ý"}},"361":{"q":"Tư duy (thinking) là gì?","o":{"A":"Đó là quá trình tinh thần bạn dùng để hình thành các liên tưởng và mô hình về thế giới.","B":"Dấu hiệu của một trí óc có học là có thể tiếp nhận một ý nghĩ mà không chấp nhận nó.","C":"Đó là hành động suy nghĩ tạo ra các ý nghĩ, xuất hiện dưới dạng ý tưởng, hình ảnh, âm thanh hay thậm chí cảm xúc.","D":"Tất cả đều đúng."}},"362":{"q":"Sự khác biệt giữa cấu trúc Phân cấp (Hierarchical) và nhóm Ma trận (Matrix) là gì?","o":{"A":"Trong khi nhóm Ma trận tạo ra một xương sống ổn định cho tổ chức, cấu trúc Phân cấp thì không.","B":"Nhóm Ma trận phổ biến hơn ở các tổ chức vừa và nhỏ, còn cấu trúc Phân cấp điển hình cho các tổ chức lớn và đa quốc gia.","C":"Cấu trúc Phân cấp mang lại sự quản lý linh hoạt hơn cho tổ chức so với nhóm Ma trận.","D":"Trong cấu trúc Phân cấp, hướng báo cáo chủ yếu là một chiều (nhân viên báo cáo cho một người giám sát), còn trong nhóm Ma trận, hướng báo cáo đa dạng hơn (nhân viên báo cáo cho các quản lý khác nhau về các khía cạnh công việc khác nhau)."}},"363":{"q":"Phần tóm tắt (abstract) trong một báo cáo là gì?","o":{"A":"Trang tiêu đề phụ","B":"Các từ khóa để giới thiệu chủ đề nghiên cứu","C":"Phần giới thiệu","D":"Bao gồm mục tiêu và kết quả của nghiên cứu"}},"364":{"q":"Ý nghĩ (thought) là gì?","o":{"A":"Là quá trình tinh thần bạn dùng để hình thành các liên tưởng và mô hình về thế giới.","B":"Là dấu hiệu của một trí óc có học khi có thể tiếp nhận một ý nghĩ mà không chấp nhận nó.","C":"Là hành động suy nghĩ tạo ra các ý nghĩ, xuất hiện dưới dạng ý tưởng, hình ảnh, âm thanh hay thậm chí cảm xúc.","D":"Là việc xử lý thông tin để hình thành khái niệm, giải quyết vấn đề, suy luận và ra quyết định."}},"365":{"q":"Groupthink (tư duy tập thể) là gì?","o":{"A":"Các thành viên nhóm không có khả năng đưa ra quyết định hợp lý","B":"Các thành viên nhóm có cùng suy nghĩ về một chủ đề cụ thể","C":"Các thành viên nhóm muốn giống nhau trong mọi thứ","D":"Các thành viên nhóm quyết định hỗ trợ lẫn nhau"}},"366":{"q":"Tư duy phản biện (Critical thinking) là gì?","o":{"A":"Là tư duy rõ ràng, hợp lý, có phản tư, tập trung vào việc quyết định nên tin hay làm gì","B":"Là cách suy nghĩ để chỉ trích những gì người khác nói","C":"Là tư duy phản tư tập trung vào việc khẳng định và chứng minh cho người khác ý tưởng hay ý kiến của mình","D":"Là tư duy đơn giản, ghi nhớ dữ kiện hoặc mù quáng chấp nhận những gì nghe hay đọc được"}},"367":{"q":"Elevator speech là gì?","o":{"A":"Sự biểu đạt hoặc khả năng biểu đạt suy nghĩ và cảm xúc bằng các âm thanh rõ ràng.","B":"Bài thuyết trình với dữ liệu không liên quan và việc tập dượt bài nói.","C":"Một hành động hay quá trình trình bày một luận điểm để lay động, thúc đẩy hoặc thay đổi cuộc sống của bạn.","D":"Một bài thuyết trình thuyết phục người nghe trong chưa đầy ba mươi giây, hay khoảng một trăm từ."}},"368":{"q":"Phát triển nghề nghiệp (career development) là gì?","o":{"A":"Đó là một quá trình suốt đời, trong đó chúng ta nhận thức, quan tâm, hiểu biết và có kỹ năng về một nghề.","B":"Đó là một phần then chốt của sự phát triển con người khi bản sắc của chúng ta hình thành và cuộc đời mở ra.","C":"Đó là một quá trình phát triển khác nhau ở mỗi người trên hành trình cuộc sống để khám phá chính mình.","D":"Tất cả đều đúng"}},"369":{"q":"Kế hoạch hành động (action plan) là gì?","o":{"A":"Danh sách các bước cụ thể cần làm để đạt một mục tiêu","B":"Một chương trình tập luyện để tăng sức mạnh","C":"Danh sách các mục tiêu cần đạt để có được một tầm nhìn","D":"Kết quả của một bản tự đánh giá"}},"370":{"q":"Giao tiếp phi ngôn ngữ là gì?","o":{"A":"Quá trình truyền đạt thông điệp bằng việc sử dụng lời","B":"Quá trình truyền đạt thông điệp chỉ bằng giao tiếp bằng mắt.","C":"Quá trình truyền đạt thông điệp mà không dùng lời","D":"Quá trình truyền đạt thông điệp chỉ bằng cử chỉ và nét mặt."}},"371":{"q":"Đâu là ví dụ về Quyền lực chuyên gia (Expert Power)?","o":{"A":"Giáo sư được cho là có quyền lực trong lớp học nhờ sự thành thạo một chủ đề cụ thể.","B":"Người giám sát có quyền giao việc.","C":"Lương và thăng chức ở hầu hết công nhân lao động chân tay dựa trên hợp đồng lao động, chứ không phải đánh giá hiệu suất.","D":"Trong nhiều tổ chức, người giám sát và quản lý thực sự không kiểm soát nhiều phần thưởng."}},"372":{"q":"Mục đích chính của một thư xin việc là gì?","o":{"A":"Liệt kê kinh nghiệm làm việc","B":"Cung cấp bản tóm tắt trình độ","C":"Thể hiện cá tính","D":"Tự giới thiệu và giải thích vì sao mình phù hợp với một vị trí."}},"373":{"q":"Phần thân của báo cáo bao gồm những gì?","o":{"A":"Nhãn, báo cáo, tiêu đề đặc điểm, tác giả","B":"Bối cảnh, Phương pháp luận, Kết quả, Phân tích và Khuyến nghị.","C":"Danh sách trích dẫn, danh sách các phần chính, hình ảnh","D":"Nêu bật chủ đề, phương pháp, dữ liệu và kết quả"}},"374":{"q":"Việc đầu tiên cần làm trước khi đi phỏng vấn xin việc là gì?","o":{"A":"Ăn mặc phù hợp","B":"Việc sử dụng ngôn ngữ cơ thể","C":"Đọc kỹ mô tả công việc","D":"Theo dõi kết quả phỏng vấn"}},"375":{"q":"Từ “Logic” trong tiếng Hy Lạp cổ logike có nghĩa là gì?","o":{"A":"Quá trình đặt câu hỏi về thông tin và dữ liệu","B":"Nghĩa là đặt những câu hỏi sâu sắc","C":"Khoa học hoặc nghệ thuật của lập luận","D":"Nó chỉ việc dùng kiến thức, dữ kiện và dữ liệu để giải quyết vấn đề"}},"376":{"q":"Điểm tương đồng giữa Tư duy phản biện và Giải quyết vấn đề là gì?","o":{"A":"Cả hai đều tập trung vào xác định, chọn lựa, bảo vệ giải pháp","B":"Cả hai đều chỉ việc dùng kiến thức, dữ kiện và dữ liệu để giải quyết vấn đề hiệu quả","C":"Chúng là những quá trình hiệu quả và bổ ích","D":"Về cơ bản chúng là quá trình đặt câu hỏi về thông tin và dữ liệu"}},"377":{"q":"Đâu là minh chứng tốt nhất của quyền lực đối trọng (counterpower)?","o":{"A":"B cảm thấy ít cần phải nhượng bộ A hơn vì B chỉ có công việc tạm thời.","B":"B rất dễ bị ảnh hưởng bởi người giám sát.","C":"B có những nguồn quyền lực khác để làm giảm tác động của quyền lực của A.","D":"Tất cả đều sai."}},"378":{"q":"Mục đích của việc đưa người giới thiệu (references) vào résumé là gì?","o":{"A":"Cung cấp thông tin liên lạc của các nhà tuyển dụng cũ","B":"Thể hiện các mối quan hệ nghề nghiệp","C":"Thể hiện uy tín và nhân cách","D":"Liệt kê người giới thiệu cá nhân để đánh giá nhân cách"}},"379":{"q":"Bốn bước tuần hoàn của lộ trình nghề nghiệp (career roadmap) được xác định là gì?","o":{"A":"Hiểu chính mình, Khám phá và lựa chọn các phương án, Tích lũy kiến thức và kinh nghiệm, Tổng hợp tất cả: quy trình tìm việc","B":"Hiểu chính mình, Tăng thu nhập, Có thêm quan hệ kinh doanh, Tổng hợp tất cả: quy trình tìm việc","C":"Hiểu thị trường việc làm, Hiểu về lãnh đạo, Khám phá và lựa chọn các phương án, Cải thiện mức sống của bản thân và gia đình","D":"Hiểu yêu cầu của nhân viên, Khám phá đam mê của bạn, Kiếm tiền, Có quan hệ xã hội"}},"380":{"q":"Bốn nhóm chính nào cung cấp khuôn mẫu cho việc chỉnh sửa tổng quát?","o":{"A":"Định dạng, Dữ kiện, Tên, Chính tả","B":"Định dạng, Tổ chức, Dấu câu, Ngữ pháp","C":"Nội dung, Định dạng, Ngữ pháp, Khả năng đọc hiểu","D":"Nội dung, Tổ chức, Văn phong và Khả năng đọc hiểu"}},"381":{"q":"Ba nhóm chính hay “lĩnh vực” (domains) của các kỹ năng học tập là gì?","o":{"A":"Lĩnh vực nhận thức, Lĩnh vực cảm xúc – thái độ, Lĩnh vực phản tư","B":"Lĩnh vực nhận thức, Lĩnh vực cảm xúc – thái độ, Lĩnh vực chủ động","C":"Lĩnh vực nhận thức, Lĩnh vực cảm xúc – thái độ, Lĩnh vực tâm vận động","D":"Lĩnh vực nhận thức, Lĩnh vực phản tư, Lĩnh vực tâm vận động"}},"382":{"q":"Việc đặt câu hỏi “Mình không thấy điều gì?” giúp bạn như thế nào?","o":{"A":"Làm rõ cách thông tin được xây dựng","B":"Thách thức lập luận","C":"Phát hiện thiên kiến","D":"Phát hiện lập trường của người nói"}},"383":{"q":"Lộ trình nghề nghiệp (career roadmap) chủ yếu nhằm cung cấp điều gì?","o":{"A":"Một kế hoạch chi tiết cho việc nghỉ hưu","B":"Một hướng dẫn từng bước để tìm việc mới hoặc đổi hướng nghề nghiệp","C":"Một danh sách các cơ hội việc làm tiềm năng","D":"Một bản tóm tắt kinh nghiệm làm việc trước đây"}},"384":{"q":"Có thể suy ra điều gì từ Hiệu ứng Dunning–Kruger?","o":{"A":"Những người kém kỹ năng có nhiều khả năng đánh giá thấp năng lực của chính mình.","B":"Những người thể hiện xuất sắc có nhiều khả năng đánh giá thấp năng lực của chính mình.","C":"Những người ít kinh nghiệm và kiến thức nhất không có khả năng đánh giá quá cao năng lực của mình.","D":"Các chuyên gia có xu hướng đánh giá quá cao năng lực của mình."}},"385":{"q":"Điều gì xảy ra ở giai đoạn tưởng tượng (fantasy stage) của phát triển nghề nghiệp?","o":{"A":"Lựa chọn của các bé trai liên quan đến nghề nghiệp của cha chúng","B":"Sở thích là yếu tố chính trong việc chọn nghề trong thời thơ ấu","C":"Nhận biết được việc làm có sẵn","D":"Trẻ em bắt đầu nghĩ về những nghề mà sau này chúng có thể thích làm"}},"386":{"q":"Bạn nên đưa gì vào phần Học vấn trong résumé?","o":{"A":"bằng cấp học thuật, phát triển chuyên môn, chứng chỉ, thực tập","B":"những công việc gần nhất bạn có kinh nghiệm; gồm chức danh, tên nhà tuyển dụng, địa điểm, thời gian làm việc","C":"5–10 kỹ năng bạn đã đạt được trong lĩnh vực của mình","D":"Liên hệ cá nhân"}},"387":{"q":"Bạn nên làm gì ngay sau buổi phỏng vấn xin việc?","o":{"A":"Không làm gì cả","B":"Kiên nhẫn chờ phòng Nhân sự gọi cho bạn","C":"Gửi email cho phòng Nhân sự hỏi về kết quả buổi phỏng vấn","D":"Gửi email cảm ơn người phỏng vấn"}},"388":{"q":"Bạn nên làm gì ngay sau buổi phỏng vấn xin việc?","o":{"A":"Không làm gì cả","B":"Kiên nhẫn chờ phòng Nhân sự gọi cho bạn","C":"Gửi email cho phòng Nhân sự hỏi về kết quả buổi phỏng vấn","D":"Gửi email cảm ơn người phỏng vấn"}},"389":{"q":"Nên thảo luận loại thông tin nào trong phần Bối cảnh (Background) của một đề xuất kinh doanh?","o":{"A":"Những gì hiện có trên thị trường, bao gồm các sản phẩm hoặc dịch vụ cạnh tranh","B":"Ý tưởng về dự án của bạn","C":"Lịch sử sản phẩm, dịch vụ và/hoặc công ty của bạn và mối quan hệ giữa bạn với người mua tiềm năng và/hoặc các công ty tương tự","D":"Thiết kế các tài liệu của bạn"}},"390":{"q":"Nghiên cứu cho thấy loại sinh viên nào ở lại đại học lâu hơn, tập trung vào mục tiêu và có động lực hơn, và có trải nghiệm đại học thỏa mãn, viên mãn hơn?","o":{"A":"Sinh viên có quan hệ xã hội tốt","B":"Sinh viên có kỹ năng lãnh đạo xuất sắc","C":"Sinh viên thể hiện niềm đam mê lớn với các môn mình đang học","D":"Sinh viên sớm tham gia các hoạt động lập kế hoạch nghề nghiệp"}},"391":{"q":"Giao tiếp và đàm phán hiệu quả đóng vai trò gì trong việc giảm xung đột trong nhóm?","o":{"A":"Nó có xu hướng làm xung đột leo thang.","B":"Nó không liên quan đến việc giải quyết xung đột","C":"Nó là công cụ để thấu hiểu các góc nhìn và tìm cách giải quyết vấn đề.","D":"Nó thường cần các chuyên gia đào tạo bên ngoài giúp nhóm phát triển các cơ chế làm việc cùng nhau lâu dài."}},"392":{"q":"Điều gì được coi là phù hợp khi trả lời câu hỏi “Hãy kể về bản thân bạn” trong buổi phỏng vấn xin việc?","o":{"A":"Bắt đầu bằng phần giới thiệu ngắn về sở thích của bạn.","B":"Giới thiệu ngắn gọn về bản thân và tóm tắt các kinh nghiệm làm việc liên quan.","C":"Nói dối hoặc phóng đại.","D":"Nêu bật một vài thành tích hoặc dự án chính thể hiện năng lực và thành công của bạn ở các vai trò trước đây.","E":"Những trải nghiệm tiêu cực"}},"393":{"q":"Bốn yếu tố cấp nhóm nào có thể kết hợp gây ra groupthink?","o":{"A":"Sự gắn kết, sự cô lập, lãnh đạo thiên vị và áp lực ra quyết định","B":"Sự tan rã, sự cô lập, thành viên nhóm thiên vị, áp lực ra quyết định","C":"Sự phụ thuộc, sự gắn kết, lãnh đạo thiên vị, căng thẳng của cá nhân","D":"Sự cô lập, sự tan rã, lãnh đạo cứng rắn, áp lực ra quyết định"}},"394":{"q":"Điều nào là một sự thật về Tư duy sáng tạo?","o":{"A":"Mỗi vấn đề chỉ có một giải pháp hoặc một đáp án đúng","B":"Ý tưởng hoặc đến hoặc không. Không gì giúp được — chắc chắn không phải cấu trúc","C":"Câu trả lời, giải pháp hay phương pháp tốt nhất đã được khám phá rồi","D":"Chỉ một số ít vấn đề đòi hỏi giải pháp công nghệ phức tạp"}},"395":{"q":"Chiến thuật quyền lực nào được dùng trong ví dụ sau? Trong “nghiên cứu Chapel Hill” về cuộc bầu cử tổng thống năm 1968, McCombs và Shaw đã chứng minh mối tương quan mạnh giữa suy nghĩ của một trăm cư dân Chapel Hill về vấn đề bầu cử quan trọng nhất và vấn đề mà truyền thông địa phương đưa tin là quan trọng nhất.","o":{"A":"Kiểm soát quyền tiếp cận thông tin","B":"Dùng có chọn lọc các tiêu chí khách quan","C":"Kiểm soát chương trình nghị sự (agenda)","D":"Sử dụng chuyên gia bên ngoài"}},"396":{"q":"Điều nào sau đây không đúng về résumé?","o":{"A":"Résumé là một bức “selfie” cho mục đích kinh doanh.","B":"Nó là bức tranh bằng văn bản về con người bạn — là công cụ marketing và là sự quảng bá bạn như một ứng viên lý tưởng cho bất kỳ công việc nào bạn quan tâm.","C":"Từ résumé xuất phát từ từ tiếng Pháp résumé, nghĩa là “bản tóm tắt”.","D":"Résumé là để cho gia đình bạn thấy bạn làm gì để kiếm sống."}},"397":{"q":"Lý do nào sau đây là sự biện minh hợp lý cho việc lên lịch hoặc tham dự một cuộc họp nhóm?","o":{"A":"Bạn ghét viết báo cáo và memo","B":"Bạn không muốn tự mình nghiên cứu","C":"Bạn cảm thấy lạc lõng khi thiếu đồng nghiệp","D":"Ý kiến đóng góp và sự tương tác của nhóm là then chốt"}},"398":{"q":"Lựa chọn nào sau đây là tốt nhất cho phần tóm tắt (abstract) của một báo cáo?","o":{"A":"Dự án “Love yourself” là một dự án khởi xướng gồm các hoạt động nhằm hỗ trợ sinh viên đại học tại Việt Nam. Mục tiêu chính của dự án là cung cấp một nền tảng để sinh viên bày tỏ suy nghĩ, cảm xúc nội tâm cùng các hoạt động chăm sóc bản thân, kèm theo các hoạt động chia sẻ, nhận diện và hỗ trợ kịp thời các vấn đề tâm lý sinh viên gặp phải. Nhờ đó, dự án hướng đến tạo môi trường thoải mái để sinh viên thực hành chánh niệm và chăm sóc sức khỏe thể chất, tinh thần.","B":"Dự án “Love yourself” do sinh viên Đại học FPT Cần Thơ thực hiện.","C":"Dự án “Love yourself” sẽ được thực hiện trong vòng 6 tuần.","D":"Dự án “Love yourself” có năm kết quả kỳ vọng."}},"399":{"q":"Điều nào sau đây là một bước để kích thích tư duy sáng tạo?","o":{"A":"Để tâm trí lang thang vài lần mỗi ngày","B":"Tin rằng mọi thứ rồi sẽ ổn","C":"Cưỡng lại thôi thúc tìm hiểu","D":"Xử lý mọi thứ cùng một lúc"}},"400":{"q":"Điều nào sau đây không đúng về trí tuệ văn hóa (cultural intelligence)?","o":{"A":"Trí tuệ văn hóa phát triển khi con người nhận thức rõ hơn về ảnh hưởng của văn hóa.","B":"Một năng lực và kỹ năng gọi là trí tuệ văn hóa giúp con người làm việc và hành xử hiệu quả trong bối cảnh liên văn hóa.","C":"Trí tuệ văn hóa chỉ được phát triển thông qua trải nghiệm du lịch.","D":"Điều chỉnh hành vi của một cá nhân theo các chuẩn mực của các nền văn hóa khác thể hiện một khía cạnh của trí tuệ văn hóa."}},"401":{"q":"Điều nào sau đây nên được thảo luận trong phần Phân tích thị trường (Market Analysis) của một đề xuất kinh doanh?","o":{"A":"Người mua tiềm năng sẽ được lợi gì từ sản phẩm hoặc dịch vụ của bạn?","B":"Hiện có gì trên thị trường và giải pháp của bạn so sánh thế nào?","C":"Người mua tiềm năng sẽ biết gì về bạn?","D":"Mối quan hệ giữa công ty bạn và người mua tiềm năng sẽ được thảo luận thế nào?"}},"402":{"q":"Lựa chọn nào là tốt nhất cho một cuộc họp đòi hỏi sự tiếp xúc gần và hợp tác?","o":{"A":"Dùng bàn tròn hoặc bàn xếp theo hình tròn","B":"Dùng bàn vuông","C":"Dùng bàn chữ nhật","D":"Dùng bàn hình chữ U"}},"403":{"q":"Điều nào sau đây mô tả đúng nhất thuật ngữ “khả năng đọc hiểu” (readability)?","o":{"A":"Nó chỉ là một khía cạnh của tài liệu của bạn.","B":"Nó bao gồm phần giới thiệu, phần thân và phần kết như một phần của tài liệu của bạn.","C":"Nó chỉ khả năng của người đọc trong việc đọc và hiểu tài liệu.","D":"Nó liên quan đến việc chọn từ và cấu trúc ngữ pháp."}},"404":{"q":"Điều nào sau đây là lời khuyên tồi cho cuộc họp nhóm?","o":{"A":"Nhóm kéo dài thời gian họp cho đến khi có quyết định cuối cùng làm hài lòng mọi thành viên.","B":"Nhóm chấp nhận ý chí của đa số dù một số thành viên không thích quyết định đó.","C":"Nhóm tuân theo một chương trình nghị sự đã được phê duyệt để thúc đẩy công việc có trật tự.","D":"Nhóm bảo vệ quyền của mọi thành viên bằng cách bảo đảm ai cũng có quyền phát
